check_types:
  # === Build Steps ===
  - id: forge-build
    name: "Forge build"
    kind: build
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- forge build"
    scopeable: false
    avg_duration: 180

  - id: go-build
    name: "Go build"
    kind: build
    language: go
    command: "go build ./..."
    scopeable: false
    avg_duration: 120

  # === Test Commands ===
  - id: forge-test
    name: "Forge tests"
    kind: test
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- forge test"
    scopeable: true
    scope_flag: "--match-path"
    scope_type: paths
    avg_duration: 3600
    per_unit_duration: 60
    prerequisites: ["forge-build"]
    knobs:
      - name: fuzz_runs
        type: int
        flag: "--fuzz-runs"
        default: 8
        min: 1
        max: 100000
      - name: match_test
        type: string
        flag: "--match-test"
        default: ""
      - name: match_contract
        type: string
        flag: "--match-contract"
        default: ""

  - id: go-test
    name: "Go tests"
    kind: test
    language: go
    command: "go test"
    scopeable: true
    scope_flag: ""
    scope_type: packages
    avg_duration: 7200
    per_unit_duration: 60
    prerequisites: ["go-build"]
    knobs:
      - name: short
        type: bool
        flag: "-short"
        default: true
      - name: race
        type: bool
        flag: "-race"
        default: false
      - name: timeout
        type: string
        flag: "-timeout"
        default: "10m"
      - name: count
        type: int
        flag: "-count"
        default: 1
        min: 1
        max: 10

  # === Linting ===
  - id: golangci-lint
    name: "Go linting"
    kind: lint
    language: go
    command: "just lint-go"
    scopeable: false
    avg_duration: 300

  - id: semgrep
    name: "Semgrep scan"
    kind: lint
    language: "*"
    command: "semgrep scan --config .semgrep/rules/"
    scopeable: false
    avg_duration: 600

  - id: lint-forge-tests
    name: "Forge test naming lint"
    kind: lint
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just lint-forge-tests-check-no-build"
    scopeable: false
    avg_duration: 30

  # === Contract Checks ===
  - id: snapshots-check
    name: "ABI + storage layout snapshots"
    kind: check
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just snapshots-check-no-build"
    scopeable: false
    triggers: ["packages/contracts-bedrock/src/**"]
    avg_duration: 60
    prerequisites: ["forge-build"]

  - id: interfaces-check
    name: "Interface ABI match"
    kind: check
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just interfaces-check-no-build"
    scopeable: false
    triggers: ["packages/contracts-bedrock/src/**", "packages/contracts-bedrock/interfaces/**"]
    avg_duration: 60
    prerequisites: ["forge-build"]

  - id: semver-check
    name: "Semver diff check"
    kind: check
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just semver-diff-check-no-build"
    scopeable: false
    triggers: ["packages/contracts-bedrock/src/**"]
    avg_duration: 60
    prerequisites: ["forge-build"]

  - id: validate-spacers
    name: "Storage spacer validation"
    kind: check
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just validate-spacers-no-build"
    scopeable: false
    triggers: ["packages/contracts-bedrock/src/**"]
    avg_duration: 30
    prerequisites: ["forge-build"]

  - id: reinitializer-check
    name: "Reinitializer guard check"
    kind: check
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just reinitializer-check-no-build"
    scopeable: false
    triggers: ["packages/contracts-bedrock/src/**"]
    avg_duration: 30
    prerequisites: ["forge-build"]

  - id: go-mod-tidy
    name: "Go mod tidy check"
    kind: check
    language: go
    command: "go mod tidy && git diff --exit-code go.mod go.sum"
    scopeable: false
    triggers: ["go.mod", "go.sum"]
    avg_duration: 30
