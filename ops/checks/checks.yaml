checks:
  # === Build Steps ===
  - id: go-build
    name: "Go build"
    kind: build
    language: go
    command: "go build ./..."
    avg_duration: 120
    packages: ["*"]

  - id: forge-build
    name: "Forge build (contracts-bedrock)"
    kind: build
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- forge build"
    avg_duration: 180
    directories: ["packages/contracts-bedrock/src"]

