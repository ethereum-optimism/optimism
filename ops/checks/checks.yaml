  # === Linting ===
  - id: golangci-lint
    name: "Go linting"
    kind: lint
    language: go
    command: "just lint-go"
    avg_duration: 300
    packages: ["*"]

  - id: semgrep
    name: "Semgrep scan"
    kind: lint
    language: "*"
    command: "semgrep scan --config .semgrep/rules/"
    avg_duration: 600
    file_patterns: ["**/*.go", "**/*.sol"]

  - id: go-mod-tidy
    name: "Go mod tidy check"
    kind: check
    language: go
    command: "go mod tidy && git diff --exit-code go.mod go.sum"
    avg_duration: 30
    file_patterns: ["go.mod", "go.sum"]

  # === Contract Checks ===
  - id: snapshots-check
    name: "ABI + storage layout snapshots"
    kind: check
    language: solidity
    command: "cd packages/contracts-bedrock && mise exec -- just snapshots-check-no-build"
    avg_duration: 60
    directories: ["packages/contracts-bedrock/src"]
    prerequisites: ["forge-build"]

