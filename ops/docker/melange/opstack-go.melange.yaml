  - name: op-node
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/op-node ${{targets.subpkgdir}}/usr/bin/

  - name: op-proposer
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/op-proposer ${{targets.subpkgdir}}/usr/bin/

  - name: op-supervisor
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/op-supervisor ${{targets.subpkgdir}}/usr/bin/

  - name: op-supernode
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/op-supernode ${{targets.subpkgdir}}/usr/bin/

  - name: op-test-sequencer
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
