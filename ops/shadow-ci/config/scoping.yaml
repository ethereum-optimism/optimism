# Confidence threshold: targets below this score are treated as always-run.
confidence_threshold: 0.9

# How long a target must be in the always-run list without a false negative
# before it's eligible for scoping.
always_run_graduation_weeks: 8

# Special paths that force ALL jobs.
force_all_paths:
  - ".circleci/"
  - "mise.toml"

# Always-run targets by language.
# These start large and shrink as the graph proves itself.
always_run:
  go:
    - "github.com/ethereum-optimism/optimism/op-e2e/system"
    - "github.com/ethereum-optimism/optimism/op-e2e/faultproofs"
  sol:
    - "test/invariants/"
  rust: []

# Job categories — every job in the CI maps to a category.
# Shadow CI decides per-category whether to run, skip, or defer.
#
# Groups control which CI executor job runs a category:
#   build — runs in shadow-ci-build (installs all toolchains)
#   go    — runs in shadow-ci-go (Go + gotestsum)
#   sol   — runs in shadow-ci-sol (Foundry)
#   rust  — runs in shadow-ci-rust (Rust toolchain)
#   misc  — runs in shadow-ci-misc (shellcheck, semgrep, etc.)
#   (empty) — decision-only, shadow CI decides but mainline executes
job_categories:
  # === BUILDS ===
  contracts_build:
    group: build
    trigger_paths:
      - "packages/contracts-bedrock/"
      - "op-deployer/"
    always_on_develop: true
    command: |
      cd packages/contracts-bedrock && just forge-build --deny-warnings --skip test && cd ../../op-deployer && just copy-contract-artifacts
    workspace_paths:
      - "packages/contracts-bedrock/forge-artifacts"
      - "packages/contracts-bedrock/cache"
      - "packages/contracts-bedrock/artifacts"
      - "op-deployer/pkg/deployer/artifacts/forge-artifacts"
    cache_inputs:
      - "packages/contracts-bedrock/src/"
      - "packages/contracts-bedrock/foundry.toml"
      - "op-deployer/"
    runner: medium
    description: "Build Solidity contracts (forge-build)"

  cannon_prestate:
    group: build
    trigger_paths:
      - "cannon/"
      - "op-program/"
      - "rust/"
    always_on_develop: true
    depends_on: ["contracts_build"]
    command: |
      make cannon-prestates
    workspace_paths:
      - "op-program/bin"
      - "cannon/bin"
    cache_inputs:
      - "cannon/"
      - "op-program/"
      - "rust/"
      - "packages/contracts-bedrock/src/"
    runner: large
    description: "Build cannon prestates for fault proofs"

  rust_build:
    group: build
    trigger_paths:
      - "rust/"
    always_on_develop: true
    command: |
      cd rust && cargo build --release --workspace
    workspace_paths:
      - "rust/target/release"
    runner: large
    description: "Build Rust binaries (kona, op-reth)"

  rust_submodule_build:
    group: build
    trigger_paths:
      - "op-rbuilder/"
      - "rollup-boost/"
    depends_on: ["rust_build"]
    command: |
      git submodule deinit -f op-rbuilder rollup-boost 2>/dev/null || true
      git submodule update --init --recursive op-rbuilder rollup-boost && \
      cd op-rbuilder && cargo build --release
    workspace_paths:
      - "op-rbuilder/target/release"
    runner: large
    description: "Build Rust submodule binaries (op-rbuilder, rollup-boost)"

  docker_build:
    trigger_paths:
      - "ops/docker/"
      - "op-deployer/"
    schedule_only: false
    command: |
      ops/docker/build.sh
    description: "Build Docker images"

  # === GO TESTS ===
  go_tests:
    group: go
    use_graph: true
    language: go
    depends_on: ["contracts_build"]
    command: |
      make go-tests-short-ci
    target_command: |
      make cannon-elf
      mkdir -p ./tmp/test-results ./tmp/testlogs
      gotestsum --format=testname \
        --junitfile=./tmp/test-results/results.xml \
        --jsonfile=./tmp/testlogs/log.json \
        --rerun-fails=3 \
        --rerun-fails-max-failures=50 \
        --packages="{{targets}}" \
        -- -parallel=$(nproc 2>/dev/null || echo 4) -short -count=1 -timeout=10m -tags="ci"
    description: "Go unit tests (gotestsum, 12-node PR / 16-node develop)"

  go_fuzz:
    group: go
    use_graph: true
    language: go
    depends_on: ["contracts_build"]
    fuzz_packages:
      - package: op-challenger
        trigger_paths: ["op-challenger/"]
      - package: op-node
        trigger_paths: ["op-node/"]
      - package: op-service
        trigger_paths: ["op-service/"]
      - package: op-chain-ops
        trigger_paths: ["op-chain-ops/"]
      - package: cannon
        trigger_paths: ["cannon/", "packages/contracts-bedrock/src/cannon/"]
        needs_artifacts: true
      - package: op-e2e
        trigger_paths: ["op-e2e/", "packages/contracts-bedrock/src/"]
        needs_artifacts: true
    description: "Go fuzz tests per package"

  go_fault_proofs:
    group: go
    trigger_paths:
      - "op-e2e/"
      - "cannon/"
      - "op-program/"
      - "packages/contracts-bedrock/src/"
    depends_on: ["contracts_build", "cannon_prestate"]
    develop_only: true
    command: |
      make go-tests-fraud-proofs-ci
    description: "Fault proof e2e tests (develop only, 480min timeout)"

  cannon_tests:
    group: go
    trigger_paths:
      - "cannon/"
      - "packages/contracts-bedrock/src/cannon/"
    depends_on: ["contracts_build"]
    command: |
      cd cannon && make lint test
    description: "Cannon Go lint and test"

  go_lint:
    group: go
    trigger_paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"
      - "linter/"
    command: |
      make lint-go
    description: "Go lint (custom golangci-lint wrapper)"

  # === SOLIDITY TESTS ===
  sol_tests:
    group: sol
    use_graph: true
    language: sol
    depends_on: ["contracts_build"]
    feature_matrix:
      - main
      - CUSTOM_GAS_TOKEN
      - OPTIMISM_PORTAL_INTEROP
      - OPCM_V2
      - OPCM_V2,CUSTOM_GAS_TOKEN
      - OPCM_V2,OPTIMISM_PORTAL_INTEROP
    profiles:
      pr: liteci
      develop: ci
    command: |
      cd packages/contracts-bedrock && just build-go-ffi && FOUNDRY_PROFILE=liteci forge test
    target_command: |
      cd packages/contracts-bedrock && just build-go-ffi && FOUNDRY_PROFILE=liteci forge test --match-path "{{targets_glob}}"
    description: "Solidity tests with feature matrix"

  sol_upgrade:
    group: sol
    trigger_paths:
      - "packages/contracts-bedrock/"
    depends_on: ["contracts_build", "sol_tests"]
    chains:
      - { chain: op, base: mainnet }
      - { chain: base, base: mainnet }
      - { chain: ink, base: mainnet }
      - { chain: unichain, base: mainnet }
    command: |
      cd packages/contracts-bedrock && just build-go-ffi && ETH_RPC_URL=https://ci-mainnet-l1-archive.optimism.io FORK_OP_CHAIN=op FORK_BASE_CHAIN=mainnet FOUNDRY_FUZZ_SEED=42424242 FOUNDRY_FUZZ_RUNS=1 FOUNDRY_PROFILE=ci just test-upgrade
    description: "Solidity upgrade tests on fork chains"

  sol_heavy_fuzz:
    group: sol
    trigger_paths:
      - "packages/contracts-bedrock/"
    depends_on: ["contracts_build"]
    schedule_only: true
    command: |
      cd packages/contracts-bedrock && FOUNDRY_PROFILE=ciheavy forge test
    description: "Heavy fuzz nightly (ciheavy profile)"

  sol_coverage:
    group: sol
    trigger_paths:
      - "packages/contracts-bedrock/"
    depends_on: ["contracts_build", "sol_tests"]
    command: |
      cd packages/contracts-bedrock && forge coverage
    description: "Solidity coverage reports"

  sol_checks:
    group: sol
    trigger_paths:
      - "packages/contracts-bedrock/"
    depends_on: ["contracts_build"]
    checks:
      - semver-lock-no-build
      - semver-diff-check-no-build
      - validate-deploy-configs
      - lint
      - snapshots-check-no-build
      - interfaces-check-no-build
      - reinitializer-check-no-build
      - size-check
      - unused-imports-check-no-build
      - strict-pragma-check-no-build
      - validate-spacers-no-build
      - opcm-upgrade-checks-no-build
    command: |
      cd packages/contracts-bedrock && for check in semver-lock-no-build semver-diff-check-no-build validate-deploy-configs lint snapshots-check-no-build interfaces-check-no-build reinitializer-check-no-build size-check unused-imports-check-no-build strict-pragma-check-no-build validate-spacers-no-build opcm-upgrade-checks-no-build; do echo "=== $check ===" && just $check || exit 1; done
    description: "Solidity static checks"

  # === ACCEPTANCE TESTS ===
  acceptance_tests:
    group: go
    trigger_paths:
      - "op-node/"
      - "op-batcher/"
      - "op-proposer/"
      - "op-challenger/"
      - "op-supervisor/"
      - "op-program/"
      - "packages/contracts-bedrock/"
      - "op-e2e/"
      - "rust/"
    depends_on: ["contracts_build", "cannon_prestate", "rust_build"]
    always_on_develop: true
    command: |
      make op-acceptance-tests
    description: "Sysgo acceptance tests (gateless)"

  # === RUST CI ===
  rust_ci:
    group: rust
    trigger_paths:
      - "rust/"
    checks:
      - fmt
      - clippy
      - deny
      - zepter
      - typos
      - docs
      - doctest
      - cargo-tests
    command: |
      cd rust && just install-nightly && just lint && just test
    description: "Rust CI checks and tests"

  rust_e2e:
    group: rust
    trigger_paths:
      - "rust/"
      - "op-rbuilder/"
      - "rollup-boost/"
    depends_on: ["rust_build", "rust_submodule_build"]
    configs:
      - simple-kona
      - simple-kona-geth
      - simple-kona-sequencer
      - large-kona-sequencer
    description: "Rust e2e tests (sysgo devnet)"

  # === LINT & CHECKS ===
  semgrep:
    group: misc
    trigger_paths:
      - "packages/contracts-bedrock/"
      - ".semgrep/"
    command: |
      semgrep --config .semgrep/ packages/contracts-bedrock/
    description: "Semgrep security scanning"

  shell_check:
    group: misc
    trigger_paths:
      - "**/*.sh"
      - "ops/"
    command: |
      find . -name '*.sh' -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/.git/*' | xargs shellcheck --severity=warning
    description: "ShellCheck linting"

  generated_mocks:
    group: go
    trigger_paths:
      - "op-node/"
      - "op-service/"
    command: |
      make generate-mocks-op-node && make generate-mocks-op-service && git diff --exit-code --ignore-submodules
    description: "Check generated mocks are up to date"

  todo_issues:
    group: misc
    always: true
    command: |
      scripts/todo-checker.sh || true
    description: "Check TODO/FIXME annotations"

  kontrol:
    group: sol
    trigger_paths:
      - "packages/contracts-bedrock/src/L1/OptimismPortal2.sol"
      - "packages/contracts-bedrock/src/universal/CrossDomainMessenger.sol"
      - "packages/contracts-bedrock/src/L1/L1StandardBridge.sol"
      - "packages/contracts-bedrock/src/L2/L2StandardBridge.sol"
    depends_on: ["contracts_build"]
    develop_only: true
    description: "Kontrol formal verification"

  # === PUBLISHING ===
  publish_cannon_prestates:
    trigger_paths:
      - "cannon/"
      - "op-program/"
    depends_on: ["cannon_prestate"]
    develop_only: true
    description: "Publish cannon prestates to GCS"

  publish_contract_artifacts:
    tag_only: true
    tag_pattern: "op-contracts/v.*"
    depends_on: ["contracts_build"]
    description: "Publish contract artifacts to GCS"

  docker_publish:
    schedule_only: true
    depends_on: ["docker_build"]
    description: "Publish multi-platform Docker images"

  # === FLAKE SHAKE ===
  flake_shake:
    schedule_only: true
    description: "Flake shake testing (daily)"

  # === SYNC TESTS ===
  sync_tests:
    schedule_only: true
    networks:
      - op-sepolia
      - base-sepolia
      - unichain-sepolia
      - op-mainnet
      - base-mainnet
    sync_modes:
      - consensus-layer
      - execution-layer
    description: "Sync tests across networks (daily)"

# Acceptance test gate mapping.
acceptance_gates:
  base:
    trigger_paths:
      - "op-node/"
      - "op-batcher/"
      - "op-proposer/"
      - "op-program/"
      - "packages/contracts-bedrock/src/L1/"
      - "packages/contracts-bedrock/src/L2/"
    always: true
  isthmus:
    trigger_paths:
      - "op-node/rollup/derive/isthmus"
      - "packages/contracts-bedrock/src/L2/"
  interop:
    trigger_paths:
      - "op-supervisor/"
      - "op-node/rollup/interop/"
      - "packages/contracts-bedrock/src/L2/CrossL2Inbox.sol"
      - "packages/contracts-bedrock/src/L2/L2ToL2CrossDomainMessenger.sol"
  cgt:
    trigger_paths:
      - "packages/contracts-bedrock/src/libraries/GasPayingToken.sol"
      - "packages/contracts-bedrock/src/L1/SystemConfig.sol"

# Activation controls what's enabled.
activation:
  mode: shadow  # shadow | belt-and-suspenders | primary
  languages:
    go: true
    sol: true
    rust: true
  agents:
    flake_investigator: true
    graph_maintainer: true
    config_verifier: true
    report_analyst: true
  comparison:
    required: false  # true in belt-and-suspenders mode
