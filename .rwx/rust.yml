      artifacts:
        - key: report
          path: .ci/rust-workspace/compiler-baseline/features-2

  - key: features-2
    use: [features-build-2, head-source]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh features
    env:
      <<: *fresh-rust-env
      CI_RUST_INCREMENTAL: ${{ init.cargo-incremental }}
