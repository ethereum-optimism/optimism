# Rust workspace builds, tests, cross-compilation and source checks. Circle retains required gates.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [tests-cache, tests-build, build, clippy, docs, no-std, udeps, features-build-0, features-build-1, features-build-2, features-build-3, features-build-4, features-build-5, features-build-6, features-build-7, features-build-8, features-build-9, wasm-unknown, wasm-wasi, registry, cannon-env, cannon-go, cannon-witness, cannon-build]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-epoch: v1
      cargo-incremental: "0"
      cache-warm: "true"
  # Automatic pushes are coordinated by pr-gates.yml; CLI and warming remain.
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-epoch: v1
      cargo-incremental: "0"
      cache-warm: "false"

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

# Cache-only vault: no publishing credentials. Only develop may write;
# PRs restore the protected shared baseline and compile changes locally.
tool-cache:
  vault: optimism-op-reth-shadow

defaults:
  runner:
    cpus: 2
    memory: 8gb

aliases:
  rust-env: &rust-env
    CI_RUST_PROVIDER: rwx
    CI_COMMIT_SHA: ${{ init.commit-sha }}

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []
      artifacts:
        - key: mise-config
          path: mise.toml
        - key: ci-scripts
          path: ops/ci/runtime
        - key: apt-script
          path: ops/ci/runtime/apt-install.sh

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  # Artifact dependencies avoid inheriting the checkout's Git history into
  # reusable tools. Language toolchains are added only by their own workload.
  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_EVENT: push
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json

  - key: helper-tests
    use: [code, tools]
    run: |
      python3 -m unittest discover -s ops/ci/tests -p 'test_rust_workspace.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_rust_compiler_baseline.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_rust_dependencies.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_rwx_materialize_linker.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_rust_target_cache.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_rust_cannon.py'
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: rust-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-rust.yml
    with:
      mode: workspace

  - key: wasm-tools
    use: rust-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: rustup target add wasm32-unknown-unknown wasm32-wasip1
    timeout: 30m

  - key: lint-tools
    use: rust-tools
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    run: |
      mise install github:ggwpez/zepter github:crate-ci/typos github:EmbarkStudios/cargo-deny
      printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
    timeout: 30m

  - key: go-tools
    use: rust-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  # Fetch from the immutable compiler ancestor, so source-only edits reuse the
  # same Cargo registry/checkouts even when PRs cannot write shared tool caches.
  - key: rust-dependencies
    use: compiler-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: python3 ops/ci/runtime/rust-dependencies.py
    env:
      COMPILER_CACHE_EPOCH: ${{ init.cache-epoch }}
    timeout: 30m
    outputs:
      filesystem:
        filter:
          workspace: [.ci/rust-cache/cargo]
          system: []
      artifacts:
        - key: report
          path: .ci/rust-dependencies

  # Keep full source, Git metadata and the pinned submodule as build inputs.
  - key: head-source
    use: [rust-dependencies, code]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: |
      git reset --hard "$CI_COMMIT_SHA"
      git clean -fdx -- rust
      bash /usr/local/lib/optimism-ci/op-reth-shadow.sh source
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    timeout: 15m

  # Anchor compiler preparation at the last compiler/configuration change.
  # Ordinary source edits reuse these immutable task results without granting
  # PRs shared-cache writes. Fresh HEAD workers below still run every verdict.
  - key: compiler-base
    use: code
    run: python3 ops/ci/runtime/rust-target-cache.py base > "$RWX_VALUES/sha"
    outputs:
      filesystem: false

  - key: compiler-code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ tasks.compiler-base.values.sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  # Build the ancestor toolchain from ancestor inputs too. Depending on the
  # HEAD toolchain would carry changing checkout metadata into the cache key.
  - key: compiler-tools
    use: [mise, compiler-code]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: compiler-rust-tools
    use: [compiler-code, compiler-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-rust.yml
    with:
      mode: workspace

  - key: compiler-source
    use: [compiler-rust-tools, compiler-code]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: |
      git reset --hard "$COMPILER_BASE_SHA"
      git clean -fdx -- rust
      bash /usr/local/lib/optimism-ci/op-reth-shadow.sh source
    env:
      COMPILER_BASE_SHA: ${{ tasks.compiler-base.values.sha }}
    timeout: 15m

  - key: tests-cache
    use: rust-dependencies
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: python3 ops/ci/runtime/rust-compiler-baseline.py tests-build
    env: &compiler-base-env
      COMPILER_CACHE_EPOCH: ${{ init.cache-epoch }}
      CI_RUST_PROVIDER: rwx
      CI_COMMIT_SHA: ${{ tasks.compiler-base.values.sha }}
      CI_RUST_INCREMENTAL: ${{ init.cargo-incremental }}
    timeout: 90m
    runner: &test-runner
      cpus: 16
      memory: 32gb
      disk: 150gb
    outputs:
      filesystem: &test-compiler-output
        filter:
          workspace: [rust/target, .ci/rust-cache, rust/op-reth/crates/chainspec/res/superchain-configs.tar]
          system: []
      artifacts:
        - key: report
          path: .ci/rust-workspace/compiler-baseline/tests-build

  - key: tests-build
    use: [tests-cache, head-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh tests-build
    env: &incremental-rust-env
      <<: *rust-env
      CI_RUST_INCREMENTAL: ${{ init.cargo-incremental }}
    # Compile the current source afresh using the ancestor's compiler state.
    cache: false
    timeout: 90m
    runner: *test-runner
    outputs:
      filesystem: *test-compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/tests-build
        - key: compiler-state
          path: .ci/rust-workspace/tests-build/compiler.json

  # Execution-only nextest workers receive the verified test archive, never the
  # full compiler snapshot.
  - key: tests-unit
    use: head-source
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh tests-unit
    env:
      <<: *incremental-rust-env
      TEST_ARCHIVE: ${{ tasks.tests-build.artifacts.report }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    timeout: 90m
    runner: *test-runner
    outputs:
      filesystem: false
      test-results:
        - path: .ci/rust-workspace/tests-unit/junit.xml
      artifacts:
        - key: report
          path: .ci/rust-workspace/tests-unit

  # Compiler-dependent verdicts inherit the producer's immutable filesystem.
  # Publish reports only: never pack, restore or republish the compiler tree.
  - key: tests-compiler
    use: [tests-build, head-source]
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh tests-compiler
    env:
      <<: *incremental-rust-env
      COMPILED_STATE: ${{ tasks.tests-build.artifacts.compiler-state }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    timeout: 90m
    runner: *test-runner
    outputs:
      filesystem: false
      test-results:
        - path: .ci/rust-workspace/tests-compiler/beacon.junit.xml
        - path: .ci/rust-workspace/tests-compiler/doctests.junit.xml
      artifacts:
        - key: report
          path: .ci/rust-workspace/tests-compiler

  # Preserve the existing full-suite artifact and task key. Finished expressions
  # collect original child failures; compiler layers never reach this fan-in.
  - key: tests
    use: head-source
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    after: ${{ tests-unit.finished && tests-compiler.finished }}
    run: bash ops/ci/runtime/rust-workspace.sh tests-merge
    env:
      <<: *incremental-rust-env
      UNIT_REPORT: ${{ tasks.tests-unit.artifacts.report }}
      COMPILER_REPORT: ${{ tasks.tests-compiler.artifacts.report }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: report
          path: .ci/rust-workspace/tests

  - key: doctest
    use: head-source
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh doctest
    env: &fresh-rust-env
      <<: *rust-env
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    tool-cache: rust-workspace-doctest-${{ init.cache-epoch }}
    timeout: 90m
    runner: &build-runner
      cpus: 16
      memory: 32gb
    outputs:
      filesystem: &compiler-output
        filter:
          workspace: [rust/target, .ci/rust-cache, rust/op-reth/crates/chainspec/res/superchain-configs.tar]
          system: []
      test-results:
        - path: .ci/rust-workspace/doctest/doctests.junit.xml
      artifacts:
        - key: report
          path: .ci/rust-workspace/doctest

  - key: build
    use: head-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh build
    env: *fresh-rust-env
    tool-cache: rust-workspace-build-${{ init.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: *compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/build

  - key: docs
    use: head-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh docs
    env: *fresh-rust-env
    tool-cache: rust-workspace-docs-${{ init.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: *compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/docs

  - key: clippy
    use: head-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh clippy
    env: *fresh-rust-env
    tool-cache: rust-workspace-clippy-${{ init.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: *compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/clippy

  - key: no-std
    use: head-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh no-std
    env: *fresh-rust-env
    tool-cache: rust-workspace-no-std-${{ init.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 2
      memory: 4gb
    outputs:
      filesystem: *compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/no-std

  - key: udeps
    use: head-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh udeps
    env: *fresh-rust-env
    tool-cache: rust-workspace-udeps-${{ init.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: *compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/udeps

  # Reuse compiler preparation; the separate consumer always checks this PR afresh.
  - key: features-build-0
    use: rust-dependencies
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: python3 ops/ci/runtime/rust-compiler-baseline.py features
    env:
      <<: *compiler-base-env
      CI_RUST_INCREMENTAL: ${{ init.cargo-incremental }}
      CI_RUST_PARTITION_INDEX: "0"
      CI_RUST_PARTITION_TOTAL: "10"
    timeout: 120m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: *compiler-output
      artifacts:
        - key: report
          path: .ci/rust-workspace/compiler-baseline/features-0

  - key: features-0
    use: [features-build-0, head-source]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-rust-ci == 'true' }}
    run: bash ops/ci/runtime/rust-workspace.sh features
    env:
      <<: *fresh-rust-env
      CI_RUST_INCREMENTAL: ${{ init.cargo-incremental }}
      CI_RUST_PARTITION_INDEX: "0"
      CI_RUST_PARTITION_TOTAL: "10"
    cache: false
    timeout: 120m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: false
      artifacts:
        - key: report
          path: .ci/rust-workspace/features-0

  # Reuse compiler preparation; the separate consumer always checks this PR afresh.
  - key: features-build-1
    use: rust-dependencies
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-ci == 'true' }}
    run: python3 ops/ci/runtime/rust-compiler-baseline.py features
    env:
