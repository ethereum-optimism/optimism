# Optional shadow checks. CircleCI remains responsible for the required gates.
# Pushes include Bailiff's human-authorized external-fork branches and GitHub's
# gh-readonly-queue branches. Avoid a second pull_request trigger for those SHAs.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [go-lint-tools, rust-fmt-tools]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        tag: ${{ event.git.tag }}
      status-checks:
        default:
          name: optimism-pilot
        custom:
          - name: optimism-gate-rust-fmt
            tasks: rust-gate-receipt
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  # This public checkout deliberately has no GitHub token or vault access.
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci, .circleci/scripts/apt-install.sh]
    outputs:
      filesystem: false
      artifacts:
        - key: mise-config
          path: mise.toml
        - key: ci-scripts
          path: ops/ci
        - key: apt-script
          path: .circleci/scripts/apt-install.sh

  # Pin mise itself separately from the language/tool versions in mise.toml.
  # Bootstrap in an empty workspace: mise/install 1.1.0 exports tool-version
  # keys verbatim and cannot read this repo's namespaced tool aliases safely.
  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  # Artifact dependencies avoid inheriting the checkout's Git history into
  # reusable tools. Language toolchains are added only by their own workload.
  - key: tools
    use: mise
    run: |
      mkdir -p ops/ci .circleci/scripts
      cp "$MISE_CONFIG" mise.toml
      cp "$CI_SCRIPTS/rwx-prepare.sh" ops/ci/
      cp "$APT_SCRIPT" .circleci/scripts/apt-install.sh
      bash ops/ci/rwx-prepare.sh
    env:
      MISE_CONFIG: ${{ tasks.bootstrap-inputs.artifacts.mise-config }}
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
      APT_SCRIPT: ${{ tasks.bootstrap-inputs.artifacts.apt-script }}
    filter:
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-prepare.sh]
    timeout: 30m

  - key: go-lint-tools
    use: tools
    run: bash ops/ci/rwx-prepare.sh go-lint
    timeout: 30m

  - key: rust-fmt-tools
    use: tools
    run: bash ops/ci/rwx-prepare.sh rust
    timeout: 30m

  - key: route
    use: [code, tools]
    run: bash ops/ci/rwx-metadata.sh
    env:
      CI_EVENT: push
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json

  - key: routing-tests
    use: [code, tools]
    run: |
      mise exec -- bash ops/ci/test-decision-tree.sh
      mise exec -- python -m unittest ops/ci/test_rwx_metadata.py
      mise exec -- python ops/ci/test_compare_ci.py
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  # Preserve the superchain bundle's existing verification before Go consumes it.
  - key: prep-superchain
    use: [code, go-lint-tools]
    if: ${{ tasks.route.values.run-main == 'true' }}
    run: mise exec -- just build-superchain-go
    cache: false
    timeout: 15m

  - key: go-lint
    use: prep-superchain
    if: ${{ tasks.route.values.run-main == 'true' }}
    run: |
      mise exec -- just lint-go
      mise exec -- bash ops/prestate-reproducibility/test-build-prestates.sh
    cache: false
    timeout: 30m
    runner:
      cpus: 8
      memory: 32gb
    outputs:
      filesystem: false

  - key: rust-fmt
    use: [code, rust-fmt-tools]
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    run: |
      mise exec -- just update-superchain-registry-submodule
      cd rust
      mise exec -- just fmt-check
      mise exec -- just check-upstream-mirrors
    cache: false
    timeout: 20m
    outputs:
      filesystem: false

  # Terminal task states preserve exact Rust dependencies without Main-only failures.
  - key: rust-gate-receipt
    use: [code, tools]
    after: ${{ (rust-fmt.succeeded || rust-fmt.failed || rust-fmt.skipped) }}
    run: python3 ops/ci/pr-gate.py receipt rust-fmt
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      GROUP_SELECTED: ${{ tasks.route.values.run-rust-ci }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
      TASK_RUST_FMT_SUCCEEDED: ${{ tasks.rust-fmt.succeeded }}
      TASK_RUST_FMT_FAILED: ${{ tasks.rust-fmt.failed }}
      TASK_RUST_FMT_SKIPPED: ${{ tasks.rust-fmt.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/rust-fmt
