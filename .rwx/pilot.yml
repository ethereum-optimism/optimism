# Optional shadow checks. CircleCI remains responsible for the required gates.
# Pushes include Bailiff's human-authorized external-fork branches and GitHub's
# gh-readonly-queue branches. Avoid a second pull_request trigger for those SHAs.
on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        tag: ${{ event.git.tag }}
      status-checks:
        name: optimism-pilot
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  # This public checkout deliberately has no GitHub token or vault access.
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  # Pin mise itself separately from the language/tool versions in mise.toml.
  # Bootstrap in an empty workspace: mise/install 1.1.0 exports tool-version
  # keys verbatim and cannot read this repo's namespaced tool aliases safely.
  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  # A content-cached filesystem layer shared by every check below. Keep only
  # tool installation inputs in its cache key, not unrelated source changes.
  - key: tools
    use: [code, mise]
    run: bash ops/ci/rwx-prepare.sh
    filter: [mise.toml, ops/ci/rwx-prepare.sh, .circleci/scripts/apt-install.sh]
    timeout: 30m

  - key: route
    use: [code, tools]
    run: bash ops/ci/rwx-metadata.sh
    env:
      CI_EVENT: push
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json

  - key: routing-tests
    use: [code, tools]
    run: |
      mise exec -- bash ops/ci/test-decision-tree.sh
      mise exec -- python -m unittest ops/ci/test_rwx_metadata.py
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  # Preserve the superchain bundle's existing verification before Go consumes it.
  - key: prep-superchain
    use: [code, tools]
    if: ${{ tasks.route.values.run-main == 'true' }}
    run: mise exec -- just build-superchain-go
    cache: false
    timeout: 15m

  - key: go-lint
    use: prep-superchain
    if: ${{ tasks.route.values.run-main == 'true' }}
    run: |
      mise exec -- just lint-go
      mise exec -- bash ops/prestate-reproducibility/test-build-prestates.sh
    cache: false
    timeout: 30m
    runner:
      cpus: 8
      memory: 32gb
    outputs:
      filesystem: false

  - key: rust-fmt
    use: [code, tools]
    if: ${{ tasks.route.values.run-rust-ci == 'true' }}
    run: |
      mise exec -- just update-superchain-registry-submodule
      cd rust
      mise exec -- just fmt-check
      mise exec -- just check-upstream-mirrors
    cache: false
    timeout: 20m
    outputs:
      filesystem: false
