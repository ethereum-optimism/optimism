# Full Rust E2E shadows. CircleCI retains all required gates.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [go, contracts, release, prestate, compile-proof, compile-restart, compile-simple-kona, compile-simple-kona-sequencer, compile-op-reth]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "true"
      cache-epoch: v1
      build-probe: ""
      target-cache-mode: keep
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "false"
      cache-epoch: v1
      build-probe: ""
      target-cache-mode: keep

# Shared cache baseline: only develop may write; PRs restore it read-only.
tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  # The filtered bootstrap layer keeps the checkout's Git history out of
  # reusable tools. Language toolchains are added only by their own workload.
  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: go-build-tools
    use: tools
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: contract-tools
    use: [bootstrap-inputs, tools]
    call: ${{ run.dir }}/packages/toolchain-foundry.yml
    with:
      mode: anvil

  - key: rust-tools
    use: [bootstrap-inputs, tools]
    call: ${{ run.dir }}/packages/toolchain-rust.yml
    with:
      mode: e2e

  - key: helper-tests
    use: [code, go-build-tools, contract-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-rust-e2e-ci == 'true' }}
    run: |
      bash ops/ci/runtime/apt-install.sh zstd
      RWX_LIVE_GO_FIXTURE=1 RWX_LIVE_FORGE_FIXTURE=1 python3 -m unittest discover -s ops/ci/tests -p 'test_rust_e2e.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_rust_e2e_release.py'
      python3 -m unittest discover -s ops/ci/tests -p 'test_go_artifacts.py'
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: source
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    run: |
      git submodule sync --recursive
      git submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
    timeout: 20m

  - key: rust-dependencies
    use: [source, rust-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    run: |
      export CARGO_HOME="$PWD/.ci/rust-cache/cargo"
      cd rust
      attempt=0
      until cargo fetch --locked; do
        attempt=$((attempt + 1))
        if [[ "$attempt" -ge 5 ]]; then exit 1; fi
        sleep "$((2 ** attempt))"
      done
    filter: [rust, mise.toml]
    tool-cache: op-reth-dependencies-${{ init.cache-epoch }}
    timeout: 30m
    outputs:
      filesystem:
        filter:
          workspace: [.ci/rust-cache/cargo]
          system: []

  - key: head-source
    use: [source, rust-dependencies]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    run: 'true'

  # Each dependency builds from the commit that last changed its build inputs, so the
  # build is a cache hit for later commits and for the other workloads of the run.
  - key: dependency-plan
    use: code
    run: python3 ops/ci/runtime/go-dependency-source.py plan
    outputs:
      filesystem: false

  - key: go-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.go }}

  - key: go
    use: [go-build-tools, go-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    call: ${{ run.dir }}/packages/go-go.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.go }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: contracts
    use: [source, contract-tools, go-build-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    call: ${{ run.dir }}/packages/rust-e2e-contracts.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: release
    use: [rust-tools, head-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    call: ${{ run.dir }}/packages/rust-e2e-release.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      cache-epoch: ${{ init.cache-epoch }}

  - key: prestate-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.prestate }}

  - key: prestate
    use: [go-build-tools, prestate-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    call: ${{ run.dir }}/packages/go-prestate.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.prestate }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: runtime-tools
    use: [go-build-tools, contract-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    run: |
      mise install go:github.com/ethereum/go-ethereum/cmd/geth
      printf '%s\n' "$(mise bin-paths | paste -sd: -):$PATH" >"$RWX_ENV/PATH"
    timeout: 30m

  - &compile
    key: compile-proof
    use: [source, go-build-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-rust-e2e-ci == 'true' }}
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh compile proof
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      GO_ARTIFACT: ${{ tasks.go.tasks.build.artifacts.dependency }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
    tool-cache: rust-e2e-go-compile-${{ init.cache-epoch }}
    timeout: 60m
    runner:
      cpus: 8
      memory: 16gb
    outputs: &compile-outputs
      filesystem:
        filter:
          workspace: [.ci/go-cache/rust-e2e/compile]
          system: []
      artifacts:
        - key: compiled
          path: .ci/rust-e2e/compiled/proof

  - <<: *compile
    key: compile-restart
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh compile restart
    outputs:
      <<: *compile-outputs
      artifacts:
        - key: compiled
          path: .ci/rust-e2e/compiled/restart

  - <<: *compile
    key: compile-simple-kona
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh compile simple-kona
    outputs:
      <<: *compile-outputs
      artifacts:
        - key: compiled
          path: .ci/rust-e2e/compiled/simple-kona

  - <<: *compile
    key: compile-simple-kona-sequencer
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh compile simple-kona-sequencer
    outputs:
      <<: *compile-outputs
      artifacts:
        - key: compiled
          path: .ci/rust-e2e/compiled/simple-kona-sequencer

  - <<: *compile
    key: compile-op-reth
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh compile op-reth
    outputs:
      <<: *compile-outputs
      artifacts:
        - key: compiled
          path: .ci/rust-e2e/compiled/op-reth

  # Run/attempt identity forces fresh verdicts while preserving runtime Go caches.
  - &verdict-proof
    key: verdict-proof-0
    use: [source, runtime-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-rust-e2e-ci == 'true' }}
    docker: true
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore rust-e2e-release "$RELEASE_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh run proof
    env: &verdict-proof-env
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_SHARD_INDEX: "0"
      PARALLEL: "8"
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
      CI_E2E_COMPILED: ${{ tasks.compile-proof.artifacts.compiled }}
      GO_ARTIFACT: ${{ tasks.go.tasks.build.artifacts.dependency }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
      RELEASE_ARTIFACT: ${{ tasks.release.tasks.build.artifacts.dependency }}
    tool-cache: rust-e2e-runtime-proof-${{ init.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/rust-e2e/run]
          system: []
      test-results:
        - path: .ci/rust-e2e/reports/proof/native.json
          options:
            language: Go
            framework: go test
      artifacts:
        - key: reports
          path: .ci/rust-e2e/reports/proof

  - <<: *verdict-proof
    key: verdict-proof-1
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "1"

  - <<: *verdict-proof
    key: verdict-proof-2
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "2"

  - <<: *verdict-proof
    key: verdict-proof-3
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "3"

  - <<: *verdict-proof
    key: verdict-proof-4
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "4"

  - <<: *verdict-proof
    key: verdict-proof-5
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "5"

  - <<: *verdict-proof
    key: verdict-proof-6
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "6"

  - <<: *verdict-proof
    key: verdict-proof-7
    env:
      <<: *verdict-proof-env
      CI_SHARD_INDEX: "7"

  - &verdict-node
    key: verdict-restart-0
    use: [source, runtime-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-rust-e2e-ci == 'true' }}
    docker: true
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore rust-e2e-release "$RELEASE_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore prestate "$PRESTATE_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh run restart
    env: &verdict-node-env
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_SHARD_INDEX: "0"
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
      CI_E2E_COMPILED: ${{ tasks.compile-restart.artifacts.compiled }}
      GO_ARTIFACT: ${{ tasks.go.tasks.build.artifacts.dependency }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
      RELEASE_ARTIFACT: ${{ tasks.release.tasks.build.artifacts.dependency }}
      PRESTATE_ARTIFACT: ${{ tasks.prestate.tasks.build.artifacts.dependency }}
    tool-cache: rust-e2e-runtime-restart-${{ init.cache-epoch }}
    timeout: 60m
    runner:
      cpus: 8
      memory: 16gb
    outputs: &verdict-node-outputs
      filesystem:
        filter:
          workspace: [.ci/go-cache/rust-e2e/run]
          system: []
      test-results:
        - path: .ci/rust-e2e/reports/restart/native.json
          options:
            language: Go
            framework: go test
      artifacts:
        - key: reports
          path: .ci/rust-e2e/reports/restart

  - <<: *verdict-node
    key: verdict-restart-1
    env:
      <<: *verdict-node-env
      CI_SHARD_INDEX: "1"

  - <<: *verdict-node
    key: verdict-restart-2
    env:
      <<: *verdict-node-env
      CI_SHARD_INDEX: "2"

  - <<: *verdict-node
    key: verdict-simple-kona-0
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore rust-e2e-release "$RELEASE_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore prestate "$PRESTATE_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh run simple-kona
    env:
      <<: *verdict-node-env
      CI_E2E_COMPILED: ${{ tasks.compile-simple-kona.artifacts.compiled }}
    tool-cache: rust-e2e-runtime-simple-kona-${{ init.cache-epoch }}
    outputs:
      <<: *verdict-node-outputs
      test-results:
        - path: .ci/rust-e2e/reports/simple-kona/native.json
          options:
            language: Go
            framework: go test
      artifacts:
        - key: reports
          path: .ci/rust-e2e/reports/simple-kona

  - <<: *verdict-node
    key: verdict-simple-kona-sequencer-0
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore rust-e2e-release "$RELEASE_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore prestate "$PRESTATE_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh run simple-kona-sequencer
    env:
      <<: *verdict-node-env
      CI_E2E_COMPILED: ${{ tasks.compile-simple-kona-sequencer.artifacts.compiled }}
    tool-cache: rust-e2e-runtime-simple-kona-sequencer-${{ init.cache-epoch }}
    outputs:
      <<: *verdict-node-outputs
      test-results:
        - path: .ci/rust-e2e/reports/simple-kona-sequencer/native.json
          options:
            language: Go
            framework: go test
      artifacts:
        - key: reports
          path: .ci/rust-e2e/reports/simple-kona-sequencer

  - <<: *verdict-node
    key: verdict-op-reth-0
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore go "$GO_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts-e2e "$CONTRACT_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore rust-e2e-release "$RELEASE_ARTIFACT"
      bash ops/ci/runtime/rust-e2e.sh run op-reth
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_SHARD_INDEX: "0"
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
      CI_E2E_COMPILED: ${{ tasks.compile-op-reth.artifacts.compiled }}
      GO_ARTIFACT: ${{ tasks.go.tasks.build.artifacts.dependency }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
      RELEASE_ARTIFACT: ${{ tasks.release.tasks.build.artifacts.dependency }}
    tool-cache: rust-e2e-runtime-op-reth-${{ init.cache-epoch }}
    outputs:
      <<: *verdict-node-outputs
      test-results:
        - path: .ci/rust-e2e/reports/op-reth/native.json
          options:
            language: Go
            framework: go test
      artifacts:
        - key: reports
          path: .ci/rust-e2e/reports/op-reth

  - key: rust-e2e-gate-receipt
    use: [code, tools]
    after: ${{ (release.succeeded || release.failed || release.skipped) && (verdict-op-reth-0.succeeded || verdict-op-reth-0.failed || verdict-op-reth-0.skipped) && (verdict-proof-0.succeeded || verdict-proof-0.failed || verdict-proof-0.skipped) && (verdict-proof-1.succeeded || verdict-proof-1.failed || verdict-proof-1.skipped) && (verdict-proof-2.succeeded || verdict-proof-2.failed || verdict-proof-2.skipped) && (verdict-proof-3.succeeded || verdict-proof-3.failed || verdict-proof-3.skipped) && (verdict-proof-4.succeeded || verdict-proof-4.failed || verdict-proof-4.skipped) && (verdict-proof-5.succeeded || verdict-proof-5.failed || verdict-proof-5.skipped) && (verdict-proof-6.succeeded || verdict-proof-6.failed || verdict-proof-6.skipped) && (verdict-proof-7.succeeded || verdict-proof-7.failed || verdict-proof-7.skipped) && (verdict-restart-0.succeeded || verdict-restart-0.failed || verdict-restart-0.skipped) && (verdict-restart-1.succeeded || verdict-restart-1.failed || verdict-restart-1.skipped) && (verdict-restart-2.succeeded || verdict-restart-2.failed || verdict-restart-2.skipped) && (verdict-simple-kona-0.succeeded || verdict-simple-kona-0.failed || verdict-simple-kona-0.skipped) && (verdict-simple-kona-sequencer-0.succeeded || verdict-simple-kona-sequencer-0.failed || verdict-simple-kona-sequencer-0.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt rust-e2e
    env:
      GROUP_SELECTED: ${{ tasks.route.values.run-rust-e2e-ci }}
      TASK_RELEASE_SUCCEEDED: ${{ tasks.release.succeeded }}
      TASK_RELEASE_FAILED: ${{ tasks.release.failed }}
      TASK_RELEASE_SKIPPED: ${{ tasks.release.skipped }}
      TASK_VERDICT_OP_RETH_0_SUCCEEDED: ${{ tasks.verdict-op-reth-0.succeeded }}
      TASK_VERDICT_OP_RETH_0_FAILED: ${{ tasks.verdict-op-reth-0.failed }}
      TASK_VERDICT_OP_RETH_0_SKIPPED: ${{ tasks.verdict-op-reth-0.skipped }}
      TASK_VERDICT_PROOF_0_SUCCEEDED: ${{ tasks.verdict-proof-0.succeeded }}
      TASK_VERDICT_PROOF_0_FAILED: ${{ tasks.verdict-proof-0.failed }}
      TASK_VERDICT_PROOF_0_SKIPPED: ${{ tasks.verdict-proof-0.skipped }}
      TASK_VERDICT_PROOF_1_SUCCEEDED: ${{ tasks.verdict-proof-1.succeeded }}
      TASK_VERDICT_PROOF_1_FAILED: ${{ tasks.verdict-proof-1.failed }}
      TASK_VERDICT_PROOF_1_SKIPPED: ${{ tasks.verdict-proof-1.skipped }}
      TASK_VERDICT_PROOF_2_SUCCEEDED: ${{ tasks.verdict-proof-2.succeeded }}
      TASK_VERDICT_PROOF_2_FAILED: ${{ tasks.verdict-proof-2.failed }}
      TASK_VERDICT_PROOF_2_SKIPPED: ${{ tasks.verdict-proof-2.skipped }}
      TASK_VERDICT_PROOF_3_SUCCEEDED: ${{ tasks.verdict-proof-3.succeeded }}
      TASK_VERDICT_PROOF_3_FAILED: ${{ tasks.verdict-proof-3.failed }}
      TASK_VERDICT_PROOF_3_SKIPPED: ${{ tasks.verdict-proof-3.skipped }}
      TASK_VERDICT_PROOF_4_SUCCEEDED: ${{ tasks.verdict-proof-4.succeeded }}
      TASK_VERDICT_PROOF_4_FAILED: ${{ tasks.verdict-proof-4.failed }}
      TASK_VERDICT_PROOF_4_SKIPPED: ${{ tasks.verdict-proof-4.skipped }}
      TASK_VERDICT_PROOF_5_SUCCEEDED: ${{ tasks.verdict-proof-5.succeeded }}
      TASK_VERDICT_PROOF_5_FAILED: ${{ tasks.verdict-proof-5.failed }}
      TASK_VERDICT_PROOF_5_SKIPPED: ${{ tasks.verdict-proof-5.skipped }}
      TASK_VERDICT_PROOF_6_SUCCEEDED: ${{ tasks.verdict-proof-6.succeeded }}
      TASK_VERDICT_PROOF_6_FAILED: ${{ tasks.verdict-proof-6.failed }}
      TASK_VERDICT_PROOF_6_SKIPPED: ${{ tasks.verdict-proof-6.skipped }}
      TASK_VERDICT_PROOF_7_SUCCEEDED: ${{ tasks.verdict-proof-7.succeeded }}
      TASK_VERDICT_PROOF_7_FAILED: ${{ tasks.verdict-proof-7.failed }}
      TASK_VERDICT_PROOF_7_SKIPPED: ${{ tasks.verdict-proof-7.skipped }}
      TASK_VERDICT_RESTART_0_SUCCEEDED: ${{ tasks.verdict-restart-0.succeeded }}
      TASK_VERDICT_RESTART_0_FAILED: ${{ tasks.verdict-restart-0.failed }}
      TASK_VERDICT_RESTART_0_SKIPPED: ${{ tasks.verdict-restart-0.skipped }}
      TASK_VERDICT_RESTART_1_SUCCEEDED: ${{ tasks.verdict-restart-1.succeeded }}
      TASK_VERDICT_RESTART_1_FAILED: ${{ tasks.verdict-restart-1.failed }}
      TASK_VERDICT_RESTART_1_SKIPPED: ${{ tasks.verdict-restart-1.skipped }}
      TASK_VERDICT_RESTART_2_SUCCEEDED: ${{ tasks.verdict-restart-2.succeeded }}
      TASK_VERDICT_RESTART_2_FAILED: ${{ tasks.verdict-restart-2.failed }}
      TASK_VERDICT_RESTART_2_SKIPPED: ${{ tasks.verdict-restart-2.skipped }}
