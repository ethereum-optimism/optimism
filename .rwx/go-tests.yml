  - key: compile-11
    use: [compiler-seed-11, go-build-tools, source, discovery]
    if: ${{ (init.cache-warm == 'true' || tasks.route.values.run-main == 'true') }}
    call: ${{ run.dir }}/packages/go-test-compile.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      shard-index: '11'
      build-probe: ${{ init.build-probe }}
      cache-key: go-full-compile-11-${{ init.cache-epoch }}

  - key: verdict-11
    use: [go-build-tools, contract-tools, go.build, contracts.build, kona.build, op-reth.build, prestate.build, source, discovery, compile-11.build]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-test-verdict.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      branch: ${{ init.branch }}
      shard-index: '11'
      cache-key: go-full-runtime-11-${{ init.cache-epoch }}

  # op-e2e/actions has its own Circle job (go-actions-tests); list-test-packages
  # excludes it from the general verdicts, so it never runs twice.
  - key: actions-verdict
    use: [go-build-tools, go.build, contracts.build, op-reth.build, source]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      if ! git cat-file -e "$CI_COMMIT_SHA^{commit}"; then git fetch --no-tags origin "$CI_COMMIT_SHA"; fi
      git reset --hard "$CI_COMMIT_SHA"
      git submodule sync --recursive
      git submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
      python3 ops/ci/runtime/go-artifacts.py restore contracts .ci/go-tests/dependencies/contracts
      python3 ops/ci/runtime/go-artifacts.py restore op-reth .ci/go-tests/dependencies/op-reth
      export RUST_BINARY_PATH_OP_RETH_TEST_ENGINE="$PWD/rust/target/release/op-reth-test-engine"
      test -x "$RUST_BINARY_PATH_OP_RETH_TEST_ENGINE"
      export GOMODCACHE="$PWD/.ci/go-cache/full/modules" GOCACHE="$PWD/.ci/go-cache/actions/run"
      mkdir -p "$GOCACHE"
      TEST_TIMEOUT=30m mise exec -- just go-actions-tests-ci
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CIRCLE_BRANCH: ${{ init.branch }}
    cache: false
    timeout: 60m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem: false
      test-results:
        - path: tmp/test-results/results.xml
      artifacts:
        - key: junit
          path: tmp/test-results
        - key: test-logs
          path: tmp/testlogs

  - key: main-gate-receipt
    use: [code, tools]
    after: ${{ (actions-verdict.succeeded || actions-verdict.failed || actions-verdict.skipped) && (verdict-0.succeeded || verdict-0.failed || verdict-0.skipped) && (verdict-1.succeeded || verdict-1.failed || verdict-1.skipped) && (verdict-10.succeeded || verdict-10.failed || verdict-10.skipped) && (verdict-11.succeeded || verdict-11.failed || verdict-11.skipped) && (verdict-2.succeeded || verdict-2.failed || verdict-2.skipped) && (verdict-3.succeeded || verdict-3.failed || verdict-3.skipped) && (verdict-4.succeeded || verdict-4.failed || verdict-4.skipped) && (verdict-5.succeeded || verdict-5.failed || verdict-5.skipped) && (verdict-6.succeeded || verdict-6.failed || verdict-6.skipped) && (verdict-7.succeeded || verdict-7.failed || verdict-7.skipped) && (verdict-8.succeeded || verdict-8.failed || verdict-8.skipped) && (verdict-9.succeeded || verdict-9.failed || verdict-9.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt main-go
    env:
      GROUP_SELECTED: ${{ tasks.route.values.run-main }}
      TASK_ACTIONS_VERDICT_SUCCEEDED: ${{ tasks.actions-verdict.succeeded }}
      TASK_ACTIONS_VERDICT_FAILED: ${{ tasks.actions-verdict.failed }}
      TASK_ACTIONS_VERDICT_SKIPPED: ${{ tasks.actions-verdict.skipped }}
      TASK_VERDICT_0_SUCCEEDED: ${{ tasks.verdict-0.succeeded }}
      TASK_VERDICT_0_FAILED: ${{ tasks.verdict-0.failed }}
      TASK_VERDICT_0_SKIPPED: ${{ tasks.verdict-0.skipped }}
      TASK_VERDICT_1_SUCCEEDED: ${{ tasks.verdict-1.succeeded }}
      TASK_VERDICT_1_FAILED: ${{ tasks.verdict-1.failed }}
      TASK_VERDICT_1_SKIPPED: ${{ tasks.verdict-1.skipped }}
      TASK_VERDICT_10_SUCCEEDED: ${{ tasks.verdict-10.succeeded }}
      TASK_VERDICT_10_FAILED: ${{ tasks.verdict-10.failed }}
      TASK_VERDICT_10_SKIPPED: ${{ tasks.verdict-10.skipped }}
      TASK_VERDICT_11_SUCCEEDED: ${{ tasks.verdict-11.succeeded }}
      TASK_VERDICT_11_FAILED: ${{ tasks.verdict-11.failed }}
      TASK_VERDICT_11_SKIPPED: ${{ tasks.verdict-11.skipped }}
      TASK_VERDICT_2_SUCCEEDED: ${{ tasks.verdict-2.succeeded }}
      TASK_VERDICT_2_FAILED: ${{ tasks.verdict-2.failed }}
      TASK_VERDICT_2_SKIPPED: ${{ tasks.verdict-2.skipped }}
      TASK_VERDICT_3_SUCCEEDED: ${{ tasks.verdict-3.succeeded }}
      TASK_VERDICT_3_FAILED: ${{ tasks.verdict-3.failed }}
      TASK_VERDICT_3_SKIPPED: ${{ tasks.verdict-3.skipped }}
      TASK_VERDICT_4_SUCCEEDED: ${{ tasks.verdict-4.succeeded }}
      TASK_VERDICT_4_FAILED: ${{ tasks.verdict-4.failed }}
      TASK_VERDICT_4_SKIPPED: ${{ tasks.verdict-4.skipped }}
      TASK_VERDICT_5_SUCCEEDED: ${{ tasks.verdict-5.succeeded }}
      TASK_VERDICT_5_FAILED: ${{ tasks.verdict-5.failed }}
      TASK_VERDICT_5_SKIPPED: ${{ tasks.verdict-5.skipped }}
      TASK_VERDICT_6_SUCCEEDED: ${{ tasks.verdict-6.succeeded }}
      TASK_VERDICT_6_FAILED: ${{ tasks.verdict-6.failed }}
      TASK_VERDICT_6_SKIPPED: ${{ tasks.verdict-6.skipped }}
      TASK_VERDICT_7_SUCCEEDED: ${{ tasks.verdict-7.succeeded }}
      TASK_VERDICT_7_FAILED: ${{ tasks.verdict-7.failed }}
      TASK_VERDICT_7_SKIPPED: ${{ tasks.verdict-7.skipped }}
      TASK_VERDICT_8_SUCCEEDED: ${{ tasks.verdict-8.succeeded }}
      TASK_VERDICT_8_FAILED: ${{ tasks.verdict-8.failed }}
      TASK_VERDICT_8_SKIPPED: ${{ tasks.verdict-8.skipped }}
      TASK_VERDICT_9_SUCCEEDED: ${{ tasks.verdict-9.succeeded }}
      TASK_VERDICT_9_FAILED: ${{ tasks.verdict-9.failed }}
      TASK_VERDICT_9_SKIPPED: ${{ tasks.verdict-9.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/main-go
