# Full aggregate Go workload. CircleCI retains all required gates.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [go, contracts, kona, op-reth, prestate, compile-0, compile-1, compile-2, compile-3, compile-4, compile-5, compile-6, compile-7, compile-8, compile-9, compile-10, compile-11]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "true"
      cache-epoch: v1
      build-probe: ""
      target-cache-mode: keep
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "false"
      cache-epoch: v1
      build-probe: ""
      target-cache-mode: keep

# Shared cache baseline: only develop may write; PRs restore it read-only.
tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []
      artifacts:
        - key: ci-scripts
          path: ops/ci/runtime

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  # The filtered bootstrap layer keeps the checkout's Git history out of
  # reusable tools. Language toolchains are added only by their own workload.
  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: go-build-tools
    use: tools
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: contract-tools
    use: [bootstrap-inputs, tools]
    call: ${{ run.dir }}/packages/toolchain-foundry.yml
    with:
      mode: anvil

  - key: helper-tests
    use: [code, go-build-tools]
    if: ${{ init.cache-warm != 'true' }}
    run: mise exec -- python3 -m unittest discover -s ops/ci/tests -p 'test_go*.py'
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  # This is a runtime preflight: only it and fresh verdicts receive RPC inputs.
  - key: rpc-preflight
    use: tools
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: python3 "$CI_SCRIPTS/go-rpc-preflight.py"
    filter:
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [go-rpc-preflight.py]
    env:
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
      OP_CI_MAINNET_L1_ARCHIVE_RPC_URL: ${{ vaults.optimism-go-tests-rpc-shadow.secrets.OP_CI_MAINNET_L1_ARCHIVE_RPC_URL }}
      OP_CI_SEPOLIA_L1_ARCHIVE_RPC_URL: ${{ vaults.optimism-go-tests-rpc-shadow.secrets.OP_CI_SEPOLIA_L1_ARCHIVE_RPC_URL }}
    cache: false
    outputs:
      filesystem: false

  - key: source
    use: [code, tools]
    after: ${{ rpc-preflight.succeeded || rpc-preflight.skipped }}
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      git submodule sync --recursive
      git submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
    timeout: 20m

  # A producer builds from the commit that last changed its build inputs
  # (dependency-plan), so its cache key holds for later commits and for every
  # workload that calls it. A consumer checks that those inputs equal HEAD's
  # before it restores the output.
  - key: dependency-plan
    use: code
    run: python3 ops/ci/runtime/go-dependency-source.py plan
    outputs:
      filesystem: false

  - key: rust-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-rust.yml
    with:
      mode: release

  - key: go-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.go }}

  - key: go
    use: [go-build-tools, go-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-go.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.go }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: contracts-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.contracts }}

  - key: contracts
    use: [go-build-tools, contract-tools, contracts-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-contracts.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.contracts }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: kona-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.kona }}

  - key: kona
    use: [rust-tools, kona-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-kona.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.kona }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: op-reth-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.op-reth }}

  - key: op-reth
    use: [rust-tools, op-reth-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-op-reth.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.op-reth }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  - key: prestate-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.prestate }}

  - key: prestate
    use: [go-build-tools, prestate-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-prestate.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.prestate }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ${{ init.build-probe }}
      target-cache-mode: ${{ init.target-cache-mode }}

  # The compiler seeds are reusable in the same way. Current-source compilation
  # and every verdict still use the discovery of the current commit.
  - key: compiler-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.compiler }}

  - key: compiler-preparation
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    use: [go-build-tools, compiler-source, contracts.build]
    run: |
      git reset --hard "$CI_COMMIT_SHA"
      git submodule sync --recursive
      git submodule update --init --recursive --jobs 8
      export GOMODCACHE="$PWD/.ci/go-cache/full/modules" GOCACHE="$PWD/.ci/go-cache/full/build"
      go mod download
      just sync-superchain-go
      git diff --exit-code op-core/superchain/bundle/superchain-configs.zip.sha256
      just cannon
      python3 ops/ci/runtime/go-artifacts.py restore contracts .ci/go-tests/dependencies/contracts
      mise exec -- bash ops/ci/runtime/go-full-tests.sh discover
    env:
      CI_COMMIT_SHA: ${{ tasks.dependency-plan.values.compiler }}
      COMPILER_CACHE_EPOCH: ${{ init.cache-epoch }}
    timeout: 30m

  - &compiler-seed
    key: compiler-seed-0
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    use: compiler-preparation
    run: mise exec -- bash ops/ci/runtime/go-full-tests.sh build
    env: &compiler-seed-env
      CI_COMMIT_SHA: ${{ tasks.dependency-plan.values.compiler }}
      CI_SHARD_INDEX: '0'
      COMPILER_CACHE_EPOCH: ${{ init.cache-epoch }}
    timeout: 60m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/full/build]
          system: []

  - <<: *compiler-seed
    key: compiler-seed-1
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '1'

  - <<: *compiler-seed
    key: compiler-seed-2
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '2'

  - <<: *compiler-seed
    key: compiler-seed-3
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '3'

  - <<: *compiler-seed
    key: compiler-seed-4
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '4'

  - <<: *compiler-seed
    key: compiler-seed-5
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '5'

  - <<: *compiler-seed
    key: compiler-seed-6
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '6'

  - <<: *compiler-seed
    key: compiler-seed-7
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '7'

  - <<: *compiler-seed
    key: compiler-seed-8
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '8'

  - <<: *compiler-seed
    key: compiler-seed-9
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '9'

  - <<: *compiler-seed
    key: compiler-seed-10
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '10'

  - <<: *compiler-seed
    key: compiler-seed-11
    env:
      <<: *compiler-seed-env
      CI_SHARD_INDEX: '11'

  - key: discovery
    use: [go-build-tools, go.build, contracts.build, source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      if ! git cat-file -e "$CI_COMMIT_SHA^{commit}"; then git fetch --no-tags origin "$CI_COMMIT_SHA"; fi
      git reset --hard "$CI_COMMIT_SHA"
      git submodule sync --recursive
      git submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
      python3 ops/ci/runtime/go-artifacts.py restore go .ci/go-tests/dependencies/go
      python3 ops/ci/runtime/go-artifacts.py restore contracts .ci/go-tests/dependencies/contracts
      mise exec -- bash ops/ci/runtime/go-full-tests.sh discover
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-tests/manifest.json, .ci/go-cache/full/modules, cannon/bin, cannon/multicannon/embeds, cannon/testdata/bin, op-core/superchain/bundle/superchain-configs.zip, packages/contracts-bedrock/cache, packages/contracts-bedrock/artifacts, packages/contracts-bedrock/forge-artifacts, op-deployer/pkg/deployer/artifacts/forge-artifacts]
          system: []
    filter: ['!.ci/go-cache/full/dependencies']

  - key: compile-0
    use: [compiler-seed-0, go-build-tools, source, discovery]
    if: ${{ (init.cache-warm == 'true' || tasks.route.values.run-main == 'true') }}
    call: ${{ run.dir }}/packages/go-test-compile.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      shard-index: '0'
      build-probe: ${{ init.build-probe }}
      cache-key: go-full-compile-0-${{ init.cache-epoch }}

  - key: verdict-0
    use: [go-build-tools, contract-tools, go.build, contracts.build, kona.build, op-reth.build, prestate.build, source, discovery, compile-0.build]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-test-verdict.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      branch: ${{ init.branch }}
      shard-index: '0'
      cache-key: go-full-runtime-0-${{ init.cache-epoch }}

  - key: compile-1
    use: [compiler-seed-1, go-build-tools, source, discovery]
    if: ${{ (init.cache-warm == 'true' || tasks.route.values.run-main == 'true') }}
    call: ${{ run.dir }}/packages/go-test-compile.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      shard-index: '1'
      build-probe: ${{ init.build-probe }}
      cache-key: go-full-compile-1-${{ init.cache-epoch }}

  - key: verdict-1
    use: [go-build-tools, contract-tools, go.build, contracts.build, kona.build, op-reth.build, prestate.build, source, discovery, compile-1.build]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-test-verdict.yml
    with:
