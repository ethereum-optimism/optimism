      cache-key: go-full-runtime-5-${{ init.cache-epoch }}

  - key: compile-6
    use: [compiler-seed-6, go-build-tools, source, discovery]
    if: ${{ (init.cache-warm == 'true' || tasks.route.values.run-main == 'true') }}
