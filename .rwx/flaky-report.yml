# Execute the original reporting workload against the real public Insights API.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: tools
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "true"
  github:
    push:
      if: ${{ event.git.branch == 'codex/rwx-ci-pilot' || event.git.branch == 'develop' }}
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        tag: ${{ event.git.tag }}
        cache-warm: "false"
      status-checks:
        name: optimism-flaky-report-shadow
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "false"

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner: {cpus: 2, memory: 8gb}

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false
  - key: mise
    call: mise/install 1.1.0
    with: {mise-version: "2026.2.2", install: "false"}
  - key: tools
    use: [code, mise]
    run: bash ops/ci/runtime/rwx-prepare.sh
    timeout: 30m
  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_EVENT: push
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    outputs:
      filesystem: false
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json
  - key: helper-tests
    use: [code, tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: python3 -m unittest discover -s ops/ci/migration/tests -p 'test*flaky_report.py'
    cache: false
    timeout: 10m
    outputs: {filesystem: false}
  - key: report
    use: [code, tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: python3 ops/ci/migration/flaky-report.py run .ci/flaky-report/run
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
    cache: false
    timeout: 20m
    outputs:
      filesystem: false
      artifacts:
        - key: originals
          path: .ci/flaky-report/run
