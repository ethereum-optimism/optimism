# Full Kontrol summary generation and proof build; Circle retains required ownership.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [contracts, image]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "true"
      cache-epoch: v1
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "false"
      cache-epoch: v1

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: contract-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-foundry.yml
    with:
      mode: anvil

  - key: go-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  # Pull the image that test/kontrol/scripts/common.sh runs, so that this task
  # retries a registry failure and the verdict task does not download it.
  - key: image
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    filter: [mise.toml]
    run: |
      image="runtimeverificationinc/kontrol:ubuntu-jammy-$(yq '.tools.kontrol' mise.toml)"
      for attempt in 1 2 3 4 5; do
        if docker pull "$image"; then exit 0; fi
        sleep "$((2 ** attempt))"
      done
      exit 1
    docker: preserve-data
    timeout: 30m
    # The task changes Docker data only; it hands no file to later tasks.
    outputs:
      filesystem:
        filter:
          workspace: []
          system: []

  - key: source
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
    timeout: 20m

  # Each dependency builds from the commit that last changed its build inputs, so the
  # build is a cache hit for later commits and for the other workloads of the run.
  - key: dependency-plan
    use: code
    run: python3 ops/ci/runtime/go-dependency-source.py plan
    outputs:
      filesystem: false

  - key: contracts-source
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/dependency-source.yml
    with:
      ref: ${{ tasks.dependency-plan.values.contracts }}

  # CircleCI's contracts-bedrock-build, which check-kontrol-build requires.
  - key: contracts
    use: [go-tools, contract-tools, contracts-source]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-contracts.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.contracts }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ''
      target-cache-mode: keep

  # CircleCI's check-kontrol-build. The exit status of its two recipes is the
  # verdict. Like CircleCI, the task sets no FOUNDRY_PROFILE.
  - key: check
    use: [source, go-tools, contract-tools, image]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      python3 ops/ci/runtime/go-artifacts.py restore contracts "$CONTRACT_ARTIFACT"
      cd packages/contracts-bedrock
      just kontrol-summary-fp
      just forge-build ./test/kontrol/proofs
    env:
      CI: "true"
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
    docker: true
    cache: false
    timeout: 90m
    runner:
      cpus: 2
      memory: 8gb
    outputs:
      filesystem: false

  # Exact Main dependency states; unrelated workload failures stay outside this gate.
  - key: main-gate-receipt
    use: [code, tools]
    after: ${{ (check.succeeded || check.failed || check.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt main-kontrol
    env:
      GROUP_SELECTED: ${{ tasks.route.values.run-main }}
      TASK_CHECK_SUCCEEDED: ${{ tasks.check.succeeded }}
      TASK_CHECK_FAILED: ${{ tasks.check.failed }}
      TASK_CHECK_SKIPPED: ${{ tasks.check.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/main-kontrol
