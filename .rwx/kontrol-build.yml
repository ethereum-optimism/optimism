# Full Kontrol summary generation and proof build; Circle retains required ownership.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [contracts, image]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "true"
      cache-epoch: v1
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        tag: ${{ event.git.tag }}
        cache-warm: "false"
        cache-epoch: v1
      status-checks:
        name: optimism-kontrol-build-shadow
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "false"
      cache-epoch: v1

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci, .circleci/scripts/apt-install.sh]
    outputs:
      filesystem: false
      artifacts:
        - key: mise-config
          path: mise.toml
        - key: ci-scripts
          path: ops/ci
        - key: apt-script
          path: .circleci/scripts/apt-install.sh

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  - key: tools
    use: mise
    run: |
      mkdir -p ops/ci .circleci/scripts
      cp "$MISE_CONFIG" mise.toml
      cp "$CI_SCRIPTS/rwx-prepare.sh" ops/ci/
      cp "$APT_SCRIPT" .circleci/scripts/apt-install.sh
      bash ops/ci/rwx-prepare.sh
    env:
      MISE_CONFIG: ${{ tasks.bootstrap-inputs.artifacts.mise-config }}
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
      APT_SCRIPT: ${{ tasks.bootstrap-inputs.artifacts.apt-script }}
    filter:
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-prepare.sh]
    timeout: 30m

  - key: route
    use: [code, tools]
    run: bash ops/ci/rwx-metadata.sh
    env:
      CI_EVENT: push
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json

  - key: contract-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      cp "$CI_SCRIPTS/rwx-contracts-prepare.sh" ops/ci/
      bash ops/ci/rwx-contracts-prepare.sh tools
    env:
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
    filter:
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-contracts-prepare.sh]
    timeout: 30m

  - key: go-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: bash ops/ci/rwx-prepare.sh go
    timeout: 20m

  - key: compiler-set
    use: contract-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      if ! svm which 0.8.30 >/dev/null 2>&1; then
        for attempt in 1 2 3 4 5; do
          if svm install 0.8.30; then break; fi
          if [ "$attempt" = 5 ]; then exit 1; fi
          sleep "$((2 ** attempt))"
        done
      fi
    timeout: 15m

  - key: image
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    filter: [mise.toml, ops/ci/kontrol-image.py, ops/ci/kontrol-image.json]
    run: python3 ops/ci/kontrol-image.py prepare
    docker: preserve-data
    timeout: 30m
    outputs:
      filesystem:
        filter:
          workspace: [.ci/kontrol-build/image]
          system: []
      artifacts:
        - key: reports
          path: .ci/kontrol-build/image

  - key: source
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
    timeout: 20m

  - key: contracts
    use: [source, go-tools, compiler-set]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/kontrol-contracts.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      cache-epoch: ${{ init.cache-epoch }}

  - key: helper-tests
    use: [source, go-tools, compiler-set, image]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: RWX_LIVE_KONTROL_FIXTURE=1 python3 -m unittest discover -s ops/ci -p 'test_kontrol_build.py'
    docker: true
    cache: false
    timeout: 20m
    outputs:
      filesystem: false
      artifacts:
        - key: fixtures
          path: .ci/kontrol-build/helper-fixtures

  - key: check
    use: [source, go-tools, compiler-set, image]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: python3 ops/ci/kontrol-build.py --provider rwx --contract-artifact "$CONTRACT_ARTIFACT"
    env:
      CI: "true"
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    docker: true
    cache: false
    timeout: 90m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: false
      artifacts:
        - key: reports
          path: .ci/kontrol-build/run
