# Complete L1 upgrade matrices; Circle retains its required gates.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [compile]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "true"
      cache-epoch: v1
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "false"
      cache-epoch: v1

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: go-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  - key: contract-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-foundry.yml
    with:
      mode: compiler

  # A dependency build checks out the commit that last changed its build inputs, so it
  # is a cache hit for later commits and for the other workloads of the run.
  - key: dependency-plan
    use: code
    run: python3 ops/ci/runtime/go-dependency-source.py plan
    outputs:
      filesystem: false

  - key: go-modules
    use: go-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/go-modules.yml
    with:
      commit-sha: ${{ tasks.dependency-plan.values.go-modules }}
      branch: ${{ init.branch }}
      cache-epoch: ${{ init.cache-epoch }}

  # One initialized checkout supplies the submodule sources to every compile and verdict task.
  - key: source
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    run: |
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
    timeout: 20m

  - key: helper-tests
    use: [code, go-tools, contract-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    run: |
      RWX_LIVE_FORGE_FIXTURE=1 python3 -m unittest discover -s ops/ci/tests -p 'test_contract_upgrades.py'
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  # One build for every verdict task below: see packages/contracts-compile.yml.
  - key: compile
    use: [source, go-tools, contract-tools, go-modules]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contracts-compile.yml
    with:
      branch: ${{ init.branch }}
      cache-epoch: ${{ init.cache-epoch }}

  - key: verdict-feature-main
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-feature-main-${{ init.cache-epoch }}
      variant: feature-main

  - key: verdict-feature-CUSTOM_GAS_TOKEN
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-feature-CUSTOM_GAS_TOKEN-${{ init.cache-epoch }}
      variant: feature-CUSTOM_GAS_TOKEN

  - key: verdict-feature-INTEROP
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-feature-INTEROP-${{ init.cache-epoch }}
      variant: feature-INTEROP

  - key: verdict-feature-BRIDGE_HOOK
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-feature-BRIDGE_HOOK-${{ init.cache-epoch }}
      variant: feature-BRIDGE_HOOK

  - key: verdict-feature-OP_PRIVATE
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-feature-OP_PRIVATE-${{ init.cache-epoch }}
      variant: feature-OP_PRIVATE

  - key: verdict-chain-op
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-chain-op-${{ init.cache-epoch }}
      variant: chain-op

  - key: verdict-chain-ink
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-chain-ink-${{ init.cache-epoch }}
      variant: chain-ink

  - key: verdict-chain-unichain
    use: [source, go-tools, contract-tools, go-modules, compile]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/contract-upgrades-verdict.yml
    with:
      branch: ${{ init.branch }}
      cache-key: contract-upgrades-rpc-chain-unichain-${{ init.cache-epoch }}
      variant: chain-unichain

  - key: contracts-gate-receipt
    use: [code, tools]
    after: ${{ (verdict-chain-ink.succeeded || verdict-chain-ink.failed || verdict-chain-ink.skipped) && (verdict-chain-op.succeeded || verdict-chain-op.failed || verdict-chain-op.skipped) && (verdict-chain-unichain.succeeded || verdict-chain-unichain.failed || verdict-chain-unichain.skipped) && (verdict-feature-BRIDGE_HOOK.succeeded || verdict-feature-BRIDGE_HOOK.failed || verdict-feature-BRIDGE_HOOK.skipped) && (verdict-feature-CUSTOM_GAS_TOKEN.succeeded || verdict-feature-CUSTOM_GAS_TOKEN.failed || verdict-feature-CUSTOM_GAS_TOKEN.skipped) && (verdict-feature-INTEROP.succeeded || verdict-feature-INTEROP.failed || verdict-feature-INTEROP.skipped) && (verdict-feature-OP_PRIVATE.succeeded || verdict-feature-OP_PRIVATE.failed || verdict-feature-OP_PRIVATE.skipped) && (verdict-feature-main.succeeded || verdict-feature-main.failed || verdict-feature-main.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt contracts-upgrades
    env:
      TASK_VERDICT_FEATURE_BRIDGE_HOOK_SUCCEEDED: ${{ tasks.verdict-feature-BRIDGE_HOOK.succeeded }}
      TASK_VERDICT_FEATURE_BRIDGE_HOOK_FAILED: ${{ tasks.verdict-feature-BRIDGE_HOOK.failed }}
      TASK_VERDICT_FEATURE_BRIDGE_HOOK_SKIPPED: ${{ tasks.verdict-feature-BRIDGE_HOOK.skipped }}
      GROUP_SELECTED: ${{ tasks.route.values.run-contracts }}
      TASK_VERDICT_CHAIN_INK_SUCCEEDED: ${{ tasks.verdict-chain-ink.succeeded }}
      TASK_VERDICT_CHAIN_INK_FAILED: ${{ tasks.verdict-chain-ink.failed }}
      TASK_VERDICT_CHAIN_INK_SKIPPED: ${{ tasks.verdict-chain-ink.skipped }}
      TASK_VERDICT_CHAIN_OP_SUCCEEDED: ${{ tasks.verdict-chain-op.succeeded }}
      TASK_VERDICT_CHAIN_OP_FAILED: ${{ tasks.verdict-chain-op.failed }}
      TASK_VERDICT_CHAIN_OP_SKIPPED: ${{ tasks.verdict-chain-op.skipped }}
      TASK_VERDICT_CHAIN_UNICHAIN_SUCCEEDED: ${{ tasks.verdict-chain-unichain.succeeded }}
      TASK_VERDICT_CHAIN_UNICHAIN_FAILED: ${{ tasks.verdict-chain-unichain.failed }}
      TASK_VERDICT_CHAIN_UNICHAIN_SKIPPED: ${{ tasks.verdict-chain-unichain.skipped }}
      TASK_VERDICT_FEATURE_CUSTOM_GAS_TOKEN_SUCCEEDED: ${{ tasks.verdict-feature-CUSTOM_GAS_TOKEN.succeeded }}
      TASK_VERDICT_FEATURE_CUSTOM_GAS_TOKEN_FAILED: ${{ tasks.verdict-feature-CUSTOM_GAS_TOKEN.failed }}
      TASK_VERDICT_FEATURE_CUSTOM_GAS_TOKEN_SKIPPED: ${{ tasks.verdict-feature-CUSTOM_GAS_TOKEN.skipped }}
      TASK_VERDICT_FEATURE_INTEROP_SUCCEEDED: ${{ tasks.verdict-feature-INTEROP.succeeded }}
      TASK_VERDICT_FEATURE_INTEROP_FAILED: ${{ tasks.verdict-feature-INTEROP.failed }}
      TASK_VERDICT_FEATURE_INTEROP_SKIPPED: ${{ tasks.verdict-feature-INTEROP.skipped }}
      TASK_VERDICT_FEATURE_OP_PRIVATE_SUCCEEDED: ${{ tasks.verdict-feature-OP_PRIVATE.succeeded }}
      TASK_VERDICT_FEATURE_OP_PRIVATE_FAILED: ${{ tasks.verdict-feature-OP_PRIVATE.failed }}
      TASK_VERDICT_FEATURE_OP_PRIVATE_SKIPPED: ${{ tasks.verdict-feature-OP_PRIVATE.skipped }}
      TASK_VERDICT_FEATURE_MAIN_SUCCEEDED: ${{ tasks.verdict-feature-main.succeeded }}
      TASK_VERDICT_FEATURE_MAIN_FAILED: ${{ tasks.verdict-feature-main.failed }}
      TASK_VERDICT_FEATURE_MAIN_SKIPPED: ${{ tasks.verdict-feature-main.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/contracts-upgrades
