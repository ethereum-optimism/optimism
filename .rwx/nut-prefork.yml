# Complete NUT pre-fork state regeneration; Circle still owns its required gate.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [modules, contracts, superchain, op-reth]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "true"
      cache-epoch: v1
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "false"
      cache-epoch: v1

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: go-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  - key: contract-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-foundry.yml
    with:
      mode: compiler

  - key: rust-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-rust.yml
    with:
      mode: release

  - key: source
    use: [code, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
    timeout: 20m

  - key: modules
    use: [code, go-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-modules.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      branch: ${{ init.branch }}
      cache-epoch: ${{ init.cache-epoch }}

  - key: contracts
    use: [source, go-tools, contract-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-contracts.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ''
      target-cache-mode: keep

  # CircleCI's prep-superchain: regenerate the bundle, then fail if its
  # committed checksum changed.
  - key: superchain
    use: [source, go-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      just sync-superchain-go
      git diff --exit-code op-core/superchain/bundle/superchain-configs.zip.sha256
    timeout: 15m
    outputs:
      filesystem:
        filter:
          workspace: [op-core/superchain/bundle/superchain-configs.zip]
          system: []

  # The generator runs the L2 chain on op-reth-test-engine.
  - key: op-reth
    use: [source, rust-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    call: ${{ run.dir }}/packages/go-op-reth.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      cache-epoch: ${{ init.cache-epoch }}
      build-probe: ''
      target-cache-mode: keep

  # CircleCI's check-nut-prefork-states: its three command lines, after the
  # restores that replace attach_workspace. The recipe's exit status is the verdict.
  - key: tests
    use: [source, go-tools, contract-tools, superchain]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/nut-prefork/build"
      mkdir -p "$GOCACHE"
      python3 ops/ci/runtime/go-artifacts.py restore go-modules "$MODULE_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore contracts "$CONTRACT_ARTIFACT"
      python3 ops/ci/runtime/go-artifacts.py restore op-reth "$RETH_ARTIFACT"
      export RUST_BINARY_PATH_OP_RETH_TEST_ENGINE="$PWD/rust/target/release/op-reth-test-engine"
      test -x "$RUST_BINARY_PATH_OP_RETH_TEST_ENGINE"
      just _check-nut-prefork-states
    env:
      CI: "true"
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      MODULE_ARTIFACT: ${{ tasks.modules.tasks.build.artifacts.dependency }}
      CONTRACT_ARTIFACT: ${{ tasks.contracts.tasks.build.artifacts.dependency }}
      RETH_ARTIFACT: ${{ tasks.op-reth.tasks.build.artifacts.dependency }}
    cache: false
    tool-cache: nut-prefork-compiler-${{ init.cache-epoch }}
    timeout: 45m
    runner:
      cpus: 2
      memory: 8gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/nut-prefork/build]
          system: []

  # Exact Main dependency states; unrelated workload failures stay outside this gate.
  - key: main-gate-receipt
    use: [code, tools]
    after: ${{ (tests.succeeded || tests.failed || tests.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt main-nut-prefork
    env:
      GROUP_SELECTED: ${{ tasks.route.values.run-main }}
      TASK_TESTS_SUCCEEDED: ${{ tasks.tests.succeeded }}
      TASK_TESTS_FAILED: ${{ tasks.tests.failed }}
      TASK_TESTS_SKIPPED: ${{ tasks.tests.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/main-nut-prefork
