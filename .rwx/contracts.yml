    use: [modified-baseline, go-tools, contract-tools, go-modules, compile-modified-OP_PRIVATE]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' && tasks.compile-modified-OP_PRIVATE.tasks.build.values.eligible == 'true' }}
    call: ${{ run.dir }}/packages/contracts-verdict.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      branch: ${{ init.branch }}
      compiled: .ci/contract-suites/modified-OP_PRIVATE/prepare
      cache-key: contract-suites-runtime-modified-OP_PRIVATE-${{ init.cache-epoch }}
      target-sha: ${{ tasks.modified-baseline.values.target-sha }}
