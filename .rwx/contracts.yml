    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt contracts-suites
    env:
      TASK_VERDICT_STANDARD_BRIDGE_HOOK_ZK_DISPUTE_GAME_SUCCEEDED: ${{ tasks.verdict-standard-BRIDGE_HOOK_ZK_DISPUTE_GAME.succeeded }}
