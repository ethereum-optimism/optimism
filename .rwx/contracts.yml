# Complete standard contracts in an optional shadow; CircleCI keeps its gates.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [contracts-main-build, contracts-feature-build]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "true"
      cache-epoch: v1
      build-probe: ""
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        tag: ${{ event.git.tag }}
        cache-warm: "false"
        cache-epoch: v1
        build-probe: ""
      status-checks:
        name: optimism-contracts-shadow
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "false"
      cache-epoch: v1
      build-probe: ""

# Cache-only vault; no RPC or publishing credentials.
tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci, .circleci/scripts/apt-install.sh]
    outputs:
      filesystem: false
      artifacts:
        - key: mise-config
          path: mise.toml
        - key: ci-scripts
          path: ops/ci
        - key: apt-script
          path: .circleci/scripts/apt-install.sh

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  # Artifact dependencies avoid inheriting the checkout's Git history into
  # reusable tools. Language toolchains are added only by their own workload.
  - key: tools
    use: mise
    run: |
      mkdir -p ops/ci .circleci/scripts
      cp "$MISE_CONFIG" mise.toml
      cp "$CI_SCRIPTS/rwx-prepare.sh" ops/ci/
      cp "$APT_SCRIPT" .circleci/scripts/apt-install.sh
      bash ops/ci/rwx-prepare.sh
    env:
      MISE_CONFIG: ${{ tasks.bootstrap-inputs.artifacts.mise-config }}
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
      APT_SCRIPT: ${{ tasks.bootstrap-inputs.artifacts.apt-script }}
    filter:
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-prepare.sh]
    timeout: 30m

  - key: route
    use: [code, tools]
    run: |
      bash ops/ci/rwx-metadata.sh
      jq -er '."c-run_contracts_feature_tests" | if type == "boolean" then tostring else error("missing contract routing flag") end' \
        .ci/pipeline-parameters.json >"$RWX_VALUES/run-contracts"
    env:
      CI_EVENT: push
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json

  - key: go-tools
    use: tools
    run: bash ops/ci/rwx-prepare.sh go
    timeout: 30m

  - key: contract-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true' }}
    run: |
      cp "$CI_SCRIPTS/rwx-contracts-prepare.sh" "$CI_SCRIPTS/rwx-contracts-build.sh" "$CI_SCRIPTS/rwx-contracts-build.py" ops/ci/
      bash ops/ci/rwx-contracts-prepare.sh tools
    env:
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
    filter:
      workspace: [mise.toml, ops/ci/rwx-prepare.sh]
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-contracts-prepare.sh, rwx-contracts-build.sh, rwx-contracts-build.py]
    timeout: 30m

  - key: helper-tests
    use: [code, tools]
    run: |
      mise exec -- python ops/ci/test_contracts_shadow.py
      mise exec -- python ops/ci/test_check_changed.py
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  # Full source and Git state feed submodule setup and Go FFI. Do not filter
  # this producer: nested gitlinks and Go imports outside contracts are inputs.
  - key: contracts-source
    use: [code, go-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true' }}
    run: mise exec -- bash ops/ci/rwx-contracts-prepare.sh source
    tool-cache: contracts-go-prerequisites-${{ init.cache-epoch }}
    timeout: 30m
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/contracts]
          system: []
      artifacts:
        - key: prerequisites
          path: .ci/contracts-prepare
        - key: preparation-logs
          path: .ci/contracts-prepare

  # Feature caches have separate writers; all use the exact branch profile.
  - key: contracts-main-build
    use: contract-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: mise exec -- bash ops/ci/rwx-contracts-build.sh
    env:
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CONTRACT_FEATURE: main
      CONTRACT_PREREQUISITES: ${{ tasks.contracts-source.artifacts.prerequisites }}
      BUILD_PROBE: ${{ init.build-probe }}
    tool-cache: contracts-main-${{ init.cache-epoch }}
    timeout: 40m
    runner: &contracts-runner
      cpus: 16
      memory: 32gb
    outputs: &compilation-outputs
      filesystem:
        filter:
          workspace: [packages/contracts-bedrock/forge-artifacts, packages/contracts-bedrock/cache/solidity-files-cache.json, packages/contracts-bedrock/artifacts/build-info]
          system: []
      artifacts:
        - key: compilation
          path: .ci/contracts-build

  - key: contracts-feature-build
    use: contract-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    parallel:
      matrix:
        feature: [CUSTOM_GAS_TOKEN, OPTIMISM_PORTAL_INTEROP, ZK_DISPUTE_GAME]
    run: mise exec -- bash ops/ci/rwx-contracts-build.sh
    env:
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CONTRACT_FEATURE: ${{ parallel.feature }}
      CONTRACT_PREREQUISITES: ${{ tasks.contracts-source.artifacts.prerequisites }}
      BUILD_PROBE: ${{ init.build-probe }}
    tool-cache: contracts-${{ parallel.feature }}-${{ init.cache-epoch }}
    timeout: 40m
    runner: *contracts-runner
    outputs: *compilation-outputs

  - key: contracts-main
    use: contract-tools
    if: ${{ tasks.route.values.run-main == 'true' }}
    run: |
      python3 ops/ci/rwx-contracts-build.py restore "$CONTRACT_BUILD_ARTIFACT"
      mise exec -- bash ops/ci/contracts-tests.sh
    env:
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CONTRACT_FEATURE: main
      RWX_COMPILED_CONTRACTS: "true"
      CONTRACT_BUILD_ARTIFACT: ${{ tasks.contracts-main-build.artifacts.compilation }}
    cache: false
    timeout: 60m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem: false
      test-results:
        - path: packages/contracts-bedrock/results/results.xml
          options:
            language: Solidity
            framework: Foundry
      artifacts:
        - key: junit
          path: packages/contracts-bedrock/results/results.xml
        - key: test-reports
          path: packages/contracts-bedrock/results/reports

  - key: contracts-features
    use: contract-tools
    if: ${{ tasks.route.values.run-contracts == 'true' }}
    parallel:
      matrix:
        feature: [CUSTOM_GAS_TOKEN, OPTIMISM_PORTAL_INTEROP, ZK_DISPUTE_GAME]
    run: |
      python3 ops/ci/rwx-contracts-build.py restore "$CONTRACT_BUILD_ARTIFACTS/contracts-feature-build-$CONTRACT_FEATURE"
      mise exec -- bash ops/ci/contracts-tests.sh
    env:
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CONTRACT_FEATURE: ${{ parallel.feature }}
      RWX_COMPILED_CONTRACTS: "true"
      CONTRACT_BUILD_ARTIFACTS: ${{ tasks.contracts-feature-build.artifacts.compilation }}
    cache: false
    timeout: 60m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem: false
      test-results:
        - path: packages/contracts-bedrock/results/results.xml
          options:
            language: Solidity
            framework: Foundry
      artifacts:
        - key: junit
          path: packages/contracts-bedrock/results/results.xml
        - key: test-reports
          path: packages/contracts-bedrock/results/reports
