    with:
      commit-sha: ${{ init.commit-sha }}
      branch: ${{ init.branch }}
      build-probe: ${{ init.build-probe }}
      cache-key: contract-suites-standard-CUSTOM_GAS_TOKEN-${{ init.cache-epoch }}
      suite: standard
      feature: CUSTOM_GAS_TOKEN

  - key: verdict-standard-CUSTOM_GAS_TOKEN
    use: [source, go-tools, contract-tools, go-modules, compile-standard-CUSTOM_GAS_TOKEN]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' && tasks.compile-standard-CUSTOM_GAS_TOKEN.tasks.build.values.eligible == 'true' }}
