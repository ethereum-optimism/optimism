package:
  parameters:
    commit-sha:
    cache-epoch:
    build-probe:
    target-cache-mode:
tasks:
  - key: build
    use: package.use
    run: mise exec -- bash ops/ci/go-dependencies.sh go
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      BUILD_PROBE: ${{ params.build-probe }}
      TARGET_CACHE_MODE: ${{ params.target-cache-mode }}
    tool-cache: go-full-dependencies-${{ params.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/full, .ci/go-tests/dependencies/go]
          system: []
      artifacts:
        - key: dependency
          path: .ci/go-tests/dependencies/go
