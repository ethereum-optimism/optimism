package:
  parameters:
    commit-sha:
      required: true
    shard-index:
      required: true
    shard-total:
      required: true
    test-parallel:
      required: true
    build-probe:
      required: true
    cache-key:
      required: true
tasks:
  - key: build
    use: package.use
    run: |
      if ! git cat-file -e "$CI_COMMIT_SHA^{commit}"; then git fetch --no-tags origin "$CI_COMMIT_SHA"; fi
      git reset --hard "$CI_COMMIT_SHA"
      git submodule sync --recursive
      git submodule update --init --recursive --jobs 8
      git rev-parse HEAD >packages/contracts-bedrock/.gitcommit
      mise exec -- bash ops/ci/runtime/go-full-tests.sh build
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      CI_SHARD_INDEX: ${{ params.shard-index }}
      CI_SHARD_TOTAL: ${{ params.shard-total }}
      PARALLEL: ${{ params.test-parallel }}
      BUILD_PROBE: ${{ params.build-probe }}
    tool-cache: ${{ params.cache-key }}
    timeout: 60m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-tests/build]
          system: []
      artifacts:
        - key: binaries
          path: .ci/go-tests/build
