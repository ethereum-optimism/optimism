package:
  parameters:
    mode:
      required: true
tasks:
  - key: prepare
    use: package.use
    run: |
      bash ops/ci/rwx-contracts-prepare.sh tools
      case "$FOUNDRY_TOOL_MODE" in
        compiler) ;;
        anvil) mise install anvil ;;
        analysis)
          mise install uv
          PATH="$(mise bin-paths | paste -sd: -):$PATH"
          export PATH
          mise install pipx:semgrep
          printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
          ;;
        *) echo "Unknown Foundry tool mode: $FOUNDRY_TOOL_MODE" >&2; exit 1 ;;
      esac
    env:
      FOUNDRY_TOOL_MODE: ${{ params.mode }}
    filter:
      workspace: [mise.toml, .circleci/scripts/apt-install.sh, ops/ci/rwx-prepare.sh, ops/ci/rwx-contracts-prepare.sh]
    timeout: 30m
