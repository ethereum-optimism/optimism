package:
  parameters:
    commit-sha:
    cache-epoch:
tasks:
  - key: build
    use: package.use
    run: bash ops/ci/runtime/rust-e2e-release.sh binaries
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      # The gate receipt reads this task, so it runs in every run. The tool cache keeps it incremental.
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    tool-cache: rust-e2e-workspace-release-${{ params.cache-epoch }}
    timeout: 120m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/rust-cache, rust/target]
          system: []
      artifacts:
        - key: dependency
          path: .ci/go-tests/dependencies/rust-e2e-release
