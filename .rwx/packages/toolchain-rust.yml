package:
  parameters:
    mode:
      required: true
tasks:
  - key: prepare
    use: package.use
    run: |
      bash ops/ci/rwx-prepare.sh rust
      mise exec -- bash ops/ci/rwx-rust-prepare.sh
      case "$RUST_TOOL_MODE" in
        release) ;;
        e2e) bash .circleci/scripts/apt-install.sh m4 file ;;
        workspace|sp1)
          bash .circleci/scripts/apt-install.sh m4 file
          if [[ "$RUST_TOOL_MODE" == workspace ]]; then
            mise install github:est31/cargo-udeps github:taiki-e/cargo-hack
          else
            mise install github:succinctlabs/sp1
          fi
          printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
          ;;
        *) echo "Unknown Rust tool mode: $RUST_TOOL_MODE" >&2; exit 1 ;;
      esac
    env:
      RUST_TOOL_MODE: ${{ params.mode }}
    filter:
      workspace: [mise.toml, .circleci/scripts/apt-install.sh, ops/ci/rwx-prepare.sh, ops/ci/rwx-rust-prepare.sh, ops/ci/op-reth-shadow.sh, ops/ci/op-reth-report.py, ops/ci/rust-target-cache.py]
    timeout: 30m
