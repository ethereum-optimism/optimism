package:
  parameters:
    commit-sha:
    cache-epoch:
    build-probe:
    target-cache-mode:
tasks:
  - key: build
    use: package.use
    run: mise exec -- bash ops/ci/runtime/go-dependencies.sh prestate
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      BUILD_PROBE: ${{ params.build-probe }}
      TARGET_CACHE_MODE: ${{ params.target-cache-mode }}
    tool-cache: go-full-prestate-${{ params.cache-epoch }}
    docker: preserve-data
    timeout: 90m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [rust/kona/prestate-artifacts-*, .ci/go-tests/dependencies/prestate]
          system: []
      artifacts:
        - key: dependency
          path: .ci/go-tests/dependencies/prestate
