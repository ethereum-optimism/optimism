# Small native proof of the same artifact-only boundary used by Go verdicts.
package: true
tasks:
  - key: build
    use: package.use
    run: |
      mkdir -p compiler-cache compiled
      echo compiler-only >compiler-cache/marker
      echo verified-binary >compiled/binary
      echo true >"$RWX_VALUES/eligible"
    outputs:
      filesystem:
        filter:
          workspace: [compiler-cache, compiled]
          system: []
      artifacts:
        - key: binaries
          path: compiled
