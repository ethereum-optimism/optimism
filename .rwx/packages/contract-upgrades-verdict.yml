package:
  parameters:
    commit-sha:
      required: true
    branch:
      required: true
    compiled:
      required: true
    pinned-block:
      required: true
    cache-key:
      required: true
    variant:
      required: true
tasks:
  - key: run
    use: package.use
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/contract-upgrades/modules"
      export GOCACHE="$PWD/.ci/go-cache/contract-upgrades/build"
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      python3 ops/ci/runtime/contract-upgrades.py run --variant "$CI_CONTRACT_VARIANT" \
        --prepared "$COMPILED" --block "$PINNED_BLOCK"
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      CI_BRANCH: ${{ params.branch }}
      CI_CONTRACT_PROVIDER: rwx
      COMPILED: ${{ params.compiled }}
      PINNED_BLOCK: ${{ params.pinned-block }}
      OP_CI_MAINNET_L1_ARCHIVE_RPC_URL: ${{ vaults.optimism-go-tests-rpc-shadow.secrets.OP_CI_MAINNET_L1_ARCHIVE_RPC_URL }}
      CI_CONTRACT_VARIANT: ${{ params.variant }}
    cache: false
    tool-cache: ${{ params.cache-key }}
    timeout: 60m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: []
          system: [~/.foundry/cache/rpc]
      test-results:
        - path: .ci/contract-upgrades/${{ params.variant }}/run/original.junit.xml
          options:
            language: Solidity
            framework: Foundry
      artifacts:
        - key: reports
          path: .ci/contract-upgrades/${{ params.variant }}/run
