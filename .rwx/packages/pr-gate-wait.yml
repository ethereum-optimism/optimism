# GitHub's integration token is available to call parameters, not run env.
package:
  parameters:
    commit-sha:
      required: true
    branch:
      required: true
    routing:
      required: true
    github-token:
      required: true
    previous:
      default: ""
    final-chunk:
      default: "false"
tasks:
  - key: wait
    use: package.use
    run: |
      args=(wait required-rust-ci --seconds 2400)
      if [[ -n "$PREVIOUS" ]]; then args+=(--previous "$PREVIOUS"); fi
      if [[ "$FINAL_CHUNK" == true ]]; then args+=(--final); fi
      python3 ops/ci/pr-gate.py "${args[@]}"
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      CI_BRANCH: ${{ params.branch }}
      GATE_ROUTING: ${{ params.routing }}
      GATE_GITHUB_TOKEN: ${{ params.github-token }}
      PREVIOUS: ${{ params.previous }}
      FINAL_CHUNK: ${{ params.final-chunk }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    timeout: 45m
    outputs:
      filesystem: false
      artifacts:
        - key: report
          path: .ci/pr-gates/wait
