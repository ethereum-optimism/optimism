package:
  parameters:
    commit-sha:
    cache-epoch:
tasks:
  - key: build
    use: package.use
    run: python3 ops/ci/runtime/kontrol-contracts.py
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
    tool-cache: kontrol-contracts-${{ params.cache-epoch }}
    timeout: 90m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [packages/contracts-bedrock/cache, packages/contracts-bedrock/artifacts, packages/contracts-bedrock/forge-artifacts, .ci/go-cache/full, .ci/kontrol-contracts]
          system: []
      artifacts:
        - key: dependency
          path: .ci/go-tests/dependencies/contracts-kontrol
