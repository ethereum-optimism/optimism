package:
  parameters:
    commit-sha:
      required: true
    branch:
      required: true
    cache-key:
      required: true
    variant:
      required: true
tasks:
  - key: build
    use: package.use
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/contract-upgrades/modules"
      export GOCACHE="$PWD/.ci/go-cache/contract-upgrades/build"
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      python3 ops/ci/contract-upgrades.py prepare --variant "$CI_CONTRACT_VARIANT"
    env:
      CI_COMMIT_SHA: ${{ params.commit-sha }}
      CI_BRANCH: ${{ params.branch }}
      CI_CONTRACT_PROVIDER: rwx
      CI_CONTRACT_VARIANT: ${{ params.variant }}
    tool-cache: ${{ params.cache-key }}
    timeout: 40m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [packages/contracts-bedrock/forge-artifacts, packages/contracts-bedrock/cache/solidity-files-cache.json, packages/contracts-bedrock/artifacts/build-info, packages/contracts-bedrock/scripts/go-ffi/go-ffi, .ci/go-cache/contract-upgrades/build, '.ci/contract-upgrades/${{ params.variant }}/prepare']
          system: []
      artifacts:
        - key: compiled
          path: .ci/contract-upgrades/${{ params.variant }}/prepare
