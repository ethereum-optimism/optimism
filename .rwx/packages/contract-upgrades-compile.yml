package:
  parameters:
    branch:
      required: true
    cache-key:
      required: true
    variant:
      required: true
tasks:
  - key: build
    use: package.use
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/contract-upgrades/build"
      python3 ops/ci/runtime/contract-upgrades.py prepare --variant "$CI_CONTRACT_VARIANT"
    env:
      CI_BRANCH: ${{ params.branch }}
      CI_CONTRACT_VARIANT: ${{ params.variant }}
    tool-cache: ${{ params.cache-key }}
    timeout: 40m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [packages/contracts-bedrock/forge-artifacts, packages/contracts-bedrock/cache/solidity-files-cache.json, packages/contracts-bedrock/artifacts/build-info, packages/contracts-bedrock/scripts/go-ffi/go-ffi, .ci/go-cache/contract-upgrades/build]
          system: []
      artifacts:
        - key: reports
          path: .ci/contract-upgrades/${{ params.variant }}/prepare
