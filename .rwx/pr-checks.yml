# The small checks of CircleCI's main workflow and its contracts fast check.
# CircleCI owns the required gates. Each check task runs the command of the
# CircleCI job that its comment names, from .circleci/continue/main.yml.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [go-modules, contract-tools, main-tools, static-tools]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "true"
      cache-epoch: v1
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      cache-warm: "false"
      cache-epoch: v1

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci/runtime]
    outputs:
      filesystem:
        filter:
          workspace: [mise.toml, ops/ci/runtime/apt-install.sh, ops/ci/runtime/rwx-prepare.sh, ops/ci/runtime/rwx-contracts-prepare.sh, ops/ci/runtime/rwx-rust-prepare.sh, ops/ci/runtime/op-reth-shadow.sh, ops/ci/runtime/op-reth-report.py, ops/ci/runtime/rust-target-cache.py]
          system: []

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  - key: tools
    use: [mise, bootstrap-inputs]
    call: ${{ run.dir }}/packages/toolchain-common.yml

  - key: route
    use: [code, tools]
    run: bash ops/ci/runtime/rwx-metadata.sh
    env:
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: go-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-go.yml
    with:
      mode: go

  - key: contract-tools
    use: [bootstrap-inputs, tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/toolchain-foundry.yml
    with:
      mode: analysis

  - key: main-tools
    use: go-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      mise install ripgrep mockery
      printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
    timeout: 30m

  - key: static-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      mise install uv shellcheck shfmt
      PATH="$(mise bin-paths | paste -sd: -):$PATH"
      export PATH
      # The pinned Semgrep's MCP dependency imports a Pydantic private API
      # removed in later releases, as in packages/toolchain-foundry.yml.
      semgrep_version="$(mise tool pipx:semgrep --requested)"
      mise install "pipx:semgrep[uvx_args=--with pydantic==2.11.10]@$semgrep_version"
      printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
    timeout: 30m

  # Mirrors CircleCI's shell-check job. That job has its find expression inline,
  # so this task reads the command from the job and the two cannot drift.
  - key: shell-check
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      command="$(yq -r '.jobs["shell-check"].steps[] | select(.run.name? == "Run shellcheck") | .run.command' .circleci/continue/main.yml)"
      if [[ -z "$command" || "$command" == null ]]; then echo "CircleCI's shell-check command is missing" >&2; exit 1; fi
      bash -eo pipefail -c "$command"
    cache: false
    timeout: 20m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: false

  # Mirrors CircleCI's shfmt-check job.
  - key: shfmt-check
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: just shfmt-check
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  # Mirrors CircleCI's semgrep-scan job as semgrep-test. Like that job, a branch
  # other than develop sets SEMGREP_BASELINE_REF to develop. `semgrep scan` reads
  # no other variable of that job's Semgrep environment; `semgrep ci` reads the rest.
  - key: semgrep-test
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      if [[ "$CI_BRANCH" != develop ]]; then
        git fetch --no-tags origin develop
        git update-ref refs/heads/develop FETCH_HEAD
        export SEMGREP_BASELINE_REF=develop
      fi
      semgrep scan --test --config .semgrep/rules/ .semgrep/tests/
    env:
      CI_BRANCH: ${{ init.branch }}
    cache: false
    timeout: 20m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: false

  # Mirrors CircleCI's semgrep-scan job as semgrep-scan-local, with the same
  # baseline as semgrep-test.
  - key: semgrep-scan-local
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      if [[ "$CI_BRANCH" != develop ]]; then
        git fetch --no-tags origin develop
        git update-ref refs/heads/develop FETCH_HEAD
        export SEMGREP_BASELINE_REF=develop
      fi
      semgrep scan --timeout=100 --config .semgrep/rules/ --error .
    env:
      CI_BRANCH: ${{ init.branch }}
    cache: false
    timeout: 30m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: false

  # Mirrors CircleCI's prep-go-modules job. Later tasks read the module cache at
  # .ci/go-cache/pr-checks/modules.
  - key: go-modules
    use: [code, go-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true' }}
    call: ${{ run.dir }}/packages/go-modules.yml
    with:
      commit-sha: ${{ init.commit-sha }}
      branch: ${{ init.branch }}
      cache-epoch: ${{ init.cache-epoch }}

  # Mirrors CircleCI's contracts-bedrock-checks-fast job, which required-contracts-ci
  # requires as contracts-bedrock-checks-fast-feature-tests.
  - key: contracts-fast
    use: [code, go-tools, go-modules, contract-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/pr-checks/fast-build"
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      cd packages/contracts-bedrock
      # scripts/checks/check-semver-diff.sh compares with origin/<target branch>.
      # The clone of one commit can lack that ref.
      source scripts/ops/get-target-branch.sh
      git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
      forge --version
      just check-fast
    env:
      # checks.yaml formats the sources in place unless CI is set.
      CI: "true"
      # scripts/ops/get-target-branch.sh reads it to find a merge-queue base.
      CIRCLE_BRANCH: ${{ init.branch }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    tool-cache: pr-checks-contracts-fast-${{ init.cache-epoch }}
    timeout: 60m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [packages/contracts-bedrock/forge-artifacts, packages/contracts-bedrock/cache/solidity-files-cache.json, packages/contracts-bedrock/artifacts/build-info, .ci/go-cache/pr-checks/fast-build]
          system: []

  # Mirrors CircleCI's todo-issues job as todo-issues-check (check_closed: false).
  # No gate requires it. ripgrep reads a stdin that is not a terminal instead of
  # searching the checkout, so stdin is /dev/null.
  - key: todo-issues-check
    use: [code, main-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: ./ops/scripts/todo-checker.sh --verbose --strict </dev/null
    cache: false
    timeout: 30m
    runner:
      cpus: 4
      memory: 16gb
    outputs:
      filesystem: false

  # Mirrors CircleCI's l2-chains-sync-check job.
  - key: l2-chains-sync-check
    use: [code, tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: bash .circleci/scripts/check-l2-chains-sync.sh
    cache: false
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: false

  # Mirrors CircleCI's op-deployer-forge-version job. The recipe runs a Go test.
  - key: op-deployer-forge-version
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      cd op-deployer
      just check-forge-version
    cache: false
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem: false

  # Mirrors CircleCI's opgeth-ratchet job. That job attaches the bundle that
  # prep-superchain builds; this task runs prep-superchain's two commands first.
  - key: opgeth-ratchet
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/opgeth-ratchet"
      just sync-superchain-go
      git diff --exit-code op-core/superchain/bundle/superchain-configs.zip.sha256
      just opgeth-ratchet
    cache: false
    tool-cache: main-checks-opgeth-ratchet-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 2
      memory: 4gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/opgeth-ratchet]
          system: []

  # Mirrors CircleCI's check-op-geth-version job.
  - key: check-op-geth-version
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-op-geth-version"
      just check-op-geth-version
    cache: false
    tool-cache: main-checks-check-op-geth-version-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 2
      memory: 4gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-op-geth-version]
          system: []

  # Mirrors CircleCI's check-nut-locks job. The check requires each locked commit
  # to be an ancestor of origin/develop. The clone of one commit can lack that ref.
  - key: check-nut-locks
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-nut-locks"
      git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
      go run ./ops/scripts/check-nut-locks
    cache: false
    tool-cache: main-checks-check-nut-locks-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 2
      memory: 4gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-nut-locks]
          system: []

  # Mirrors CircleCI's check-generated-mocks-op-node job.
  - key: check-generated-mocks-op-node
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-generated-mocks-op-node"
      just generate-mocks-op-node && git diff --exit-code
    cache: false
    tool-cache: main-checks-check-generated-mocks-op-node-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-generated-mocks-op-node]
          system: []

  # Mirrors CircleCI's check-generated-mocks-op-service job.
  - key: check-generated-mocks-op-service
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-generated-mocks-op-service"
      just generate-mocks-op-service && git diff --exit-code
    cache: false
    tool-cache: main-checks-check-generated-mocks-op-service-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-generated-mocks-op-service]
          system: []

  # Exact Main dependency states; unrelated workload failures stay outside this gate.
  - key: main-gate-receipt
    use: [code, tools]
    after: ${{ (check-generated-mocks-op-node.succeeded || check-generated-mocks-op-node.failed || check-generated-mocks-op-node.skipped) && (check-generated-mocks-op-service.succeeded || check-generated-mocks-op-service.failed || check-generated-mocks-op-service.skipped) && (check-nut-locks.succeeded || check-nut-locks.failed || check-nut-locks.skipped) && (check-op-geth-version.succeeded || check-op-geth-version.failed || check-op-geth-version.skipped) && (l2-chains-sync-check.succeeded || l2-chains-sync-check.failed || l2-chains-sync-check.skipped) && (op-deployer-forge-version.succeeded || op-deployer-forge-version.failed || op-deployer-forge-version.skipped) && (opgeth-ratchet.succeeded || opgeth-ratchet.failed || opgeth-ratchet.skipped) && (semgrep-scan-local.succeeded || semgrep-scan-local.failed || semgrep-scan-local.skipped) && (semgrep-test.succeeded || semgrep-test.failed || semgrep-test.skipped) && (shell-check.succeeded || shell-check.failed || shell-check.skipped) && (shfmt-check.succeeded || shfmt-check.failed || shfmt-check.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt main-checks
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      GROUP_SELECTED: ${{ tasks.route.values.run-main }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
      TASK_CHECK_GENERATED_MOCKS_OP_NODE_SUCCEEDED: ${{ tasks.check-generated-mocks-op-node.succeeded }}
      TASK_CHECK_GENERATED_MOCKS_OP_NODE_FAILED: ${{ tasks.check-generated-mocks-op-node.failed }}
      TASK_CHECK_GENERATED_MOCKS_OP_NODE_SKIPPED: ${{ tasks.check-generated-mocks-op-node.skipped }}
      TASK_CHECK_GENERATED_MOCKS_OP_SERVICE_SUCCEEDED: ${{ tasks.check-generated-mocks-op-service.succeeded }}
      TASK_CHECK_GENERATED_MOCKS_OP_SERVICE_FAILED: ${{ tasks.check-generated-mocks-op-service.failed }}
      TASK_CHECK_GENERATED_MOCKS_OP_SERVICE_SKIPPED: ${{ tasks.check-generated-mocks-op-service.skipped }}
      TASK_CHECK_NUT_LOCKS_SUCCEEDED: ${{ tasks.check-nut-locks.succeeded }}
      TASK_CHECK_NUT_LOCKS_FAILED: ${{ tasks.check-nut-locks.failed }}
      TASK_CHECK_NUT_LOCKS_SKIPPED: ${{ tasks.check-nut-locks.skipped }}
      TASK_OPGETH_RATCHET_SUCCEEDED: ${{ tasks.opgeth-ratchet.succeeded }}
      TASK_OPGETH_RATCHET_FAILED: ${{ tasks.opgeth-ratchet.failed }}
      TASK_OPGETH_RATCHET_SKIPPED: ${{ tasks.opgeth-ratchet.skipped }}
      TASK_CHECK_OP_GETH_VERSION_SUCCEEDED: ${{ tasks.check-op-geth-version.succeeded }}
      TASK_CHECK_OP_GETH_VERSION_FAILED: ${{ tasks.check-op-geth-version.failed }}
      TASK_CHECK_OP_GETH_VERSION_SKIPPED: ${{ tasks.check-op-geth-version.skipped }}
      TASK_L2_CHAINS_SYNC_CHECK_SUCCEEDED: ${{ tasks.l2-chains-sync-check.succeeded }}
      TASK_L2_CHAINS_SYNC_CHECK_FAILED: ${{ tasks.l2-chains-sync-check.failed }}
      TASK_L2_CHAINS_SYNC_CHECK_SKIPPED: ${{ tasks.l2-chains-sync-check.skipped }}
      TASK_OP_DEPLOYER_FORGE_VERSION_SUCCEEDED: ${{ tasks.op-deployer-forge-version.succeeded }}
      TASK_OP_DEPLOYER_FORGE_VERSION_FAILED: ${{ tasks.op-deployer-forge-version.failed }}
      TASK_OP_DEPLOYER_FORGE_VERSION_SKIPPED: ${{ tasks.op-deployer-forge-version.skipped }}
      TASK_SEMGREP_SCAN_LOCAL_SUCCEEDED: ${{ tasks.semgrep-scan-local.succeeded }}
      TASK_SEMGREP_SCAN_LOCAL_FAILED: ${{ tasks.semgrep-scan-local.failed }}
      TASK_SEMGREP_SCAN_LOCAL_SKIPPED: ${{ tasks.semgrep-scan-local.skipped }}
      TASK_SEMGREP_TEST_SUCCEEDED: ${{ tasks.semgrep-test.succeeded }}
      TASK_SEMGREP_TEST_FAILED: ${{ tasks.semgrep-test.failed }}
      TASK_SEMGREP_TEST_SKIPPED: ${{ tasks.semgrep-test.skipped }}
      TASK_SHELL_CHECK_SUCCEEDED: ${{ tasks.shell-check.succeeded }}
      TASK_SHELL_CHECK_FAILED: ${{ tasks.shell-check.failed }}
      TASK_SHELL_CHECK_SKIPPED: ${{ tasks.shell-check.skipped }}
      TASK_SHFMT_CHECK_SUCCEEDED: ${{ tasks.shfmt-check.succeeded }}
      TASK_SHFMT_CHECK_FAILED: ${{ tasks.shfmt-check.failed }}
      TASK_SHFMT_CHECK_SKIPPED: ${{ tasks.shfmt-check.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/main-checks

  # Bind every complete Contracts prerequisite to fresh engine terminal states.
  - key: contracts-gate-receipt
    use: [code, tools]
    after: ${{ (contracts-fast.succeeded || contracts-fast.failed || contracts-fast.skipped) }}
    if: ${{ init.cache-warm != 'true' }}
    run: python3 ops/ci/runtime/pr-gate.py receipt contracts-checks
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      GROUP_SELECTED: ${{ tasks.route.values.run-contracts }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
      TASK_CONTRACTS_FAST_SUCCEEDED: ${{ tasks.contracts-fast.succeeded }}
      TASK_CONTRACTS_FAST_FAILED: ${{ tasks.contracts-fast.failed }}
      TASK_CONTRACTS_FAST_SKIPPED: ${{ tasks.contracts-fast.skipped }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: receipt
          path: .ci/pr-gates/groups/contracts-checks
