# Complete remaining PR checks, with Circle continuing to own required gates.
on:
  cache-rebuild:
    if: ${{ event.git.branch == 'develop' }}
    target: [go-modules, contract-tools, main-tools, main-superchain, static-tools]
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "true"
      cache-epoch: v1
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        tag: ${{ event.git.tag }}
        cache-warm: "false"
        cache-epoch: v1
      status-checks:
        name: optimism-pr-checks-shadow
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      tag: ""
      cache-warm: "false"
      cache-epoch: v1

tool-cache:
  vault: optimism-op-reth-shadow

base:
  image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  config: rwx/base 1.2.0
  arch: x86_64

defaults:
  runner:
    cpus: 2
    memory: 8gb

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/ethereum-optimism/optimism.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true
      submodules: false

  - key: bootstrap-inputs
    use: code
    run: 'true'
    filter: [mise.toml, ops/ci, .circleci/scripts/apt-install.sh]
    outputs:
      filesystem: false
      artifacts:
        - key: mise-config
          path: mise.toml
        - key: ci-scripts
          path: ops/ci
        - key: apt-script
          path: .circleci/scripts/apt-install.sh

  - key: mise
    call: mise/install 1.1.0
    with:
      mise-version: "2026.2.2"
      install: "false"

  - key: tools
    use: mise
    run: |
      mkdir -p ops/ci .circleci/scripts
      cp "$MISE_CONFIG" mise.toml
      cp "$CI_SCRIPTS/rwx-prepare.sh" ops/ci/
      cp "$APT_SCRIPT" .circleci/scripts/apt-install.sh
      bash ops/ci/rwx-prepare.sh
    env:
      MISE_CONFIG: ${{ tasks.bootstrap-inputs.artifacts.mise-config }}
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
      APT_SCRIPT: ${{ tasks.bootstrap-inputs.artifacts.apt-script }}
    filter:
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-prepare.sh]
    timeout: 30m

  - key: route
    use: [code, tools]
    run: |
      bash ops/ci/rwx-metadata.sh
      jq -er '."c-run_contracts_feature_tests" | if type == "boolean" then tostring else error("missing contracts route") end' \
        .ci/pipeline-parameters.json >"$RWX_VALUES/run-contracts"
    env:
      CI_EVENT: push
      CI_CACHE_WARM: ${{ init.cache-warm }}
      CI_BRANCH: ${{ init.branch }}
      CI_TAG: ${{ init.tag }}
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    cache: false
    timeout: 10m
    outputs:
      filesystem: false
      artifacts:
        - key: routing
          path: .ci/pipeline-parameters.json

  - key: go-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true' }}
    run: bash ops/ci/rwx-prepare.sh go
    timeout: 30m

  - key: contract-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-contracts == 'true' }}
    run: |
      cp "$CI_SCRIPTS/rwx-contracts-prepare.sh" ops/ci/
      bash ops/ci/rwx-contracts-prepare.sh tools
      mise install uv
      PATH="$(mise bin-paths | paste -sd: -):$PATH"
      export PATH
      mise install pipx:semgrep
      printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
    env:
      CI_SCRIPTS: ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}
    filter:
      workspace: [mise.toml, ops/ci/rwx-prepare.sh]
      ${{ tasks.bootstrap-inputs.artifacts.ci-scripts }}: [rwx-contracts-prepare.sh]
    timeout: 30m

  - key: main-tools
    use: go-tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      mise install ripgrep mockery
      printf '%s:%s\n' "$(mise bin-paths | paste -sd: -)" "$PATH" >"$RWX_ENV/PATH"
    timeout: 30m

  - key: static-tools
    use: tools
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: |
      mise install uv shellcheck@0.9.0
      PATH="$(mise bin-paths | paste -sd: -):$PATH"
      export PATH
      mise install pipx:semgrep@1.178.0
      mise exec shellcheck@0.9.0 pipx:semgrep@1.178.0 -- sh -c 'printf "%s\n" "$PATH"' >"$RWX_ENV/PATH"
    timeout: 30m

  - key: static-helper-tests
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      RWX_LIVE_SHELL_FIXTURE=1 RWX_LIVE_SEMGREP_FIXTURE=1 python3 -m unittest discover -s ops/ci -p 'test_static_checks.py'
      python3 -m unittest discover -s ops/ci -p 'test_compare_static_checks.py'
    env:
      RWX_STATIC_FIXTURE_RETAIN_DIR: .ci/static-fixture-evidence
    cache: false
    timeout: 15m
    outputs:
      filesystem: false
      artifacts:
        - key: original-failure-fixtures
          path: .ci/static-fixture-evidence

  - key: shell-check
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: python3 ops/ci/static-checks.py shell-check
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
    cache: false
    timeout: 20m
    runner:
      cpus: 2
      memory: 8gb
    outputs:
      filesystem: false
      test-results:
        - path: .ci/static-checks/shell-check/derived.junit.xml
      artifacts:
        - key: reports
          path: .ci/static-checks/shell-check

  - key: semgrep-test
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      if [[ "$CI_BRANCH" != develop ]]; then
        git fetch --no-tags origin develop
        git update-ref refs/heads/develop FETCH_HEAD
      fi
      python3 ops/ci/static-checks.py semgrep-test
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
    cache: false
    timeout: 20m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: false
      test-results:
        - path: .ci/static-checks/semgrep-test/derived.junit.xml
      artifacts:
        - key: reports
          path: .ci/static-checks/semgrep-test

  - key: semgrep-scan-local
    use: [code, static-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      if [[ "$CI_BRANCH" != develop ]]; then
        git fetch --no-tags origin develop
        git update-ref refs/heads/develop FETCH_HEAD
      fi
      python3 ops/ci/static-checks.py semgrep-scan-local
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
    cache: false
    timeout: 30m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem: false
      test-results:
        - path: .ci/static-checks/semgrep-scan-local/derived.junit.xml
      artifacts:
        - key: reports
          path: .ci/static-checks/semgrep-scan-local

  - key: helper-tests
    use: [code, go-tools]
    if: ${{ init.cache-warm != 'true' && (tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true') }}
    run: |
      RWX_LIVE_GO_FIXTURE=1 python3 -m unittest discover -s ops/ci -p 'test_pr_checks.py'
      python3 -m unittest discover -s ops/ci -p 'test_compare_pr_checks.py'
    cache: false
    timeout: 10m
    outputs:
      filesystem: false

  - key: go-modules
    use: [code, go-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' || tasks.route.values.run-contracts == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      mkdir -p "$GOMODCACHE"
      python3 ops/ci/pr-checks.py go-modules
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
    tool-cache: pr-checks-go-modules-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/pr-checks/modules]
          system: []
      artifacts:
        - key: reports
          path: .ci/pr-checks/go-modules

  - key: contracts-fast
    use: [code, go-tools, go-modules, contract-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-contracts == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/pr-checks/fast-build"
      git submodule sync --recursive
      git -c protocol.file.allow=never submodule update --init --recursive --jobs 8
      python3 ops/ci/pr-checks.py contracts-fast
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    tool-cache: pr-checks-contracts-fast-${{ init.cache-epoch }}
    timeout: 60m
    runner:
      cpus: 16
      memory: 32gb
    outputs:
      filesystem:
        filter:
          workspace: [packages/contracts-bedrock/forge-artifacts, packages/contracts-bedrock/cache/solidity-files-cache.json, packages/contracts-bedrock/artifacts/build-info, .ci/go-cache/pr-checks/fast-build]
          system: []
      test-results:
        - path: .ci/pr-checks/contracts-fast/checks.junit.xml
      artifacts:
        - key: reports
          path: .ci/pr-checks/contracts-fast

  - key: main-helper-tests
    use: [code, main-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      RWX_LIVE_MAIN_FIXTURE=1 python3 -m unittest discover -s ops/ci -p 'test_main_checks.py'
      python3 -m unittest discover -s ops/ci -p 'test_compare_main_checks.py'
    cache: false
    timeout: 15m
    outputs:
      filesystem: false

  - key: main-superchain
    use: [code, go-tools]
    if: ${{ init.cache-warm == 'true' || tasks.route.values.run-main == 'true' }}
    run: python3 ops/ci/main-checks.py --prepare-superchain
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
    timeout: 15m
    outputs:
      filesystem:
        filter:
          workspace: [op-core/superchain/superchain-configs.zip]
          system: []
      artifacts:
        - key: reports
          path: .ci/main-checks/prep-superchain

  - key: todo-issues-check
    use: [code, main-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      python3 ops/ci/main-checks.py todo-issues-check
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    timeout: 30m
    runner:
      cpus: 2
      memory: 8gb
    outputs:
      filesystem: false
      test-results:
        - path: .ci/main-checks/todo-issues-check/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/todo-issues-check

  - key: l2-chains-sync-check
    use: [code, main-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      python3 ops/ci/main-checks.py l2-chains-sync-check
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    timeout: 30m
    runner:
      cpus: 2
      memory: 8gb
    outputs:
      filesystem: false
      test-results:
        - path: .ci/main-checks/l2-chains-sync-check/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/l2-chains-sync-check

  - key: op-deployer-forge-version
    use: [code, main-tools]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      python3 ops/ci/main-checks.py op-deployer-forge-version
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    timeout: 30m
    runner:
      cpus: 2
      memory: 8gb
    outputs:
      filesystem: false
      test-results:
        - path: .ci/main-checks/op-deployer-forge-version/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/op-deployer-forge-version

  - key: check-op-geth-version
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-op-geth-version"
      python3 ops/ci/main-checks.py check-op-geth-version
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    tool-cache: main-checks-check-op-geth-version-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-op-geth-version]
          system: []
      test-results:
        - path: .ci/main-checks/check-op-geth-version/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/check-op-geth-version

  - key: check-nut-locks
    use: [code, main-tools, go-modules]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-nut-locks"
      python3 ops/ci/main-checks.py check-nut-locks
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    tool-cache: main-checks-check-nut-locks-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 4
      memory: 8gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-nut-locks]
          system: []
      test-results:
        - path: .ci/main-checks/check-nut-locks/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/check-nut-locks

  - key: check-generated-mocks-op-node
    use: [code, main-tools, go-modules, main-superchain]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-generated-mocks-op-node"
      python3 ops/ci/main-checks.py check-generated-mocks-op-node
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      SUPERCHAIN_PREPARED: ${{ tasks.main-superchain.artifacts.reports }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    tool-cache: main-checks-check-generated-mocks-op-node-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-generated-mocks-op-node]
          system: []
      test-results:
        - path: .ci/main-checks/check-generated-mocks-op-node/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/check-generated-mocks-op-node

  - key: check-generated-mocks-op-service
    use: [code, main-tools, go-modules, main-superchain]
    if: ${{ init.cache-warm != 'true' && tasks.route.values.run-main == 'true' }}
    run: |
      export GOMODCACHE="$PWD/.ci/go-cache/pr-checks/modules"
      export GOCACHE="$PWD/.ci/go-cache/main-checks/check-generated-mocks-op-service"
      python3 ops/ci/main-checks.py check-generated-mocks-op-service
    env:
      CI_COMMIT_SHA: ${{ init.commit-sha }}
      CI_BRANCH: ${{ init.branch }}
      CI_CHECK_PROVIDER: rwx
      SUPERCHAIN_PREPARED: ${{ tasks.main-superchain.artifacts.reports }}
      RWX_RUN_ID:
        cache-key: included
      RWX_TASK_ATTEMPT_NUMBER:
        cache-key: included
    cache: false
    tool-cache: main-checks-check-generated-mocks-op-service-${{ init.cache-epoch }}
    timeout: 30m
    runner:
      cpus: 8
      memory: 16gb
    outputs:
      filesystem:
        filter:
          workspace: [.ci/go-cache/main-checks/check-generated-mocks-op-service]
          system: []
      test-results:
        - path: .ci/main-checks/check-generated-mocks-op-service/check.junit.xml
      artifacts:
        - key: reports
          path: .ci/main-checks/check-generated-mocks-op-service
