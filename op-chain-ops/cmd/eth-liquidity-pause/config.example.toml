# Example config for eth-liquidity-pause. Pass with --config <path>.
# Keys are the flag names. CLI flags and ETH_LIQUIDITY_PAUSE_* env vars override anything set here.
# Each command ignores keys it doesn't register, so one file can serve every command.

# --- Every command ---
l2 = ["http://localhost:9545", "http://localhost:9546"]
# status works without l1 / l1-messenger (L2 side only); sync and devnet-* need them. Uncomment
# both and give one l1-messenger per l2 entry, in the same order: l1-messenger[i] is the
# L1CrossDomainMessenger proxy of the chain at l2[i].
# l1 = "http://localhost:8545"
# l1-messenger = [
#   "<L1CrossDomainMessenger proxy of l2[0]>",
#   "<L1CrossDomainMessenger proxy of l2[1]>",
# ]

# --- status ---
# Sender of the sendETH eth_call; its balance is overridden, so any address works.
from = "0x000000000000000000000000000000000000bEEF"
# Destination chain for the sendETH eth_call; 0 means the chain's own ID + 1.
destination = 0
# "paused", "unpaused", or "" to only report.
expect = ""
json = false

# --- sync, devnet-pause, devnet-unpause ---
# The sync sender: any funded L1 account, because the sync is permissionless. Set one of
# private-key (hex), mnemonic or signer.endpoint; every txmgr flag can also go here.
# devnet-* send the sync from guardian-key when none is set.
private-key = ""
# Bounds each wait for L2 to apply a sync. The txmgr flags (txmgr.send-timeout and others)
# bound the L1 wait. Strings parsed by time.ParseDuration.
timeout = "5m"

# --- sync only ---
# Sync chains whose L2 already matches L1.
force = false

# --- devnet-pause, devnet-unpause only ---
# The devnet SuperchainConfig guardian key.
guardian-key = ""
