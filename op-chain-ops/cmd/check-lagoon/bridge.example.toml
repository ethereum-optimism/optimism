# interop-smoke bridge config. Pass with: interop-smoke bridge --config bridge.toml
# CLI flags and INTEROP_SMOKE_* env vars override values set here.

l2a-rpc = "https://an-my-devnet-0-opn-reth-a-rpc-0-op-reth.us.networks.ent.dev.oplabs.cloud"
l2b-rpc = "https://an-my-devnet-1-opn-reth-a-rpc-0-op-reth.us.networks.ent.dev.oplabs.cloud"

# Hex private key without 0x prefix. If omitted, uses the default dev mnemonic key.
private-key = ""

# Round-trip loops: each loop = 2 bridge trips (A→B then B→A).
# 0 = one one-way A→B trip.
loops = 10

# --- Used only by --test-failsafe ---
# One entry per op-interop-filter instance; jwt-secret values are 32-byte hex (0x optional).
# [filter]
# admin-rpc = ["http://filter-a:8420", "http://filter-b:8420"]
# jwt-secret = ["0xdeadbeef0000000000000000000000000000000000000000000000000000cafe", "0xdeadbeef0000000000000000000000000000000000000000000000000000beef"]
