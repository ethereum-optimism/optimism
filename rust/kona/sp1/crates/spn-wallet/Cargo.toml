[package]
name = "spn-wallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Check, fund, and bridge PROVE balances on the Succinct Prover Network"
publish = false

[lints]
workspace = true

[dependencies]
# sp1
sp1-sdk.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
prost = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["ring"] }

# alloy
alloy-contract.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-signer.workspace = true
alloy-signer-gcp.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
# Provides the HTTPS-capable reqwest transport (and its `Url`) for the L1 provider.
alloy-transport-http = { workspace = true, features = ["reqwest", "reqwest-rustls-tls"] }

# misc
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive", "env"] }
humantime.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
