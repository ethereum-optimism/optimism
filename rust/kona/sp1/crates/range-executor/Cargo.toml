[package]
name = "kona-sp1-range-executor"
version = "0.0.1"
publish = false
license.workspace = true
edition.workspace = true

[[bin]]
name = "kona-sp1-range-executor"
path = "src/main.rs"

[dependencies]
sp1-sdk.workspace = true

# local
# `test-tamper-witness` exposes `PreimageStore::overwrite_preimage`, used to corrupt the claim for the
# invalid-claim (soundness) test path.
kona-sp1-client-utils = { workspace = true, features = ["test-tamper-witness"] }
kona-sp1-elfs.workspace = true
kona-sp1-ethereum-client-utils.workspace = true
kona-sp1-ethereum-host-utils.workspace = true
kona-sp1-host-utils.workspace = true

# kona
kona-host = { workspace = true, features = ["single"] }
kona-preimage = { workspace = true, features = ["std"] }
kona-proof.workspace = true

# alloy
alloy-primitives.workspace = true

# general
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[lints]
workspace = true
