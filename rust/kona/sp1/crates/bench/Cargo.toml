[package]
name = "kona-sp1-range-bench"
version = "0.0.1"
publish = false
license.workspace = true
edition.workspace = true

[[bin]]
name = "range-bench"
path = "src/main.rs"

[[bin]]
name = "agg-bench"
path = "src/agg_bench.rs"

[[bin]]
name = "plonk-prove-bench"
path = "src/plonk_prove_bench.rs"

[features]
# Build the SP1 CUDA prover into the bench binaries. Select it at runtime with
# `SP1_PROVER=cuda`. Requires a CUDA-capable NVIDIA GPU at run time.
gpu = ["sp1-sdk/cuda"]

[dependencies]
sp1-sdk.workspace = true

kona-sp1-client-utils.workspace = true
kona-sp1-proof-utils.workspace = true
kona-sp1-host-utils.workspace = true

anyhow.workspace = true
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
bincode.workspace = true
serde_cbor.workspace = true
tracing.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
url.workspace = true

[lints]
workspace = true
