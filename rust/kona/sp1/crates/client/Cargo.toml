[package]
name = "kona-sp1-client-utils"
version = "0.0.1"
publish = false
license.workspace = true
edition.workspace = true

[dependencies]
# ethereum
op-alloy-consensus.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true

# Execution
alloy-evm.workspace = true
alloy-op-evm.workspace = true
op-revm.workspace = true
revm.workspace = true

# kona
kona-preimage = { workspace = true, features = ["serde", "rkyv"] }
kona-derive.workspace = true
kona-proof.workspace = true
kona-executor.workspace = true
kona-mpt.workspace = true
op-alloy-rpc-types-engine = { workspace = true, features = ["serde"] }
miniz_oxide.workspace = true
kona-driver.workspace = true
# Groth16 verification of `sp1-private-projection-v1` envelopes, for the super-range program
# (admission runs inside its derivation) and the host.
kona-protocol = { workspace = true, features = ["sp1-projection-verifier"] }
kona-genesis = { workspace = true, features = ["serde"] }
kona-interop = { workspace = true, features = ["serde"] }

# general
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
rkyv = { workspace = true, features = ["hashbrown-0_15", "std"] }
sha2.workspace = true
tracing.workspace = true
spin.workspace = true

# kzg
kzg-rs.workspace = true
cfg-if.workspace = true

[dev-dependencies]
alloy-trie.workspace = true
alloy-rpc-types-engine.workspace = true
kona-protocol = { workspace = true, features = ["private-projection-test-verifiers"] }

[features]
# Exposes the canonical super-aggregation fixture to downstream guest tests. Kept narrowly named
# to avoid Zepter propagating unrelated dependency test features.
aggregation-test-utils = []

[lints]
workspace = true
