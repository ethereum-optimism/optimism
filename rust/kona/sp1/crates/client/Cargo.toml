[package]
name = "kona-sp1-client-utils"
version = "0.0.1"
publish = false
license.workspace = true
edition.workspace = true

[dependencies]
# ethereum
op-alloy-consensus.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true

# Execution
alloy-evm.workspace = true
alloy-op-evm.workspace = true
op-revm.workspace = true
revm.workspace = true

# kona
kona-preimage = { workspace = true, features = ["serde", "rkyv"] }
kona-derive.workspace = true
kona-proof.workspace = true
kona-executor.workspace = true
kona-driver.workspace = true
kona-protocol.workspace = true
kona-genesis.workspace = true
kona-interop = { workspace = true, features = ["serde"] }

# general
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
rkyv = { workspace = true, features = ["hashbrown-0_15", "std"] }
sha2.workspace = true
tracing.workspace = true
spin.workspace = true

# kzg
kzg-rs.workspace = true
cfg-if.workspace = true

[features]
# Exposes witness-tampering helpers (e.g. `PreimageStore::overwrite_preimage`) used by host-side
# test tooling. Never enabled by the guest program. Deliberately not named `test-utils`: that would
# trigger Zepter's propagate-feature check and drag the dependencies' `test-utils` (incl. RPC deps
# via kona-executor) into this crate, which is not wanted for a single tampering helper.
test-tamper-witness = []

[lints]
workspace = true
