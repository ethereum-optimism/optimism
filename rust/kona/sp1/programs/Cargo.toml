[workspace]
members = [
  "range",
  "aggregation",
  "super-range",
  "super-aggregation",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Op Stack Contributors"]
homepage = "https://github.com/ethereum-optimism/optimism"
repository = "https://github.com/ethereum-optimism/optimism"

# Generated from rust/Cargo.toml by `just fmt-fix`; checked by the guest lint
# and formatting recipes. Cargo cannot inherit lints across workspaces, and
# this workspace must remain separate to isolate the SP1 crypto patches.
# BEGIN SHARED WORKSPACE LINTS
[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = { level = "deny", priority = -1 }
unnameable-types = "warn"
rust-2024-incompatible-pat = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
# warn-level lints
all = { level = "warn", priority = -1 }
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
missing-const-for-fn = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option-if-let-else = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant-clone = "warn"
redundant_else = "warn"
single_char_pattern = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use-self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"
zero_sized_map_values = "warn"

# allow-level lints
as_ptr_cast_mut = "allow"
cognitive_complexity = "allow"
debug_assert_with_mut_call = "allow"
fallible_impl_from = "allow"
future_not_send = "allow"
needless_collect = "allow"
non_send_fields_in_send_ty = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"
too_long_first_doc_paragraph = "allow"
# END SHARED WORKSPACE LINTS

[workspace.dependencies]
# Guest path dependencies. Paths are relative to rust/kona/sp1/programs.
kona-proof = { path = "../../crates/proof/proof", version = "0.3.0", default-features = false }
kona-proof-interop = { path = "../../crates/proof/proof-interop", version = "0.2.0", default-features = false }
kona-preimage = { path = "../../crates/proof/preimage", version = "0.3.0", default-features = false }
kona-interop = { path = "../../crates/protocol/interop", version = "0.4.5", default-features = false }
kona-genesis = { path = "../../crates/protocol/genesis", version = "0.4.5", default-features = false }
kona-registry = { path = "../../crates/protocol/registry", version = "0.4.5", default-features = false }
kona-sp1-client-utils = { path = "../crates/client" }
kona-sp1-ethereum-client-utils = { path = "../crates/ethereum/client" }
kona-sp1-range-vkeys = { path = "../crates/range-vkeys" }

# Feature anchor only: revm's `bn` forwards to revm-precompile/bn so the guest
# build uses the SP1-patched substrate-bn backend for bn128.
revm = { version = "41.0.0", default-features = false, features = ["bn"] }

alloy-primitives = { version = "1.6.1", default-features = false, features = [
  "map-foldhash",
] }
alloy-chains = { version = "0.2.33", default-features = false }
alloy-sol-types = { version = "1.6.1", default-features = false }
alloy-consensus = { version = "2.1.1", default-features = false }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-op-evm = { version = "0.32.0", path = "../../../alloy-op-evm", default-features = false }
sp1-lib = { version = "6.3.1", features = ["verify"] }
sp1-zkvm = { version = "6.3.1", features = ["verify"] }
sha2 = { version = "0.10.9", default-features = false }
rkyv = "0.8.15"
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
serde_cbor = "0.11.2"
bincode = "1.3.3"
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false }
anyhow = { version = "1.0.101", default-features = false }

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.2.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.2.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.2.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.2.0-substrate-bn" }
