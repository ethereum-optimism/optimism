[package]
name = "foldhash"
version = "0.2.0"
publish = false
description = "SP1-guest foldhash 0.2.0 whose RandomState is keyed by a seed the guest takes from its input"
license.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# Fork of orlp/foldhash. On a bump: set `version` above and `tag`; the tag's commit must be
# `git.sha1` in the crates.io release's `.cargo_vcs_info.json`.
upstream = { package = "foldhash", git = "https://github.com/ethereum-optimism/foldhash", tag = "v0.2.0", default-features = false }

[lints]
workspace = true
