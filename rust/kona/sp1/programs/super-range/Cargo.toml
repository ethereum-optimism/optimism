[package]
name = "kona-sp1-super-range"
version = "0.0.1"
publish = false
license.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
kona-proof.workspace = true
# Kona derivation inside this program runs private-projection span admission, so the
# `sp1-private-projection-v1` Groth16 envelope is verified in-guest with `sp1-verifier`
# (spec-sound-profile §F.4). Never the test verifiers: mock envelopes fail inside the proof.
kona-protocol = { workspace = true, features = ["sp1-projection-verifier"] }
kona-sp1-build-info.workspace = true
kona-sp1-client-utils.workspace = true
kona-sp1-ethereum-client-utils.workspace = true

# Feature anchor only: revm's `bn` forwards to revm-precompile/bn
# (substrate-bn backend) in the guest build.
revm.workspace = true

rkyv.workspace = true
sp1-zkvm.workspace = true

[lints]
workspace = true
