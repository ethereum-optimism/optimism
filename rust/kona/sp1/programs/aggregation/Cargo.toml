[package]
name = "kona-sp1-aggregation"
version = "0.0.1"
publish = false
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true
sp1-zkvm.workspace = true
sp1-lib.workspace = true
kona-sp1-client-utils.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
serde_cbor.workspace = true
bincode.workspace = true

[features]
# Benchmark-only: skip the range-linkage checks (boot-info contiguity and the L1
# head/header chain) while still performing one `verify_sp1_proof` per supplied
# proof. Lets a duplicated/non-contiguous proof set be aggregated so the cost of
# Nx recursive verification can be measured without generating N distinct range
# proofs. NEVER enable for a production aggregation ELF.
bench-recursion = []

[lints]
workspace = true
