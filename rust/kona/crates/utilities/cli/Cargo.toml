[package]
name = "kona-cli"
version = "0.3.2"
description = "Shared CLI utilities for Kona crates"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# General
tracing.workspace = true
serde = { workspace = true, features = ["derive"]}
clap = { workspace = true, features = ["derive", "env"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json", "tracing-log", "ansi"] }
tracing-appender.workspace = true
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
metrics-process.workspace = true
thiserror.workspace = true

# `secrets` feature
libp2p = { workspace = true, features = ["secp256k1"], optional = true }
alloy-primitives = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = []
secrets = [ "dep:alloy-primitives", "dep:libp2p" ]
