[package]
name = "kona-sources"
version = "0.1.2"
description = "Data source types and utilities for the kona-node"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
authors.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace

# Alloy
alloy-transport.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-json-rpc.workspace = true
alloy-rpc-client.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["jwt"] }
alloy-transport-http = { workspace = true, features = ["reqwest", "reqwest-rustls-tls", "hyper", "hyper-tls", "jwt-auth"] }

alloy-signer.workspace = true
alloy-signer-local.workspace = true

# OP Alloy
op-alloy-network.workspace = true
op-alloy-rpc-types-engine.workspace = true

# Misc
backon = { workspace = true, features = ["std", "tokio", "tokio-sleep"] }
base64.workspace = true
http-body-util.workspace = true
metrics.workspace = true
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
thiserror.workspace = true
derive_more.workspace = true

# HTTP client and TLS for remote signer
url.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs"] }
rustls-platform-verifier.workspace = true
notify.workspace = true

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "test-util"] }
tempfile.workspace = true
serde_json.workspace = true
metrics-exporter-prometheus.workspace = true
rstest.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
