[package]
name = "kona-node-actors"
description = "Actors for the OP Stack consensus node"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
kona-gossip.workspace = true
kona-disc.workspace = true
kona-engine.workspace = true
kona-sources.workspace = true
kona-providers-alloy = { workspace = true, features = ["metrics"] }
kona-genesis.workspace = true
kona-derive = { workspace = true, features = ["metrics"] }
kona-protocol.workspace = true
kona-peers.workspace = true

# alloy
alloy-signer.workspace = true
alloy-primitives.workspace = true
alloy-rpc-client.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["jwt", "serde"] }
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-rustls-tls", "hyper", "hyper-tls"] }
alloy-eips.workspace = true
alloy-transport.workspace = true

# op-alloy
op-alloy-network.workspace = true
op-alloy-rpc-types-engine = { workspace = true, features = ["std"] }

# general
url.workspace = true
libp2p = { workspace = true, features = ["metrics"] }
discv5.workspace = true
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
strum = { workspace = true, features = ["derive"] }
derive_more = { workspace = true, features = ["debug", "eq", "constructor"] }
jsonrpsee = { workspace = true, features = ["server", "client-core"] }
tokio = { workspace = true, features = ["macros"] }

metrics.workspace = true

[dev-dependencies]
alloy-chains.workspace = true
alloy-signer-local.workspace = true
tower.workspace = true

alloy-json-rpc.workspace = true
serde_json.workspace = true
kona-engine = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }
enr.workspace = true
rstest.workspace = true
arbitrary.workspace = true
rand.workspace = true
mockall.workspace = true
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-rpc-types-engine = { workspace = true, features = ["arbitrary"] }
alloy-consensus = { workspace = true, features = ["arbitrary"] }
op-alloy-consensus = { workspace = true, features = ["arbitrary", "k256"] }
kona-derive = {workspace = true, features = ["test-utils"]}

[features]
default = []
