[package]
name = "kona-preimage"
description = "Bindings and types for interacting with the PreimageOracle ABI"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# General
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
alloy-primitives.workspace = true

# `std` feature dependencies
async-channel = { workspace = true, optional = true }

# `verify` feature dependencies
sha2 = { workspace = true, optional = true }

# `rkyv` feature dependencies
rkyv = { workspace = true, optional = true }

# `serde` feature dependencies
serde = { workspace = true, optional = true, features = ["derive"] }

# The self dev-dependency below enables this crate's own non-default features for
# its standalone test build (`cargo test -p kona-preimage`). cargo-udeps reports it
# unused because it activates features rather than importing symbols, so ignore it.
[package.metadata.cargo-udeps.ignore]
development = ["kona-preimage"]

[dev-dependencies]
kona-preimage = { path = ".", features = ["std"] }
tokio = { workspace = true, features = ["full"] }
sha2.workspace = true

[features]
default = []
std = [
	"alloy-primitives/std",
	"dep:async-channel",
	"serde?/std",
	"sha2?/std",
	"thiserror/std",
	"tracing/std",
]
rkyv = [ "dep:rkyv" ]
serde = [ "alloy-primitives/serde", "dep:serde" ]
verify = [ "dep:sha2" ]
