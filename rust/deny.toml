[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# Used only by the daily `rust-deny-advisories` CI job, never on PRs: advisories
# change without a repo change. `just deny` runs bans, licenses and sources.
[advisories]
# Unmaintained crates are not vulnerabilities, and most are deep in reth or SP1.
unmaintained = "none"
yanked = "warn"
# Advisories with no fix yet or that do not affect what we ship. The job fails
# once a "review by" date has passed, so each entry gets looked at again.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing issues. Comes in through elliptic-curve 0.13.8, the latest 0.13, and no fixed 0.5.x exists. The 0.7 copy is fixed from 0.7.6. Review by 2026-12-16." },
  { id = "RUSTSEC-2026-0418", reason = "libz-sys build script prints the build environment only when compiled with cc 1.6.0 or later. Cargo.lock has cc 1.2.62. Fixed in libz-sys 1.1.31. Review by 2026-12-16." },
  { id = "RUSTSEC-2026-0433", reason = "pulldown-cmark slow parsing of nested wikilinks. Build-time only, prost-build reads SP1's own .proto comments. Not in any shipped binary. Fixed in 0.13.6. Review by 2026-12-16." },
]

# This section is considered when running `cargo deny check bans`.
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [{ name = "openssl", wrappers = ["kona-gossip", "native-tls"] }]
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8

allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "ISC",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
  "LicenseRef-rustls-webpki",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

exceptions = [
  # CC0 is a permissive license but somewhat unclear status for source code
  # https://tldrlegal.com/license/creative-commons-cc0-1.0-universal
  { allow = ["CC0-1.0"], name = "secp256k1" },
  { allow = ["CC0-1.0"], name = "aurora-engine-modexp" },
  { allow = ["CC0-1.0"], name = "secp256k1-sys" },
  { allow = ["CC0-1.0"], name = "tiny-keccak" },
  { allow = ["CC0-1.0"], name = "notify" },
  # aws-lc-sys includes OpenSSL in its composite license expression
  { allow = ["OpenSSL"], name = "aws-lc-sys" },
  # gmp feature (optional, LGPL-licensed)
  # gmp-mpfr-sys uses deprecated "LGPL-3.0+" identifier; equivalent to "LGPL-3.0-or-later"
  { allow = ["LGPL-3.0-or-later"], crate = "rug" },
  { allow = ["LGPL-3.0-or-later", "LGPL-3.0"], crate = "gmp-mpfr-sys" },
  # Grandfathered MPL-2.0 exceptions from op-reth
  { allow = ["MPL-2.0"], name = "option-ext" },
  { allow = ["MPL-2.0"], name = "webpki-root-certs" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "rustls-webpki"
expression = "LicenseRef-rustls-webpki"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[[licenses.clarify]]
name = "webpki"
expression = "LicenseRef-webpki"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[licenses.private]
ignore = false
registries = []

[sources]
allow-git = [
  "https://github.com/paradigmxyz/reth",
  # Maintenance fork carrying patches not yet included in the selected upstream release.
  "https://github.com/ethereum-optimism/reth",
  "https://github.com/alloy-rs/alloy",
  "https://github.com/alloy-rs/hardforks",
  "https://github.com/alloy-rs/evm",
  "https://github.com/bluealloy/revm",
  "https://github.com/paritytech/jsonrpsee",
  "https://github.com/paradigmxyz/jsonrpsee",
  "https://github.com/paradigmxyz/revm-inspectors",
  "https://github.com/foundry-rs/block-explorers",
  "https://github.com/sigp/discv5",
]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
