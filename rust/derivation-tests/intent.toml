configType = "custom"
opDeployerVersion = "v0.0.0-dev"
l1ChainID = 900
fundDevAccounts = true
l1ContractsLocator = "embedded"
l2ContractsLocator = "embedded"
useInterop = false

# Pin the L1 genesis timestamp for deterministic genesis hashes.
# This ensures every run of generate-genesis.sh produces the same L1 and L2
# genesis blocks, making golden test hashes stable.
[l1DevGenesisParams]
  pragueTimeOffset = 0
  [l1DevGenesisParams.blockParams]
    timestamp = 1700000000
    gasLimit = 30000000

