msrv = "1.99"
too-large-for-stack = 128
doc-valid-idents = [
    "P2P",
    "ExEx",
    "ExExes",
    "IPv4",
    "IPv6",
    "KiB",
    "MiB",
    "GiB",
    "TiB",
    "PiB",
    "EiB",
    "WAL",
    "MessagePack",
]
allow-dbg-in-tests = true
# Reading the system clock directly bypasses tokio's clock, which tests pause and advance. Only
# enforced where `clippy::disallowed_methods` is enabled: it is allowed in the workspace lints and
# warned on in `kona-node-service`'s actors.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "read wall-clock time from an injected `Clock`" },
    { path = "std::time::Instant::now", reason = "use `tokio::time::Instant`, which follows tokio's clock" },
]
