[package]
name = "lokahi"
version = "0.1.0"
description = "Rust implementation of the OP Stack supernode: a multi-chain consensus-layer host"

edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# workspace
op-version.workspace = true

kona-cli = { workspace = true, features = ["secrets"] }
kona-disc = { workspace = true, features = ["metrics"] }
kona-derive = { workspace = true, features = ["metrics"] }
kona-engine = { workspace = true, features = ["metrics"] }
kona-genesis.workspace = true
kona-gossip = { workspace = true, features = ["metrics"] }
kona-interop = { workspace = true, features = ["serde"] }
kona-node-service = { workspace = true, features = ["metrics"] }
kona-peers.workspace = true
kona-providers-alloy = { workspace = true, features = ["metrics"] }
kona-registry.workspace = true
kona-rpc.workspace = true
kona-safedb = { workspace = true, features = ["rocksdb"] }

# The interop verifier, with the on-disk stores it keeps its state in.
lokahi-interop = { workspace = true, features = ["rocksdb"] }

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["jwt", "serde"] }

# op-alloy
op-alloy-network.workspace = true

# general
anyhow.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
discv5.workspace = true
jsonrpsee = { workspace = true, features = ["macros", "server"] }
libp2p.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-util.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
tracing.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The two-chain smoke test talks to the binary it starts, over the same client a caller would use.
jsonrpsee = { workspace = true, features = ["http-client"] }
tempfile.workspace = true
