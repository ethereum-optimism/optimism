# An example `lokahi` configuration: two chains on one L1, in one process.
#
# `[l1]` and `[defaults]` are the global layer; each `[[chains]]` entry overlays `[defaults]` with
# what is specific to that chain. This file is parsed by lokahi's test suite, so it cannot drift
# from what the code accepts.

[l1]
eth-rpc = "http://localhost:8545"
beacon = "http://localhost:5052"
# A devnet L1 is not in the registry, so its chain config comes from a file.
chain-config = "/etc/lokahi/l1-genesis.json"
# How often, in seconds, to poll the L1 for epoch updates (finalized-block changes) — op-node's
# `--l1.epoch-poll-interval`. Unset keeps kona's default of one poll a minute, which suits a
# production L1; a devnet whose L1 finalizes in seconds sets this to match.
# epoch-poll-interval = 2

# The supernode's RPC socket. One socket serves everything: these namespaces at `/`, and each chain
# below at `/<l2-chain-id>` — the same addressing op-supernode serves. Omit the table to expose no
# RPC at all; the chains have nowhere else to be served from. Port 0 asks the OS for a free port,
# which the supernode then logs — that is how a test harness that launched the process finds it.
[admin]
rpc-addr = "127.0.0.1"
rpc-port = 9500

# Process-wide interop settings. Optional, and normally absent.
#
# activation-timestamp overrides where interop verification starts. Left out -- the default --
# lokahi reads it from each chain's Lagoon time, which is also where the message rules it applies
# read it, so the verifier and the proof cannot end up on different rules. Set it only when the
# rollup configs cannot carry the fork: it supplies an activation for a chain that schedules no
# Lagoon, and is refused if it disagrees with a fork a chain does schedule.
# [interop]
# activation-timestamp = 1735689600

# What every chain shares. A chain overrides any of these.
[defaults]
datadir = "/var/lib/lokahi"
jwt-secret = "/etc/lokahi/jwt.hex"
mode = "validator"
rpc-enable-admin = true
# The experimental `opstack` block-building namespace on each chain's route, op-node's
# `--experimental.sequencer-api`. Off unless a test sequencer is meant to drive the chain.
# experimental-opstack-api = true

[[chains]]
l2-chain-id = 901
rollup-config = "/etc/lokahi/rollup-901.json"
engine-rpc = "http://localhost:9551"
p2p-tcp-port = 9222
p2p-udp-port = 9222
unsafe-block-signer = "0x1111111111111111111111111111111111111111"

# A chain this supernode sequences rather than validates. Sequencing needs a key to sign the blocks
# the chain gossips, and the address it signs with is what `unsafe-block-signer` has to name: a
# supernode cannot read that address off the chain's SystemConfig, so the two are stated here and a
# disagreement between them is logged at startup. A key is generated at `sequencer-key-path` when
# no file is there yet, so check that warning after a first start: a mistyped path produces a
# sequencer whose blocks every peer drops. The remaining `sequencer-*` settings default to
# kona-node's, and a chain that does not sequence may not state them at all.
[[chains]]
l2-chain-id = 902
rollup-config = "/etc/lokahi/rollup-902.json"
engine-rpc = "http://localhost:9561"
p2p-tcp-port = 9232
p2p-udp-port = 9232
unsafe-block-signer = "0x2222222222222222222222222222222222222222"
mode = "sequencer"
sequencer-key-path = "/etc/lokahi/sequencer-902.key"
sequencer-stopped = false
sequencer-l1-confs = 4
sequencer-recover = false
# conductor-rpc = "http://localhost:8547"
