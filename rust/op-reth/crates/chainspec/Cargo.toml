[package]
name = "reth-optimism-chainspec"
version = "1.11.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"
description = "EVM chain spec implementation for optimism."

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-ethereum-forks.workspace = true
reth-primitives-traits.workspace = true
reth-network-peers.workspace = true

# op-reth
reth-optimism-forks.workspace = true
reth-optimism-primitives = { workspace = true, features = ["serde", "reth-codec"] }

# ethereum
alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-hardforks.workspace = true

# op
op-alloy-rpc-types.workspace = true

serde = { workspace = true, optional = true }
serde_json.workspace = true

# io
# Runtime zstd decoder for genesis files (with the dictionary shipped by
# op-superchain in the embedded zip).
zstd = { version = "0.13", optional = true }

# misc
derive_more.workspace = true
paste = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
op-alloy-consensus.workspace = true

[build-dependencies]
op-superchain = { workspace = true }
serde_json.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }

[dev-dependencies]
reth-chainspec = { workspace = true, features = ["test-utils"] }
alloy-op-hardforks.workspace = true

[features]
default = ["std"]
# `superchain-configs` ships per-chain genesis + config bytes generated at
# build.rs time from the op-superchain zip. Decompression uses the std `zstd`
# crate, so the feature requires `std`.
superchain-configs = ["std", "paste", "thiserror", "dep:serde", "dep:zstd"]
std = [
    "alloy-chains/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-eips/std",
    "op-alloy-rpc-types/std",
    "reth-chainspec/std",
    "reth-ethereum-forks/std",
    "reth-primitives-traits/std",
    "reth-optimism-forks/std",
    "reth-optimism-primitives/std",
    "alloy-consensus/std",
    "derive_more/std",
    "reth-network-peers/std",
    "serde_json/std",
    "serde?/std",
    "thiserror?/std",
    "op-alloy-consensus/std",
]
serde = [
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-hardforks/serde",
    "alloy-primitives/serde",
    "op-alloy-rpc-types/serde",
    "reth-ethereum-forks/serde",
    "reth-optimism-forks/serde",
    "reth-optimism-primitives/serde",
    "reth-primitives-traits/serde",
    "op-alloy-consensus/serde",
    "alloy-op-hardforks/serde",
]
