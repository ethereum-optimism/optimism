[package]
name = "lokahi-interop"
version = "0.1.0"
description = "The lokahi interop verifier: its stores and its verification round loop"

edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Kona
# `metrics` matches what the lokahi binary enables. Features are additive across the graph, so a
# lokahi build compiles kona-engine with them on regardless; declaring it here keeps a standalone
# `-p lokahi-interop` build identical to the one that ships, and avoids a second kona-engine build.
kona-engine = { workspace = true, features = ["metrics"] }
kona-genesis.workspace = true
kona-interop.workspace = true
kona-protocol.workspace = true

# Alloy
alloy-eips.workspace = true
alloy-primitives.workspace = true

# Storage
rocksdb = { workspace = true, features = ["snappy"], optional = true }

# Misc
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
alloy-sol-types.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
# Enables the on-disk [`RocksKv`] backend. Off by default so that consumers needing only the
# store traits, the record encodings or the in-memory backend avoid the rocksdb/libclang build
# dependency.
rocksdb = ["dep:rocksdb"]
