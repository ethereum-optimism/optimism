# Standalone Foundry project for the hevm equivalence harness, so hevm loads only these artifacts.
# The code under test is NOT compiled here: it is the repo-built runtime bytecode in L2ToL2Bytecodes.sol.
# test/ resolves test/setup/Test.sol; src/, interfaces/ and scripts/ are only for run.sh's mutants,
# generated into mutants/ while it runs, which import the real source.
[profile.default]
src = '.'
test = '.'
script = '.'
out = 'out'
cache_path = 'cache'
libs = ['../../../../lib']
remappings = [
  '@openzeppelin/contracts-v5/=../../../../lib/openzeppelin-contracts-v5/contracts',
  'forge-std/=../../../../lib/forge-std/src',
  'src/=../../../../src/',
  'interfaces/=../../../../interfaces/',
  'scripts/=../../../../scripts/',
  'test/=../../../../test/',
]
allow_paths = ['../../../..']
solc_version = '0.8.25'
evm_version = 'cancun'
optimizer = false
deny = 'warnings'
ast = true
bytecode_hash = 'none'

# As in the repo's foundry.toml: no forge lint on build (with deny = 'warnings', forge 1.8.x would
# fail the build on lint findings in the harness; the repo lints separately).
[lint]
lint_on_build = false

# Declared so the inline forge-config budgets for the repo's CI profiles parse here too.
[profile.liteci]

[profile.ciheavy]
