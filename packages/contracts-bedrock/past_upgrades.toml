# Past upgrades that need to be executed when forking a network at a block
# before those upgrades were executed.
#
# Add new upgrades here when introducing new upgrades that need to be sequenced.
#
# V1 upgrades (opcm_version = 1):
#   - name: Human-readable name for logging
#   - opcm_version: 1
#   - opcm_addresses: Map of chain ID to OPCM address
#   - cannon_prestate: Cannon prestate hash
#   - cannon_kona_prestate: Cannon Kona prestate hash
#
# V2 upgrades (opcm_version = 2):
#   - name: Human-readable name for logging
#   - opcm_version: 2
#   - opcm_addresses: Map of chain ID to OPCM address
#   - dispute_game_configs: Array of dispute game configurations, each with:
#       - game_type: "CANNON", "PERMISSIONED_CANNON", "CANNON_KONA", etc.
#       - enabled: true/false
#       - prestate: Prestate hash for this game type
#       - init_bond: (optional) Initial bond in wei, falls back to factory value
#       - proposer: (PERMISSIONED only) Proposer address
#       - challenger: (PERMISSIONED only) Challenger address
#   - extra_instructions: (optional) Array of {key, data/data_hex} pairs

