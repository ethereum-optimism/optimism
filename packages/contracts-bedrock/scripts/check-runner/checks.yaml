# Check Runner Configuration
#
# Each check has:
#   - name: Unique identifier for the check
#   - description: Human-readable description
#   - command: Shell command to run
#   - build: Build type required (none, source, dev). Default: none
#   - depends: (optional) List of check names that must complete before this check runs
#
# Checks are grouped by build type and run in phases:
#   1. All "none" checks run in parallel (respecting dependencies)
#   2. build-source runs, then all "source" checks run in parallel
#   3. build-dev runs, then all "dev" checks run in parallel
#
# Within each phase, checks respect their dependency ordering.
# Artifacts are saved before builds and restored after all checks complete.

checks:
  # Lint-fix runs first (other checks that need formatted code depend on this)
  - name: lint-fix
    description: Fix code formatting
    command: forge fmt || true
    build: none

  # No build required - run in parallel after lint-fix
  - name: semgrep-test-validity
    description: Check semgrep tests are valid
    command: forge fmt ../../.semgrep/tests/sol-rules.t.sol --check
    build: none
    depends:
      - lint-fix

  - name: semgrep
    description: Run semgrep security linter
    command: cd ../../ && semgrep scan --config .semgrep/rules/ ./packages/contracts-bedrock
    build: none
    depends:
      - lint-fix

  - name: lint
    description: Check code formatting
    command: forge fmt --check
    build: none
    depends:
      - lint-fix

  - name: deploy-configs
    description: Validate deploy configurations
    command: ./scripts/checks/check-deploy-configs.sh
    build: none

  # Requires build-source (production source contracts only)
  # All source checks implicitly depend on lint-fix via build phase ordering
  - name: snapshots
    description: Check snapshots are up to date
    command: go run ./scripts/autogen/generate-snapshots . && go run scripts/autogen/generate-semver-lock/main.go
    build: source

  # semver-diff must run after snapshots because it checks if semver changed when lock changed
  - name: semver-diff
    description: Check semver changes match lock changes
    command: ./scripts/checks/check-semver-diff.sh
    build: source
    depends:
      - snapshots

  - name: unused-imports
    description: Check for unused imports
    command: go run ./scripts/checks/unused-imports
    build: source

  - name: strict-pragma
    description: Check strict pragma versions
    command: go run ./scripts/checks/strict-pragma
    build: source

  - name: valid-semver
    description: Check valid semver versions
    command: go run ./scripts/checks/valid-semver-check/main.go
    build: source

  - name: spacers
    description: Validate storage spacers
    command: go run ./scripts/checks/spacers
    build: source

  - name: reinitializers
    description: Check reinitializer modifiers
    command: go run ./scripts/checks/reinitializer
    build: source

  - name: interfaces
    description: Check interface correctness
    command: go run ./scripts/checks/interfaces
    build: source

  # Requires build-dev (needs test artifacts)
  - name: forge-test-names
    description: Validate forge test conventions
    command: go run ./scripts/checks/test-validation
    build: dev
