# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: op-deployer

before:
  hooks:
    - go mod tidy

builds:
  - id: main
    main: ./cmd/op-deployer
    binary: op-deployer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -X github.com/ethereum-optimism/optimism/op-deployer/pkg/deployer/version.GitCommit={{ .FullCommit }}
      - -X github.com/ethereum-optimism/optimism/op-deployer/pkg/deployer/version.GitDate={{ .CommitDate }}
      - -X github.com/ethereum-optimism/optimism/op-deployer/pkg/deployer/version.Version={{ .Version }}
      - -X github.com/ethereum-optimism/optimism/op-deployer/pkg/deployer/version.Meta=

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: "{{ .ProjectName }}-{{.Version}}-{{ tolower .Os }}-{{ .Arch }}"
    # use zip for windows archives
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        format: zip
    # op-deployer runs the Rust op-script-engine for all deployment scripts; the in-process Go host
    # and its --script-engine=go fallback are gone, so a release archive without the engine is
    # non-functional — bundling it here is required, not just a convenience. EngineBinary resolves an
    # op-script-engine sitting next to the op-deployer binary, so bundling it in each archive makes a
    # release work with zero configuration — exactly like the Docker image. goreleaser does not build
    # Rust, so the release pipeline must first
    # cross-compile op-script-engine for each release platform (linux/darwin/windows x amd64/arm64)
    # and stage the per-platform binaries, then uncomment a files: entry that copies the matching one
    # in as "op-script-engine". Example:
    #   files:
    #     - src: "dist/op-script-engine-{{ .Os }}-{{ .Arch }}"
    #       dst: op-script-engine
    # NOTE: Rust cross-compilation for darwin/windows from a Linux runner needs osxcross/mingw; the
    # Docker image (linux only) is already handled inline in ops/docker/op-stack-go/Dockerfile.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: ethereum-optimism
    name: optimism
  make_latest: false

monorepo:
  tag_prefix: op-deployer/
  dir: op-deployer
