version: 2.1

# Rust E2E CI Continuation Configuration
# This file contains E2E tests that depend on both kona and op-reth.
# It is merged with main.yml and rust-ci.yml when rust/** changes are detected.
# Shared orbs, commands, and jobs come from main.yml and rust-ci.yml during merge.
orbs:
  utils: ethereum-optimism/circleci-utils@1.0.27

parameters:
  c-default_docker_image:
    type: string
    default: cimg/base:2026.03
  c-rust_base_image:
    type: string
    default: us-docker.pkg.dev/oplabs-tools-artifacts/images/ci-base-clang@sha256:873a6709dd48d7706b0baee139300f18ab7babf4a66f982b2383fe51ce2e5489
  c-go-cache-version:
    type: string
    default: "v0.1"
  # Workflow activation flags (set by compute-workflow-conditions.sh)
  c-run_rust_e2e_ci:
    type: boolean
    default: false
  c-run_rust_e2e_gate_skip:
    type: boolean
    default: false

# ============================================================================
# RUST E2E JOBS
# ============================================================================
jobs:
  # Kona Node E2E Sysgo Tests (requires both kona and op-reth)
  rust-e2e-sysgo-tests:
    parameters:
      devnet_config:
        description: The devnet configuration to test
        type: string
      reorg_tests:
        description: Whether to run reorg tests
        type: boolean
        default: false
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-ci
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Run common tests for node with sysgo orchestrator
          no_output_timeout: 60m
          command: |
            WD=$(pwd)
            echo "Running tests..."
            export OP_RETH_EXEC_PATH="$WD/rust/target/release/op-reth"
            export RUST_BINARY_PATH_KONA_NODE="$WD/rust/target/release/kona-node"
            cd rust/kona && just test-e2e-sysgo-run node node/common "<<parameters.devnet_config>>"
      - when:
          condition:
            equal: [true, <<parameters.reorg_tests>>]
          steps:
            - run:
                name: Run reorg tests for node with sysgo orchestrator
                no_output_timeout: 60m
                command: |
                  WD=$(pwd)
                  echo "Running tests..."
                  export OP_RETH_EXEC_PATH="$WD/rust/target/release/op-reth"
                  export RUST_BINARY_PATH_KONA_NODE="$WD/rust/target/release/kona-node"
                  cd rust/kona && just test-e2e-sysgo-run node node/reorgs "<<parameters.devnet_config>>"
      - go-save-cache:
          namespace: kona-ci
      - store_test_results:
          path: rust/kona/tests/tmp/test-results
      - store_artifacts:
          path: rust/kona/tests/tmp/testlogs
          when: always

  # Kona Node Restart Tests (from node_e2e_sysgo_tests.yaml)
  rust-restart-sysgo-tests:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-ci
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Run restart tests for node with sysgo orchestrator
          no_output_timeout: 60m
          command: |
            echo "Running tests..."
            WD=$(pwd)
            export RUST_BINARY_PATH_KONA_NODE="$WD/rust/target/release/kona-node"
            cd rust/kona && just test-e2e-sysgo node node/restart
      - go-save-cache:
          namespace: kona-ci
      - store_test_results:
          path: rust/kona/tests/tmp/test-results
      - store_artifacts:
          path: rust/kona/tests/tmp/testlogs
          when: always

  # op-reth E2E Sysgo Tests
  op-reth-e2e-sysgo-tests:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: op-reth-e2e
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Run op-reth E2E tests with sysgo orchestrator
          working_directory: rust/op-reth/tests
          no_output_timeout: 60m
          command: |
            export OP_RETH_EXEC_PATH="$(pwd)/../../target/release/op-reth"
            just test-e2e-sysgo
      - go-save-cache:
          namespace: op-reth-e2e
      - store_test_results:
          path: rust/op-reth/tests/tmp/test-results
      - store_artifacts:
          path: rust/op-reth/tests/tmp/testlogs
          when: always

  # Kona Proof Action Tests (from proof.yaml)
  kona-proof-action-tests:
    parameters:
      kind:
        description: The kind of action test (single or interop)
        type: string
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    parallelism: 4
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-ci
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Build kona and run action tests
          working_directory: rust/kona
          no_output_timeout: 90m
          command: |
            echo "Running action tests"
            export KONA_HOST_PATH=$(pwd)/../target/release/kona-host
            just action-tests-<<parameters.kind>>-run
      - go-save-cache:
          namespace: kona-ci
      - store_test_results:
          path: rust/kona/tests/proofs/tmp/test-results
      - store_artifacts:
          path: rust/kona/tests/proofs/tmp/testlogs
          when: always

  # Build SP1 guest ELFs and persist them for future rust-e2e consumers.
  kona-build-sp1-elfs:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: large.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - rust-prepare-and-restore-cache:
          directory: rust/kona/sp1/programs
          init_superchain_submodule: false
      - restore_cache:
          name: Restore SP1 toolchain cache
          keys:
            # cargo-prove selects the matching native toolchain. An SP1 pin
            # update changes this checksum and forces a fresh installation.
            - sp1-toolchain-v1-{{ arch }}-{{ checksum "mise.toml" }}
      - run:
          name: Install or link SP1 toolchain
          command: |
            install_sp1_toolchain() {
              (cd rust/kona/sp1 && just install-sp1-toolchain)
            }

            mise_sp1_version="$(yq -r '.tools."github:succinctlabs/sp1".version' mise.toml)"
            guest_sp1_version="$(yq -r '.workspace.dependencies."sp1-zkvm".version' rust/kona/sp1/programs/Cargo.toml)"
            sp1_tag="$(cd rust/kona/sp1 && just --evaluate SP1_TAG)"
            if [ "$mise_sp1_version" != "$guest_sp1_version" ] || [ "$sp1_tag" != "v${mise_sp1_version}" ]; then
              echo "ERROR: SP1 versions in mise.toml, programs/Cargo.toml, and the justfile are out of sync" >&2
              exit 1
            fi

            toolchain_dir="$(find "$HOME/.sp1/toolchains" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
            if [ -n "$toolchain_dir" ]; then
              rustup toolchain remove succinct || true
              if rustup toolchain link succinct "$toolchain_dir" && rustc +succinct --version >/dev/null; then
                echo "Restored SP1 toolchain from $toolchain_dir"
              else
                echo "Cached SP1 toolchain is invalid; reinstalling"
                install_sp1_toolchain
              fi
            else
              install_sp1_toolchain
            fi
            rustc +succinct --version
      - save_cache:
          name: Save SP1 toolchain cache
          key: sp1-toolchain-v1-{{ arch }}-{{ checksum "mise.toml" }}
          paths:
            - ~/.sp1/toolchains
      - run:
          name: Build SP1 guest ELFs
          working_directory: rust/kona/sp1
          no_output_timeout: 40m
          command: just build-elfs-native
      - rust-sccache-stats
      - store_artifacts:
          path: rust/kona/sp1/elf
      - persist_to_workspace:
          root: .
          paths:
            - rust/kona/sp1/elf/

  required-rust-e2e:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    parameters:
      always-succeed:
        description: Force always succeed (skip API gate)
        type: boolean
        default: false
    steps:
      - utils/ci-gate:
          always-succeed: << parameters.always-succeed >>

# ============================================================================
# RUST E2E WORKFLOWS
# ============================================================================
workflows:
  # Rust E2E CI — runs on rust path changes or manual dispatch
  rust-e2e-ci:
    when: << pipeline.parameters.c-run_rust_e2e_ci >>
    jobs:
      - contracts-bedrock-build:
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate: &rust-e2e-job-base
          context:
            - circleci-repo-readonly-authenticated-github-token
      # rust-workspace-release builds the whole rust workspace (no binary filter),
      # so it produces kona-host, kona-node, op-reth, and the rest. Downstream
      # e2e jobs attach the workspace and consume the binaries directly.
      - rust-build-binary: &rust-workspace-release
          name: rust-workspace-release
          directory: rust
          profile: release
          persist_to_workspace: true
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - rust-e2e-sysgo-tests:
          name: rust-e2e-<<matrix.devnet_config>>
          matrix:
            parameters:
              devnet_config:
                ["simple-kona", "simple-kona-sequencer"]
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-workspace-release
      - op-reth-e2e-sysgo-tests:
          <<: *rust-e2e-job-base
          requires:
            - contracts-bedrock-build
            - rust-workspace-release
      - rust-restart-sysgo-tests:
          name: rust-e2e-restart
          <<: *rust-e2e-job-base
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-workspace-release
      # Proof action tests - single-chain only. Interop proof coverage runs
      # under kona-host in op-acceptance-tests, not as action tests.
      - kona-proof-action-tests:
          name: kona-proof-action-single
          kind: single
          requires:
            - rust-workspace-release
            - contracts-bedrock-build
          context:
            - circleci-repo-readonly-authenticated-github-token
      - kona-build-sp1-elfs:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      # -----------------------------------------------------------------------
      # Required gate — fans in on all E2E test jobs
      # -----------------------------------------------------------------------
      - required-rust-e2e:
          requires:
            - rust-e2e-simple-kona: terminal
            - rust-e2e-simple-kona-sequencer: terminal
            - rust-e2e-restart: terminal
            - op-reth-e2e-sysgo-tests: terminal
            - kona-proof-action-single: terminal
            - kona-build-sp1-elfs: terminal
          context:
            - circleci-api-token
  rust-e2e-gate-skip:
    when: << pipeline.parameters.c-run_rust_e2e_gate_skip >>
    jobs:
      - required-rust-e2e:
          always-succeed: true
          context:
            - circleci-api-token
