version: 2.1

# Rust E2E CI Continuation Configuration
# This file contains E2E tests that depend on both kona and op-reth.
# It is merged with main.yml and rust-ci.yml when rust/** changes are detected.
# Shared orbs, commands, and jobs come from main.yml and rust-ci.yml during merge.
orbs:
  utils: ethereum-optimism/circleci-utils@1.0.32

parameters:
  c-default_docker_image:
    type: string
    default: cimg/base:2026.03
  c-rust_base_image:
    type: string
    default: us-docker.pkg.dev/oplabs-tools-artifacts/images/nexus/circleci-runner-wolfi@sha256:f79d7c422cf320f67bbd9dbe3f36ed2755bf800d7065e4fbb63a034c3ff56914
  c-go-cache-version:
    type: string
    default: "v0.1"
  # Workflow activation flags (set by compute-workflow-conditions.sh)
  c-run_rust_e2e_ci:
    type: boolean
    default: false
  c-run_rust_e2e_gate_skip:
    type: boolean
    default: false
  c-run_scheduled_sp1_elf_smoke:
    type: boolean
    default: false

# ============================================================================
# RUST E2E JOBS
# ============================================================================
jobs:
  # Kona Node E2E Sysgo Tests (requires both kona and op-reth)
  rust-e2e-sysgo-tests:
    parameters:
      devnet_config:
        description: The devnet configuration to test
        type: string
      reorg_tests:
        description: Whether to run reorg tests
        type: boolean
        default: false
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-ci
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Run common tests for node with sysgo orchestrator
          no_output_timeout: 60m
          command: |
            WD=$(pwd)
            echo "Running tests..."
            export RUST_BINARY_PATH_OP_RETH="$WD/rust/target/release/op-reth"
            export RUST_BINARY_PATH_KONA_NODE="$WD/rust/target/release/kona-node"
            bash ops/ci/runtime/rust-e2e.sh circle "<<parameters.devnet_config>>"
      - when:
          condition:
            equal: [true, <<parameters.reorg_tests>>]
          steps:
            - run:
                name: Run reorg tests for node with sysgo orchestrator
                no_output_timeout: 60m
                command: |
                  WD=$(pwd)
                  echo "Running tests..."
                  export RUST_BINARY_PATH_OP_RETH="$WD/rust/target/release/op-reth"
                  export RUST_BINARY_PATH_KONA_NODE="$WD/rust/target/release/kona-node"
                  cd rust/kona && just test-e2e-sysgo-run node node/reorgs "<<parameters.devnet_config>>"
      - go-save-cache:
          namespace: kona-ci
      - store_test_results:
          path: .ci/rust-e2e/reports
      - store_artifacts:
          path: .ci/rust-e2e
          when: always
      - when:
          condition: <<parameters.reorg_tests>>
          steps:
            - store_test_results:
                path: rust/kona/tests/tmp/test-results
            - store_artifacts:
                path: rust/kona/tests/tmp/testlogs
                when: always

  # Kona Node Restart Tests (from node_e2e_sysgo_tests.yaml)
  rust-restart-sysgo-tests:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    # One test per node via the timing split in test-e2e-sysgo-run.
    parallelism: 3
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-ci
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Run restart tests for node with sysgo orchestrator
          no_output_timeout: 60m
          # test-e2e-sysgo-run skips build-kona/build-reth; the binaries come
          # prebuilt from the attached workspace via the RUST_BINARY_PATH_*
          # exports.
          command: |
            echo "Running tests..."
            WD=$(pwd)
            export RUST_BINARY_PATH_OP_RETH="$WD/rust/target/release/op-reth"
            export RUST_BINARY_PATH_KONA_NODE="$WD/rust/target/release/kona-node"
            bash ops/ci/runtime/rust-e2e.sh circle restart
      - go-save-cache:
          namespace: kona-ci
      - store_test_results:
          path: .ci/rust-e2e/reports
      - store_artifacts:
          path: .ci/rust-e2e
          when: always

  # op-reth E2E Sysgo Tests
  op-reth-e2e-sysgo-tests:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: op-reth-e2e
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Run op-reth E2E tests with sysgo orchestrator
          working_directory: rust/op-reth/tests
          no_output_timeout: 60m
          command: |
            export RUST_BINARY_PATH_OP_RETH="$(pwd)/../../target/release/op-reth"
            bash ../../../ops/ci/runtime/rust-e2e.sh circle op-reth
      - go-save-cache:
          namespace: op-reth-e2e
      - store_test_results:
          path: .ci/rust-e2e/reports
      - store_artifacts:
          path: .ci/rust-e2e
          when: always

  # Kona Proof Action Tests (from proof.yaml)
  kona-proof-action-tests:
    parameters:
      kind:
        description: The kind of action test (single or interop)
        type: string
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: xlarge.gen2
    # ~35 action tests, timing-split across nodes (see action-tests-single-run).
    # 8 nodes roughly halves per-node test time vs 4.
    parallelism: 8
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-ci
      # Build the superchain-configs.zip these Go tests //go:embed (workspace carries only Rust binaries).
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Build kona and run action tests
          working_directory: rust/kona
          no_output_timeout: 90m
          command: |
            echo "Running action tests"
            export KONA_HOST_PATH=$(pwd)/../target/release/kona-host
            if [[ "<<parameters.kind>>" != single ]]; then echo "Unsupported shared proof kind" >&2; exit 1; fi
            bash ../../ops/ci/runtime/rust-e2e.sh circle proof
      - go-save-cache:
          namespace: kona-ci
      - store_test_results:
          path: .ci/rust-e2e/reports
      - store_artifacts:
          path: .ci/rust-e2e
          when: always

  # Build SP1 guest ELFs and persist them for future rust-e2e consumers.
  kona-build-sp1-elfs:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    resource_class: large.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - rust-prepare-and-restore-cache: &sp1-guest-checks-cache-args
          directory: rust/kona/sp1/programs
          init_superchain_submodule: false
      - restore_cache:
          name: Restore SP1 toolchain cache
          keys:
            # cargo-prove selects the matching native toolchain. An SP1 pin
            # update changes this checksum and forces a fresh installation.
            - sp1-toolchain-v1-{{ arch }}-{{ checksum "mise.toml" }}
      - run:
          name: Install or link SP1 toolchain with original pin checks and evidence
          command: python3 ops/ci/runtime/sp1-guest.py --provider circleci --phase toolchain
      - save_cache:
          name: Save SP1 toolchain cache
          key: sp1-toolchain-v1-{{ arch }}-{{ checksum "mise.toml" }}
          paths:
            - ~/.sp1/toolchains
      - run:
          name: Build SP1 guest ELFs with complete original artifact evidence
          no_output_timeout: 40m
          command: python3 ops/ci/runtime/sp1-guest.py --provider circleci --phase build
      - store_artifacts:
          path: rust/kona/sp1/elf
      - persist_to_workspace:
          root: .
          paths:
            - rust/kona/sp1/elf/
      - run:
          name: Run all original SP1 guest, lint and range-vkeys checks freshly
          no_output_timeout: 40m
          command: python3 ops/ci/runtime/sp1-guest.py --provider circleci --phase checks
      - store_test_results:
          path: .ci/sp1-guest/run
      - store_artifacts:
          path: .ci/sp1-guest
          when: always
      - rust-save-build-cache: *sp1-guest-checks-cache-args

  sp1-super-range-elf-smoke:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    # Full SP1 ELF execution peaked near 13 GiB locally. Keep it isolated on a
    # 32 GB runner instead of competing with parallel acceptance tests.
    resource_class: 2xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - rust-prepare-and-restore-cache:
          directory: rust
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: sp1-super-range-elf-smoke
      - run:
          name: Test proposer aggregation vkey against built ELF
          working_directory: rust
          command: |
            KONA_SP1_ELF_DIR="$PWD/kona/sp1/elf" \
              cargo nextest run --package op-zk-proposer \
              real_elf_agg_vkey_matches_vkeys_toml_prestate
      - run:
          name: Run SP1 super-root ELF acceptance
          no_output_timeout: 30m
          command: |
            ROOT_DIR="$(pwd)"
            RESULTS_DIR="$ROOT_DIR/tmp/test-results"
            LOG_DIR="$ROOT_DIR/tmp/testlogs/sp1-super-range-elf"
            mkdir -p "$RESULTS_DIR" "$LOG_DIR"

            export DEVSTACK_L2CL_KIND=op-node
            export DEVSTACK_L2EL_KIND=op-reth
            export RUST_BINARY_PATH_OP_RETH="$ROOT_DIR/rust/target/release/op-reth"
            export RUST_BINARY_PATH_KONA_HOST="$ROOT_DIR/rust/target/release/kona-host"
            export RUST_BINARY_PATH_OP_ZK_PROPOSER="$ROOT_DIR/rust/target/release/op-zk-proposer"
            export KONA_SP1_SUPER_RANGE_ELF_EXECUTOR_PATH="$ROOT_DIR/rust/target/release/kona-sp1-super-range-executor"
            export KONA_SP1_ELF_DIR="$ROOT_DIR/rust/kona/sp1/elf"

            test -x "$RUST_BINARY_PATH_OP_RETH"
            test -x "$RUST_BINARY_PATH_KONA_HOST"
            test -x "$RUST_BINARY_PATH_OP_ZK_PROPOSER"
            test -x "$KONA_SP1_SUPER_RANGE_ELF_EXECUTOR_PATH"
            test -x "$ROOT_DIR/cannon/bin/cannon"
            test -s "$ROOT_DIR/rust/kona/prestate-artifacts-cannon-interop/prestate.bin.gz"
            test -s "$KONA_SP1_ELF_DIR/super-range-elf"
            test -s "$KONA_SP1_ELF_DIR/super-aggregation-elf"
            test -s "$KONA_SP1_ELF_DIR/vkeys.toml"

            gotestsum \
              --format=testname \
              --junitfile="$RESULTS_DIR/sp1-super-range-elf.xml" \
              --jsonfile="$LOG_DIR/go-test.json" \
              -- \
              -count=1 \
              -parallel=1 \
              -timeout=60m \
              ./op-acceptance-tests/tests/interop/proofs/sp1

            # List to a file first: grep -q closing the pipe early would SIGPIPE go test under pipefail.
            go test -list '^TestDeploymentUsesSuperAggregationVKey$' \
              ./op-acceptance-tests/tests/proofs/zk > "$LOG_DIR/vkey-test-list.txt"
            grep -Fxq TestDeploymentUsesSuperAggregationVKey "$LOG_DIR/vkey-test-list.txt"
            go test \
              -count=1 \
              -timeout=30m \
              -run '^TestDeploymentUsesSuperAggregationVKey$' \
              ./op-acceptance-tests/tests/proofs/zk
      - go-save-cache:
          namespace: sp1-super-range-elf-smoke
      - store_test_results:
          path: tmp/test-results
      - store_artifacts:
          path: tmp/testlogs/sp1-super-range-elf
          when: always
      - notify-failures-on-develop:
          mentions: "@proofs-team"

  # SP1 execute action tests (rust/kona/tests/proofs, TestSP1*). They skip without
  # KONA_SP1_SUPER_RANGE_ELF_EXECUTOR_PATH, which kona-proof-action-tests does not set, so this
  # is their only CI coverage, including the invalid-claim (soundness) path.
  kona-sp1-action-tests:
    docker:
      - image: <<pipeline.parameters.c-rust_base_image>>
    # Runs the SP1 ELF in the emulator like sp1-super-range-elf-smoke, so it gets the same
    # 32 GB runner.
    resource_class: 2xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: .
      - go-restore-cache:
          namespace: kona-sp1-action-tests
      - run:
          name: Run SP1 execute action tests
          no_output_timeout: 30m
          command: |
            ROOT_DIR="$(pwd)"
            export KONA_SP1_SUPER_RANGE_ELF_EXECUTOR_PATH="$ROOT_DIR/rust/target/release/kona-sp1-super-range-executor"
            export KONA_SP1_ELF_DIR="$ROOT_DIR/rust/kona/sp1/elf"
            test -x "$KONA_SP1_SUPER_RANGE_ELF_EXECUTOR_PATH"
            test -s "$KONA_SP1_ELF_DIR/super-range-elf"

            cd rust/kona/tests/proofs
            mkdir -p tmp/test-results tmp/testlogs
            # Fail rather than pass vacuously if a rename leaves nothing matching the pattern.
            # List to a file first: grep -q closing the pipe early would SIGPIPE go test under pipefail.
            go test -list '^TestSP1' . > tmp/testlogs/test-list.txt
            grep -q '^TestSP1' tmp/testlogs/test-list.txt
            gotestsum \
              --format=testname \
              --junitfile=tmp/test-results/results.xml \
              --jsonfile=tmp/testlogs/log.json \
              -- \
              -count=1 \
              -parallel=1 \
              -timeout=60m \
              -run '^TestSP1' \
              .
      - go-save-cache:
          namespace: kona-sp1-action-tests
      - store_test_results:
          path: rust/kona/tests/proofs/tmp/test-results
      - store_artifacts:
          path: rust/kona/tests/proofs/tmp/testlogs
          when: always
      - notify-failures-on-develop:
          mentions: "@proofs-team"

  required-rust-e2e:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    parameters:
      always-succeed:
        description: Force always succeed (skip API gate)
        type: boolean
        default: false
    steps:
      - utils/ci-gate:
          always-succeed: << parameters.always-succeed >>

# ============================================================================
# RUST E2E WORKFLOWS
# ============================================================================
workflows:
  # Rust E2E CI — runs on rust path changes or manual dispatch
  rust-e2e-ci:
    when: << pipeline.parameters.c-run_rust_e2e_ci >>
    jobs:
      - contracts-bedrock-build:
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate: &rust-e2e-job-base
          context:
            - circleci-repo-readonly-authenticated-github-token
      # rust-workspace-release builds the whole rust workspace (no binary filter),
      # so it produces kona-host, kona-node, op-reth, and the rest. Downstream
      # e2e jobs attach the workspace and consume the binaries directly.
      - rust-build-binary: &rust-workspace-release
          name: rust-workspace-release
          directory: rust
          profile: release
          persist_to_workspace: true
          # Release-build linking OOMs xlarge.gen2.
          resource_class: 2xlarge.gen2
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - rust-e2e-sysgo-tests:
          name: rust-e2e-<<matrix.devnet_config>>
          matrix:
            parameters:
              devnet_config:
                ["simple-kona", "simple-kona-sequencer"]
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-workspace-release
      - op-reth-e2e-sysgo-tests:
          <<: *rust-e2e-job-base
          requires:
            - contracts-bedrock-build
            - rust-workspace-release
      - rust-restart-sysgo-tests:
          name: rust-e2e-restart
          <<: *rust-e2e-job-base
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-workspace-release
      # Proof action tests - single-chain only. Interop proof coverage runs
      # under kona-host in op-acceptance-tests, not as action tests.
      - kona-proof-action-tests:
          name: kona-proof-action-single
          kind: single
          requires:
            - rust-workspace-release
            - contracts-bedrock-build
          context:
            - circleci-repo-readonly-authenticated-github-token
      # No kona-build-sp1-elfs here on purpose: main runs the identical job
      # (same template, no parameters, same contexts) and gates it through
      # ci-gate, and main runs in every case rust-e2e-ci does, so a copy in
      # this workflow is duplicated work.
      # -----------------------------------------------------------------------
      # Required gate — fans in on all E2E test jobs
      # -----------------------------------------------------------------------
      - required-rust-e2e:
          requires:
            # Gated directly, not just through the e2e jobs below: a failed
            # build leaves them unrun rather than failed, and this workflow is
            # now the only place the release build happens.
            - rust-workspace-release: terminal
            - rust-e2e-simple-kona: terminal
            - rust-e2e-simple-kona-sequencer: terminal
            - rust-e2e-restart: terminal
            - op-reth-e2e-sysgo-tests: terminal
            - kona-proof-action-single: terminal
          context:
            - circleci-api-token
  rust-e2e-gate-skip:
    when: << pipeline.parameters.c-run_rust_e2e_gate_skip >>
    jobs:
      - required-rust-e2e:
          always-succeed: true
          context:
            - circleci-api-token

  scheduled-sp1-elf-smoke:
    when: << pipeline.parameters.c-run_scheduled_sp1_elf_smoke >>
    jobs:
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - prep-superchain:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-build:
          build_args: --deny-warnings --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - prep-go-modules
      - rust-build-binary:
          # The workspace release build includes op-reth, kona-host, the SP1
          # proposer, and the super-range executor used by this job.
          name: sp1-elf-smoke-rust-binaries
          directory: rust
          profile: release
          persist_to_workspace: true
          # Release-build linking OOMs xlarge.gen2.
          resource_class: 2xlarge.gen2
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - kona-build-sp1-elfs:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - cannon-prestate:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - go-binaries-for-sysgo:
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
      - sp1-super-range-elf-smoke:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
            - slack
          requires:
            - prep-go-modules
            - prep-superchain
            - contracts-bedrock-build
            - sp1-elf-smoke-rust-binaries
            - kona-build-sp1-elfs
            - cannon-prestate
            - go-binaries-for-sysgo
      - kona-sp1-action-tests:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
          requires:
            - prep-go-modules
            - prep-superchain
            - contracts-bedrock-build
            - sp1-elf-smoke-rust-binaries
            - kona-build-sp1-elfs
