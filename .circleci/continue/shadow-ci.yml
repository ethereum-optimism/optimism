# Shadow CI — dependency-aware pipeline decision engine.
# Runs alongside main CI, makes optimal run/skip decisions for every job category,
# and proves equivalence before replacing the existing CI.
#
# This is a separate workflow so it CANNOT reference jobs from the main workflow
# (CircleCI `requires` only works within the same workflow). Build dependencies
# like contracts and cannon prestates are built inline where needed.

version: 2.1

parameters:
  c-default_docker_image:
    type: string
    default: cimg/base:2026.03
  c-go-cache-version:
    type: string
    default: "v0.0"

orbs:
  utils: ethereum-optimism/circleci-utils@1.0.24

commands:
  build-shadow-ci:
    description: "Build shadow CI binaries"
    steps:
      - run:
          name: Build shadow CI binaries
          command: |
            cd ops/shadow-ci
            mkdir -p bin
            go build -o bin/affected ./cmd/affected
            go build -o bin/planner ./cmd/planner
            go build -o bin/runner ./cmd/runner
            go build -o bin/compare ./cmd/compare
            go build -o bin/aggregate ./cmd/aggregate

  check-decision:
    description: "Check pipeline decision for a category and halt if not needed"
    parameters:
      category:
        type: string
    steps:
      - run:
          name: Check if <<parameters.category>> is needed
          command: |
            DECISION_FILE="/tmp/shadow-ci/decision.json"
            if [ ! -f "$DECISION_FILE" ]; then
              echo "No decision file — running by default"
              exit 0
            fi
            NEEDED=$(python3 -c "
            import json, sys
            d = json.load(open('$DECISION_FILE'))
            cat = d.get('categories', {}).get('<<parameters.category>>', {})
            if cat.get('skipped', False) or not cat.get('needed', False):
                print('SKIP: ' + cat.get('skip_why', 'not needed'))
                sys.exit(1)
            targets = cat.get('targets', [])
            packages = cat.get('packages', [])
            print('RUN: ' + cat.get('reason', ''))
            if targets:
                print('Targets: ' + str(len(targets)))
            if packages:
                print('Packages: ' + ', '.join(packages))
            " 2>&1) || {
              echo "$NEEDED"
              circleci-agent step halt
              exit 0
            }
            echo "$NEEDED"

  shadow-store-results:
    description: "Store shadow CI results and events as artifacts"
    steps:
      - store_artifacts:
          path: /tmp/shadow-ci
          destination: shadow-ci
      - store_test_results:
          path: /tmp/shadow-ci/test-results

jobs:
  # ===========================================================================
  # SETUP: Build binaries, compute affected, produce pipeline decision
  # ===========================================================================
  shadow-ci-setup:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: medium
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - build-shadow-ci
      - run:
          name: Compute affected targets and pipeline decision
          command: |
            mkdir -p /tmp/shadow-ci/events /tmp/shadow-ci/test-results
            ops/shadow-ci/bin/affected \
              --config ops/shadow-ci/config \
              --repo . \
              --base origin/develop \
              --head HEAD \
              --branch "${CIRCLE_BRANCH}" \
              --output /tmp/shadow-ci/affected.json \
              --decision-output /tmp/shadow-ci/decision.json \
              --events-dir /tmp/shadow-ci/events \
              --pipeline-id "${CIRCLE_PIPELINE_ID}"
      - run:
          name: Stage workspace artifacts
          command: |
            mkdir -p /tmp/shadow-ci/bin
            cp ops/shadow-ci/bin/* /tmp/shadow-ci/bin/
      - persist_to_workspace:
          root: /tmp
          paths:
            - shadow-ci/
      - store_artifacts:
          path: /tmp/shadow-ci
          destination: shadow-ci-setup

  # ===========================================================================
  # GO TESTS — dependency-aware package selection
  # ===========================================================================
  shadow-ci-go-tests:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge
    circleci_ip_ranges: true
    parallelism: 4
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: go_tests
      - restore_cache:
          key: go-tests-v2-{{ checksum "go.mod" }}
      - run:
          name: Build contracts for tests
          command: |
            cd packages/contracts-bedrock
            git submodule update --init --recursive --single-branch --force -j 8
            just forge-build
            cd ../../op-deployer
            just copy-contract-artifacts
          environment:
            FOUNDRY_PROFILE: ci
      - run:
          name: Build cannon for tests
          command: make -C cannon cannon elf
      - run:
          name: Run shadow Go tests (affected packages only)
          no_output_timeout: 25m
          command: |
            mkdir -p /tmp/shadow-ci/test-results ./tmp/testlogs

            # Extract affected Go packages from decision.
            AFFECTED_PKGS=$(python3 -c "
            import json
            d = json.load(open('/tmp/shadow-ci/decision.json'))
            targets = d.get('categories', {}).get('go_tests', {}).get('targets', [])
            print(' '.join(targets))
            ")

            if [ -z "$AFFECTED_PKGS" ]; then
              echo "No affected Go packages"
              exit 0
            fi

            # Split across parallel nodes.
            NODE_INDEX=${CIRCLE_NODE_INDEX:-0}
            NODE_TOTAL=${CIRCLE_NODE_TOTAL:-1}
            PARALLEL_PKGS=$(echo "$AFFECTED_PKGS" | tr ' ' '\n' | awk -v idx=$NODE_INDEX -v total=$NODE_TOTAL 'NR % total == idx' | tr '\n' ' ')

            if [ -z "$PARALLEL_PKGS" ]; then
              echo "Node $NODE_INDEX/$NODE_TOTAL has no packages"
              exit 0
            fi

            echo "Shadow CI Go tests — Node $NODE_INDEX/$NODE_TOTAL"
            echo "Running $(echo "$PARALLEL_PKGS" | wc -w) of $(echo "$AFFECTED_PKGS" | wc -w) affected packages"

            export ENABLE_KURTOSIS=true
            export OP_E2E_CANNON_ENABLED="false"
            export OP_E2E_USE_HTTP=true
            export ENABLE_ANVIL=true
            export PARALLEL=$(nproc 2>/dev/null || echo 4)
            export OP_TESTLOG_FILE_LOGGER_OUTDIR=$(realpath ./tmp/testlogs)
            export SEPOLIA_RPC_URL="https://ci-sepolia-l1-archive.optimism.io"
            export MAINNET_RPC_URL="https://ci-mainnet-l1-archive.optimism.io"

            gotestsum --format=testname \
              --junitfile=/tmp/shadow-ci/test-results/go-results-${NODE_INDEX}.xml \
              --jsonfile=./tmp/testlogs/shadow-log-${NODE_INDEX}.json \
              --rerun-fails=3 \
              --rerun-fails-max-failures=50 \
              --packages="$PARALLEL_PKGS" \
              -- -parallel=$PARALLEL -short -timeout=20m -tags="ci" \
            || true  # Shadow mode: capture failures, don't gate.
      - save_cache:
          key: go-tests-v2-{{ checksum "go.mod" }}
          paths:
            - "~/.cache/go-build"
            - "~/go"
      - shadow-store-results

  # ===========================================================================
  # GO FUZZ TESTS — only fuzz affected packages
  # ===========================================================================
  shadow-ci-go-fuzz:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: xlarge
    parameters:
      package:
        type: string
      needs_artifacts:
        type: boolean
        default: false
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - run:
          name: Check if fuzz for <<parameters.package>> is needed
          command: |
            NEEDED=$(python3 -c "
            import json, sys
            d = json.load(open('/tmp/shadow-ci/decision.json'))
            cat = d.get('categories', {}).get('go_fuzz', {})
            packages = cat.get('packages', [])
            if '<<parameters.package>>' not in packages:
                print('SKIP: <<parameters.package>> not in triggered fuzz packages')
                sys.exit(1)
            print('RUN: <<parameters.package>> fuzz triggered')
            " 2>&1) || {
              echo "$NEEDED"
              circleci-agent step halt
              exit 0
            }
            echo "$NEEDED"
      - when:
          condition: <<parameters.needs_artifacts>>
          steps:
            - run:
                name: Build contracts and cannon for fuzz
                command: |
                  cd packages/contracts-bedrock
                  git submodule update --init --recursive --single-branch --force -j 8
                  just forge-build
                  cd ../../op-deployer
                  just copy-contract-artifacts
                  cd ..
                  make -C cannon cannon elf
                environment:
                  FOUNDRY_PROFILE: ci
      - run:
          name: Run fuzz tests for <<parameters.package>>
          no_output_timeout: 10m
          command: |
            mkdir -p /tmp/shadow-ci/test-results
            cd <<parameters.package>>
            gotestsum --format=testname \
              --junitfile=/tmp/shadow-ci/test-results/fuzz-<<parameters.package>>.xml \
              -- -fuzz=. -fuzztime=30s -timeout=5m \
            || true
      - shadow-store-results

  # ===========================================================================
  # SOLIDITY TESTS — feature matrix with dependency-aware file selection
  # ===========================================================================
  shadow-ci-sol-tests:
    circleci_ip_ranges: true
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge
    parameters:
      features:
        type: string
        default: "main"
    steps:
      - utils/checkout-with-mise:
          checkout-method: full
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: sol_tests
      - run:
          name: Install solc compilers
          command: |
            for version in 0.8.15 0.8.19 0.8.25 0.8.28; do
              svm which $version 2>/dev/null || svm install $version
            done
      - run:
          name: Install contract dependencies
          command: git submodule update --init --recursive --single-branch --force -j 8
          working_directory: packages/contracts-bedrock
      - run:
          name: Build go-ffi
          command: just build-go-ffi
          working_directory: packages/contracts-bedrock
      - run:
          name: Set feature env vars
          command: |
            FEATURES="<<parameters.features>>"
            if [ "$FEATURES" = "main" ] || [ -z "$FEATURES" ]; then
              echo "Running with baseline configuration"
            else
              SYSTEM_FEATURES="CUSTOM_GAS_TOKEN"
              IFS=','
              for feature in $FEATURES; do
                feature=$(echo "$feature" | xargs)
                if [ -n "$feature" ]; then
                  if echo "$SYSTEM_FEATURES" | grep -qw "$feature"; then
                    echo "export SYS_FEATURE__${feature}=true" >> $BASH_ENV
                  else
                    echo "export DEV_FEATURE__${feature}=true" >> $BASH_ENV
                  fi
                fi
              done
              unset IFS
            fi
      - run:
          name: Run shadow Solidity tests (<<parameters.features>>)
          no_output_timeout: 30m
          command: |
            mkdir -p /tmp/shadow-ci/test-results

            # Use affected file list for targeted testing.
            AFFECTED=$(python3 -c "
            import json
            d = json.load(open('/tmp/shadow-ci/decision.json'))
            targets = d.get('categories', {}).get('sol_tests', {}).get('targets', [])
            test_files = [t for t in targets if 'test/' in t or '.t.sol' in t]
            if test_files:
                print(','.join(test_files))
            elif targets:
                print(','.join(targets))
            " 2>/dev/null)

            cd packages/contracts-bedrock
            mkdir -p results

            if [ -n "$AFFECTED" ]; then
              MATCH_PATH="./test/{${AFFECTED}}"
              echo "Running affected tests: $MATCH_PATH"
              forge test --match-path "$MATCH_PATH" --junit > results/results.xml 2>&1 || true
            else
              echo "Running all tests (no targeted selection)"
              forge test --junit > results/results.xml 2>&1 || true
            fi

            cp results/results.xml "/tmp/shadow-ci/test-results/sol-<<parameters.features>>-results.xml" 2>/dev/null || true
          environment:
            FOUNDRY_PROFILE: liteci
      - shadow-store-results

  # ===========================================================================
  # SOLIDITY UPGRADE TESTS — fork-based upgrade tests
  # ===========================================================================
  shadow-ci-sol-upgrade:
    circleci_ip_ranges: true
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge
    parameters:
      fork_chain:
        type: string
    steps:
      - utils/checkout-with-mise:
          checkout-method: full
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: sol_upgrade
      - run:
          name: Install solc compilers
          command: |
            for version in 0.8.15 0.8.19 0.8.25 0.8.28; do
              svm which $version 2>/dev/null || svm install $version
            done
      - run:
          name: Install contract dependencies
          command: git submodule update --init --recursive --single-branch --force -j 8
          working_directory: packages/contracts-bedrock
      - run:
          name: Build go-ffi
          command: just build-go-ffi
          working_directory: packages/contracts-bedrock
      - run:
          name: Run upgrade tests (<<parameters.fork_chain>>)
          no_output_timeout: 30m
          command: |
            mkdir -p /tmp/shadow-ci/test-results
            cd packages/contracts-bedrock
            just test-upgrade || true
            cp results/results.xml "/tmp/shadow-ci/test-results/sol-upgrade-<<parameters.fork_chain>>-results.xml" 2>/dev/null || true
          environment:
            FOUNDRY_PROFILE: liteci
            FORK_OP_CHAIN: <<parameters.fork_chain>>
            FORK_BASE_CHAIN: mainnet
            FORK_BASE_RPC_URL: https://ci-mainnet-l1-archive.optimism.io
            FOUNDRY_FUZZ_SEED: "42424242"
            FOUNDRY_FUZZ_RUNS: "1"
      - shadow-store-results

  # ===========================================================================
  # CANNON TESTS
  # ===========================================================================
  shadow-ci-cannon-tests:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: xlarge
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: cannon_tests
      - run:
          name: Build contracts for cannon tests
          command: |
            cd packages/contracts-bedrock
            git submodule update --init --recursive --single-branch --force -j 8
            just forge-build
          environment:
            FOUNDRY_PROFILE: ci
      - run:
          name: Run cannon tests
          no_output_timeout: 15m
          command: |
            mkdir -p /tmp/shadow-ci/test-results
            cd cannon
            gotestsum --format=testname \
              --junitfile=/tmp/shadow-ci/test-results/cannon-results.xml \
              -- -parallel=$(nproc) -timeout=10m \
            || true
      - shadow-store-results

  # ===========================================================================
  # GO LINT
  # ===========================================================================
  shadow-ci-go-lint:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: large
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: go_lint
      - run:
          name: Run Go lint
          command: |
            make lint-go || true  # Shadow mode
      - shadow-store-results

  # ===========================================================================
  # SOLIDITY CHECKS
  # ===========================================================================
  shadow-ci-sol-checks:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge
    steps:
      - utils/checkout-with-mise:
          checkout-method: full
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: sol_checks
      - run:
          name: Install solc compilers
          command: |
            for version in 0.8.15 0.8.19 0.8.25 0.8.28; do
              svm which $version 2>/dev/null || svm install $version
            done
      - run:
          name: Install contract dependencies
          command: git submodule update --init --recursive --single-branch --force -j 8
          working_directory: packages/contracts-bedrock
      - run:
          name: Run Solidity checks
          no_output_timeout: 30m
          command: |
            cd packages/contracts-bedrock
            CHECKS=$(python3 -c "
            import json
            d = json.load(open('/tmp/shadow-ci/decision.json'))
            checks = d.get('categories', {}).get('sol_checks', {}).get('configs', [])
            if checks:
                print(' '.join(checks))
            " 2>/dev/null || echo "lint size-check")

            for check in $checks; do
              echo "=== Running: $check ==="
              git reset --hard
              git clean -df
              just $check || true  # Shadow mode
            done
          environment:
            FOUNDRY_PROFILE: ci
      - shadow-store-results

  # ===========================================================================
  # GENERATED MOCKS CHECK
  # ===========================================================================
  shadow-ci-generated-mocks:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: medium
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: generated_mocks
      - run:
          name: Check generated mocks
          command: |
            make generate-mocks-op-node 2>/dev/null || true
            make generate-mocks-op-service 2>/dev/null || true
            if ! git diff --exit-code; then
              echo "WARNING: Generated mocks are out of date"
            fi

  # ===========================================================================
  # ACCEPTANCE TESTS — sysgo orchestrator
  # ===========================================================================
  shadow-ci-acceptance-tests:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge+
    circleci_ip_ranges: true
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - check-decision:
          category: acceptance_tests
      - run:
          name: Build contracts and cannon prestates
          command: |
            cd packages/contracts-bedrock
            git submodule update --init --recursive --single-branch --force -j 8
            just forge-build
            cd ../../op-deployer
            just copy-contract-artifacts
            cd ..
            make -j reproducible-prestate
          environment:
            FOUNDRY_PROFILE: ci
      - run:
          name: Build kona binaries
          no_output_timeout: 45m
          command: |
            cd rust
            git submodule update --init --recursive --single-branch --force -j 8
            cargo build --release --bin kona-node --bin kona-supervisor
      - run:
          name: Build op-rbuilder submodule
          no_output_timeout: 30m
          command: |
            git submodule update --init --single-branch op-rbuilder
            cd op-rbuilder
            cargo build --release -p op-rbuilder --bin op-rbuilder
            mkdir -p ../.circleci-cache/rust-binaries
            cp target/release/op-rbuilder ../.circleci-cache/rust-binaries/
      - run:
          name: Build rollup-boost submodule
          no_output_timeout: 30m
          command: |
            git submodule update --init --single-branch rollup-boost
            cd rollup-boost
            cargo build --release -p rollup-boost --bin rollup-boost
            cp target/release/rollup-boost ../.circleci-cache/rust-binaries/
      - run:
          name: Configure Rust binary paths
          command: |
            ROOT_DIR="$(pwd)"
            BIN_DIR="$ROOT_DIR/.circleci-cache/rust-binaries"
            echo "export RUST_BINARY_PATH_KONA_NODE=$ROOT_DIR/rust/target/release/kona-node" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_KONA_SUPERVISOR=$ROOT_DIR/rust/target/release/kona-supervisor" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_OP_RBUILDER=$BIN_DIR/op-rbuilder" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_ROLLUP_BOOST=$BIN_DIR/rollup-boost" >> "$BASH_ENV"
      - run:
          name: Run shadow acceptance tests
          no_output_timeout: 120m
          command: |
            mkdir -p /tmp/shadow-ci/test-results
            export GOGC=0
            cd op-acceptance-tests
            go mod download
            LOG_LEVEL=info just acceptance-test "" "" || true  # Shadow mode
            cp results/results.xml /tmp/shadow-ci/test-results/acceptance-results.xml 2>/dev/null || true
      - shadow-store-results

  # ===========================================================================
  # COMPARISON — compare shadow results against main CI
  # ===========================================================================
  shadow-ci-compare:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: medium
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: /tmp
      - run:
          name: Compare shadow vs main CI
          command: |
            mkdir -p /tmp/shadow-ci/comparison

            /tmp/shadow-ci/bin/compare \
              --config ops/shadow-ci/config \
              --pipeline-id "${CIRCLE_PIPELINE_ID}" \
              --shadow-results /tmp/shadow-ci/test-results/ \
              --events-dir /tmp/shadow-ci/events \
              --output /tmp/shadow-ci/comparison/report.json \
            || true

            echo "=== Shadow CI Comparison Report ==="
            cat /tmp/shadow-ci/comparison/report.json | python3 -m json.tool 2>/dev/null \
              || echo "No comparison report (main CI results may not be available yet)"

            echo ""
            echo "=== Pipeline Decision Summary ==="
            python3 -c "
            import json
            d = json.load(open('/tmp/shadow-ci/decision.json'))
            run = [k for k,v in d['categories'].items() if v.get('needed')]
            skip = [k for k,v in d['categories'].items() if v.get('skipped')]
            print(f'Jobs that should RUN ({len(run)}):')
            for j in sorted(run): print(f'  + {j}')
            print(f'Jobs that should SKIP ({len(skip)}):')
            for j in sorted(skip): print(f'  - {j}')
            " 2>/dev/null || true
      - store_artifacts:
          path: /tmp/shadow-ci
          destination: shadow-ci-comparison

workflows:
  shadow-ci:
    when:
      and:
        - equal: ["", << pipeline.git.tag >>]
        - or:
            - equal: ["webhook", << pipeline.trigger_source >>]
            - and:
                - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      # === SETUP ===
      - shadow-ci-setup:
          context:
            - circleci-repo-readonly-authenticated-github-token

      # === GO ===
      - shadow-ci-go-tests:
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token

      - shadow-ci-go-fuzz:
          name: shadow-ci-fuzz-<<matrix.package>>
          package: <<matrix.package>>
          requires:
            - shadow-ci-setup
          matrix:
            parameters:
              package:
                - op-challenger
                - op-node
                - op-service
                - op-chain-ops
          context:
            - circleci-repo-readonly-authenticated-github-token

      # Fuzz packages that need build artifacts (contracts + cannon).
      - shadow-ci-go-fuzz:
          name: shadow-ci-fuzz-<<matrix.package>>
          package: <<matrix.package>>
          needs_artifacts: true
          requires:
            - shadow-ci-setup
          matrix:
            parameters:
              package:
                - cannon
                - op-e2e
          context:
            - circleci-repo-readonly-authenticated-github-token

      - shadow-ci-go-lint:
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token

      - shadow-ci-generated-mocks:
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token

      - shadow-ci-cannon-tests:
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token

      # === SOLIDITY ===
      # Use explicit job entries instead of matrix for multi-feature combos,
      # because commas in matrix values break CircleCI parameter parsing.
      - shadow-ci-sol-tests:
          name: shadow-ci-sol-main
          features: main
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token
      - shadow-ci-sol-tests:
          name: shadow-ci-sol-CUSTOM_GAS_TOKEN
          features: CUSTOM_GAS_TOKEN
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token
      - shadow-ci-sol-tests:
          name: shadow-ci-sol-OPTIMISM_PORTAL_INTEROP
          features: OPTIMISM_PORTAL_INTEROP
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token
      - shadow-ci-sol-tests:
          name: shadow-ci-sol-OPCM_V2
          features: OPCM_V2
          requires:
            - shadow-ci-setup
          context:
            - circleci-repo-readonly-authenticated-github-token
      - shadow-ci-sol-tests:
