# Shadow CI — dynamic pipeline generation.
# This is a thin shell. All intelligence lives in ops/shadow-ci/.
# DO NOT add jobs here — they are generated dynamically by the decision engine.
#
# How it works:
# 1. shadow-ci-setup builds the decision engine and runs it
# 2. The engine computes affected targets, evaluates all job categories,
#    applies stage-based placement, and generates continuation YAML
# 3. CircleCI's continuation API receives the generated YAML and runs it
#
# State persistence:
# State (flake DB, correlation matrix) is persisted via Upstash Redis.
# Env vars UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN are
# provided by the shadow-ci-test-context CircleCI context.

version: 2.1

parameters:
  c-default_docker_image:
    type: string
    default: cimg/base:2026.03
  c-go-cache-version:
    type: string
    default: "v0.0"

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  shadow-ci-setup:
    docker:
      - image: << pipeline.parameters.c-default_docker_image >>
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Go
          command: |
            curl -sSL https://go.dev/dl/go1.23.6.linux-amd64.tar.gz | sudo tar -C /usr/local -xzf -
            echo 'export PATH=$PATH:/usr/local/go/bin' >> $BASH_ENV
      - run:
          name: Build shadow CI binaries
          command: |
            cd ops/shadow-ci
            mkdir -p bin
            go build -o bin/affected ./cmd/affected
            go build -o bin/flake-reactor ./cmd/flake-reactor
            go build -o bin/runner ./cmd/runner
            go build -o bin/compare ./cmd/compare
            go build -o bin/aggregate ./cmd/aggregate
            go build -o bin/validate ./cmd/validate
            go build -o bin/optimize ./cmd/optimize
            go build -o bin/auto-revert ./cmd/auto-revert
      - run:
          name: Update flake state
          command: |
            # Flake reactor loads state from the configured backend
            # (circleci artifacts by default), processes recent events,
            # and saves updated state back.
            ops/shadow-ci/bin/flake-reactor \
              --config ops/shadow-ci/config \
              --events-dir /tmp/shadow-ci/events \
              --branch "$CIRCLE_BRANCH"
      - run:
          name: Generate pipeline
          command: |
            # The decision engine loads flake DB from the state store,
            # computes affected targets, applies stage placement, and
            # renders continuation YAML.
            ops/shadow-ci/bin/affected \
              --config ops/shadow-ci/config \
              --repo . \
              --branch "$CIRCLE_BRANCH" \
              --continue \
              --continuation-output /tmp/shadow-ci-continuation.yml \
              --events-dir /tmp/shadow-ci/events \
              --pipeline-id "$CIRCLE_PIPELINE_ID"
      - store_artifacts:
          path: /tmp/shadow-ci/artifacts
          destination: shadow-ci-state
      - continuation/continue:
          configuration_path: /tmp/shadow-ci-continuation.yml

workflows:
  shadow-ci:
    jobs:
      - shadow-ci-setup:
          context:
            - shadow-ci-test-context
