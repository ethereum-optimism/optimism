                cp -r /tmp/shadow-ci-workspace/cargo $HOME/.cargo
              fi
              # Add mise shims, cargo bin, and all installed tool bin dirs to PATH
              MISE_PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.cargo/bin"
