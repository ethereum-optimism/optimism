# Shadow CI — adaptive test placement engine.
# All intelligence lives in ops/shadow-ci/.
#
# This config is included via path-filtering continuation from config.yml.
# Since it's already a continued pipeline, it cannot use a second continuation.
#
# Jobs:
#   shadow-ci-setup   — Build engine, compute pipeline decision, persist state
#   shadow-ci-verify  — Validate decision coherence against mainline CI
#   shadow-ci-tests   — Run shadow CI's own Go test suite
#
# State persistence:
# State (flake DB, correlation matrix) is persisted via Upstash Redis.
# Env vars UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN are
# provided by the shadow-ci-test-context CircleCI context.

version: 2.1

parameters:
  c-default_docker_image:
    type: string
    default: cimg/base:2026.03
  c-go-cache-version:
    type: string
    default: "v0.0"

jobs:
  shadow-ci-setup:
    docker:
      - image: << pipeline.parameters.c-default_docker_image >>
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Go
          command: |
            curl -sSL https://go.dev/dl/go1.23.6.linux-amd64.tar.gz | sudo tar -C /usr/local -xzf -
            echo 'export PATH=$PATH:/usr/local/go/bin' >> $BASH_ENV
      - run:
          name: Build shadow CI binaries
          command: |
            cd ops/shadow-ci
            mkdir -p bin
            go build -o bin/affected ./cmd/affected
            go build -o bin/flake-reactor ./cmd/flake-reactor
            go build -o bin/runner ./cmd/runner
            go build -o bin/compare ./cmd/compare
            go build -o bin/aggregate ./cmd/aggregate
            go build -o bin/validate ./cmd/validate
            go build -o bin/optimize ./cmd/optimize
            go build -o bin/auto-revert ./cmd/auto-revert
            go build -o bin/coherence ./cmd/coherence
      - run:
          name: Update flake state
          command: |
            ops/shadow-ci/bin/flake-reactor \
              --config ops/shadow-ci/config \
              --events-dir /tmp/shadow-ci/events \
              --branch "$CIRCLE_BRANCH"
      - run:
          name: Compute pipeline decision
          command: |
            ops/shadow-ci/bin/affected \
              --config ops/shadow-ci/config \
              --repo . \
              --branch "$CIRCLE_BRANCH" \
              --events-dir /tmp/shadow-ci/events \
              --pipeline-id "$CIRCLE_PIPELINE_ID"
      - run:
          name: Stage artifacts for workspace
          command: |
            mkdir -p /tmp/shadow-ci-workspace
            cp -r ops/shadow-ci/bin /tmp/shadow-ci-workspace/bin
            cp /tmp/shadow-ci/decision.json /tmp/shadow-ci-workspace/decision.json
            cp /tmp/shadow-ci/affected.json /tmp/shadow-ci-workspace/affected.json
      - persist_to_workspace:
          root: /tmp/shadow-ci-workspace
          paths:
            - bin
            - decision.json
            - affected.json
      - store_artifacts:
          path: /tmp/shadow-ci/decision.json
          destination: shadow-ci/decision.json
      - store_artifacts:
          path: /tmp/shadow-ci/affected.json
          destination: shadow-ci/affected.json

  shadow-ci-verify:
    docker:
      - image: << pipeline.parameters.c-default_docker_image >>
    resource_class: medium
    steps:
      - attach_workspace:
          at: /tmp/shadow-ci-workspace
      - run:
          name: Verify decision coherence with mainline CI
          command: |
            /tmp/shadow-ci-workspace/bin/coherence \
              --decision /tmp/shadow-ci-workspace/decision.json
      - store_artifacts:
          path: /tmp/shadow-ci-workspace/decision.json
          destination: shadow-ci/decision.json

  shadow-ci-tests:
    docker:
      - image: << pipeline.parameters.c-default_docker_image >>
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Go
          command: |
            curl -sSL https://go.dev/dl/go1.23.6.linux-amd64.tar.gz | sudo tar -C /usr/local -xzf -
            echo 'export PATH=$PATH:/usr/local/go/bin' >> $BASH_ENV
      - run:
          name: Run shadow CI test suite
          command: |
            cd ops/shadow-ci
            go test -v -count=1 ./...
      - store_test_results:
          path: /tmp/shadow-ci-test-results

workflows:
  shadow-ci:
    jobs:
      - shadow-ci-setup:
          context:
            - shadow-ci-test-context
      - shadow-ci-verify:
          requires:
            - shadow-ci-setup
      - shadow-ci-tests
