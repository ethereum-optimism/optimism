version: 2.1

# Continuation config for the scheduled rust nightly toolchain bump.
# Merged into the final pipeline by .circleci/scripts/merge-configs.sh.
# Activated by the build_weekly schedule via the decision tree in
# .circleci/config.yml, which sets c-run_scheduled_rust_nightly_bump.
#
# Why: mise.toml pins a nightly toolchain for tools that need unstable
# features (rustfmt options, clippy, cargo-udeps). Left alone the pin drifts
# for months, and the eventual catch-up jump lands many toolchain changes at
# once; a scheduled bump keeps each upgrade small and reviewable, and rust CI
# on the bump PR validates the new toolchain before it merges.

parameters:
  c-run_scheduled_rust_nightly_bump:
    type: boolean
    default: false
  # Setup-pipeline dispatch flag, declared here only so continuation validation
  # accepts it when forwarded; consumed by compute-workflow-conditions.sh.
  rust_nightly_bump_dispatch:
    type: boolean
    default: false

orbs:
  github-cli: circleci/github-cli@2.7.0
  slack: circleci/slack@6.0.0

jobs:
  rust-nightly-bump:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    steps:
      - checkout
      - github-cli/install
      - run:
          name: Open PR if the pinned nightly is outdated
          command: |
            set -euo pipefail
            # The weekly schedule fires just after 00:00 UTC, but a given day's
            # nightly only lands on the dist server around 01:30 UTC that day, so
            # today's date always 404s. Target the previous day.
            TARGET=$(date -u -d yesterday +%Y-%m-%d)
            LATEST="nightly-${TARGET}"
            CURRENT=$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' mise.toml | head -1)

            echo "Target nightly: ${LATEST}"
            echo "Current pin:    ${CURRENT}"

            # Recorded for the Slack success notification so the message can
            # report what the run actually did (opened a PR, or no-op'd).
            record_summary() { printf 'export BUMP_SUMMARY=%q\n' "$1" >> "$BASH_ENV"; }

            if [ "${LATEST}" = "${CURRENT}" ]; then
              echo "Pin is already up to date. Nothing to do."
              record_summary "Pinned nightly already up to date (${CURRENT}); no PR opened."
              exit 0
            fi

            # Nightly is not guaranteed to be published every day (builds can be
            # skipped when broken). Only proceed if the target toolchain actually
            # exists on the dist server, otherwise we would open a PR pinning a
            # nightly that rustup cannot install.
            MANIFEST_URL="https://static.rust-lang.org/dist/${TARGET}/channel-rust-nightly.toml"
            if ! curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused -o /dev/null "${MANIFEST_URL}"; then
              echo "No nightly published for ${TARGET} (${MANIFEST_URL} unavailable). Nothing to do."
              record_summary "No nightly published for ${TARGET}; no PR opened."
              exit 0
            fi

            BRANCH="ci/bump-rust-nightly-${LATEST}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN_GOVERNANCE}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git checkout -b "${BRANCH}"

            sed -i "s/${CURRENT}/${LATEST}/" mise.toml
            git add mise.toml
            git -c user.email=ci@oplabs.co -c user.name="OP Labs CI" commit -m "ci: bump rust nightly pin to ${LATEST}"
            git push origin "${BRANCH}"

            if PR_URL=$(GH_TOKEN="${GITHUB_TOKEN_GOVERNANCE}" gh pr create \
              --title "ci: bump rust nightly pin to ${LATEST}" \
              --body "Automated weekly bump of the pinned nightly Rust toolchain from \`${CURRENT}\` to \`${LATEST}\`. CI on this PR will validate the new toolchain compiles cleanly." \
              --base develop); then
              record_summary "Opened PR to bump nightly ${CURRENT} -> ${LATEST}: ${PR_URL}"
            else
              record_summary "Pushed ${BRANCH} (${CURRENT} -> ${LATEST}) but no PR URL returned; a PR may already exist."
            fi
      - slack/notify:
          event: pass
          branch_pattern: develop
          channel: C03N11M0BBN
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":crab: *Weekly Rust nightly bump* completed on `develop`.\n${BUMP_SUMMARY}"
                  }
                }
              ]
            }
      - notify-failures-on-develop

workflows:
  scheduled-rust-nightly-bump:
    when: << pipeline.parameters.c-run_scheduled_rust_nightly_bump >>
    jobs:
      - rust-nightly-bump:
          context:
            - circleci-repo-optimism
            - slack
