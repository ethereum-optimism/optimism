  # Builds op-core/superchain/superchain-configs.zip from the pinned commit and
  # makes it available to downstream Go-build jobs via persist_to_workspace.
  # The zip itself is gitignored; this is the only job that persists it to the
  # workspace. Jobs that don't attach the workspace (the rust-e2e Go tests,
  # faultproofs, interop-deposits-diff) rebuild it inline via `just build-superchain-go`.
  #
  # Always rebuilds — no cache. The script is fast (depth-1 SR clone + zip
  # ~10s) and most of the job's wall-clock is mise restore anyway. Always
  # rebuilding gives strong consistency (every run validates the committed
  # .sha256 against a freshly-built zip) without cache-key complexity.
  prep-superchain:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: small.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - run:
          # sync-superchain-go runs in refresh mode: it regenerates the bundle AND
          # rewrites the .sha256, so the diff check below is meaningful.
          name: build superchain bundle
          command: just sync-superchain-go
      - run:
          # Catches non-deterministic builds and stale .sha256 commits: if the
          # rebuilt zip differs from what was approved in review, the .sha256
          # file written by sync-superchain.sh will diverge from the committed
          # one and this fails. The init.go runtime check (SHA256 of the embedded
          # zip against the committed .sha256) runs as part of go-tests
          # downstream — no need to repeat it here.
          name: verify rebuilt bundle matches committed .sha256
          command: git diff --exit-code op-core/superchain/superchain-configs.zip.sha256
      - persist_to_workspace:
          root: .
          paths:
            - op-core/superchain/superchain-configs.zip

  # Downloads the Go module set once and saves the shared module cache so the
  # many downstream Go jobs restore it instead of each hitting proxy.golang.org.
  # Downstream jobs require this so the cache is warm within the same pipeline,
  # including the first run after a go.sum change.
  prep-go-modules:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: medium.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - restore-go-mod-cache
      - run:
          name: Download Go modules
          command: |
            # proxy.golang.org intermittently returns transient stream errors
            # (INTERNAL_ERROR). Retry with exponential backoff so a flaky
            # download doesn't fail this shared prep job and everything behind
            # it.
            n=0
            until go mod download; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "go mod download failed after $n attempts" >&2
                exit 1
              fi
              backoff=$((5 * 2 ** (n - 1)))
              echo "go mod download failed (attempt $n); retrying in ${backoff}s..." >&2
              sleep "$backoff"
            done
      - save-go-mod-cache

  check-nut-locks:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: small.gen2
    steps:
      - utils/checkout-with-mise:
