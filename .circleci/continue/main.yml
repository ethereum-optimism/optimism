      mentions:
        description: Slack user or group to mention when notifying of failures
        type: string
        default: ""
      no_output_timeout:
        description: Timeout for when CircleCI kills the job if there's no output
        type: string
        default: 60m
      test_timeout:
        description: Timeout for running tests
        type: string
        default: 10m
      environment_overrides:
        description: Environment overrides
        type: string
        default: ""
      rule:
        description: Rule to run the tests
        type: string
        default: "go-tests-short-ci"
      parallelism:
        description: Number machines to distribute the tests across
        type: integer
        default: 1
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge.gen2
    parallelism: <<parameters.parallelism>>
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: .
      - run:
          name: Configure op-reth binary path
          command: |
            ROOT_DIR="$(pwd)"
            echo "export RUST_BINARY_PATH_OP_RETH=$ROOT_DIR/rust/target/release/op-reth" >> "$BASH_ENV"
      - go-restore-cache:
          namespace: go-tests
      - run:
          name: Run Go tests
          no_output_timeout: <<parameters.no_output_timeout>>
          command: |
            <<parameters.environment_overrides>>
            export TEST_TIMEOUT=<<parameters.test_timeout>>
            # set to less than number CPUs (xlarge Docker is 16 CPU) so there's some buffer for things
            # like Geth
            export PARALLEL=12
            just <<parameters.rule>>
      - go-save-cache:
          namespace: go-tests
      - store_test_results:
          path: ./tmp/test-results
      - run:
          name: Compress test logs
          command: tar -czf testlogs.tar.gz -C ./tmp testlogs
