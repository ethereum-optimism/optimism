  c-base_image:
    type: string
    default: default
  c-github-event-base64:
    type: string
    default: "__not_set__"
  # go-cache-version can be used as a cache buster when making breaking changes to caching strategy
  c-go-cache-version:
    type: string
    default: "v0.1"
  c-publish_contract_artifacts_ref:
    type: string
    default: ""
  # CircleCI forwards user-supplied setup params into continuation validation.
