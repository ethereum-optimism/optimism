          enable-mise-cache: true
      - setup_remote_docker
      - go-restore-cache:
          namespace: cannon-stf-verify
      - run:
          name: Build cannon
          command: just cannon
      - run:
          name: Verify the Cannon STF
          command: just cannon-stf-verify
          working_directory: cannon
      - go-save-cache:
          namespace: cannon-stf-verify
      - notify-failures-on-develop:
          mentions: "@proofs-team"

  semgrep-scan:
    parameters:
      diff_branch:
        type: string
        default: develop
      scan_command:
        type: string
        default: semgrep ci --timeout=100
    environment:
      TEMPORARY_BASELINE_REF: << parameters.diff_branch >>
      SEMGREP_REPO_URL: << pipeline.project.git_url >>
      SEMGREP_BRANCH: << pipeline.git.branch >>
      SEMGREP_COMMIT: << pipeline.git.revision >>
    docker:
      - image: returntocorp/semgrep
    resource_class: xlarge.gen2
    steps:
      - checkout # no need to use mise here since the docker image contains the only dependency
      - unless:
          condition:
            equal: ["develop", << pipeline.git.branch >>]
          steps:
            - run:
                # Scan changed files in PRs, block on new issues only (existing issues ignored)
                # Do a full scan when scanning develop, otherwise do an incremental scan.
                name: "Conditionally set BASELINE env var"
                command: |
                  echo 'export SEMGREP_BASELINE_REF=${TEMPORARY_BASELINE_REF}' >> $BASH_ENV
      - run:
          name: "Set environment variables" # for PR comments and in-app hyperlinks to findings
          command: |
            echo 'export SEMGREP_PR_ID=${CIRCLE_PULL_REQUEST##*/}' >> $BASH_ENV
            echo 'export SEMGREP_JOB_URL=$CIRCLE_BUILD_URL' >> $BASH_ENV
            echo 'export SEMGREP_REPO_NAME=$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME' >> $BASH_ENV
      - run:
          name: "Semgrep scan"
          # --timeout (in seconds) limits the time per rule and file.
          #   SEMGREP_TIMEOUT is the same, but docs have conflicting defaults (5s in CLI flag, 1800 in some places)
          #    https://semgrep.dev/docs/troubleshooting/semgrep-app#if-the-job-is-aborted-due-to-taking-too-long
          command: << parameters.scan_command >>
          # If semgrep hangs, stop the scan after 20m, to prevent a useless 5h job
          no_output_timeout: 20m
      - notify-failures-on-develop

  check-generated-mocks-op-node:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: large.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - check-changed:
          patterns: op-node
      - go-restore-cache:
          namespace: check-generated-mocks-op-node
      - run:
          name: check-generated-mocks
          command: just generate-mocks-op-node && git diff --exit-code
      - go-save-cache:
          namespace: check-generated-mocks-op-node

  check-generated-mocks-op-service:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: large.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - check-changed:
          patterns: op-service
      - go-restore-cache:
          namespace: check-generated-mocks-op-service
      - run:
          name: check-generated-mocks
          command: just generate-mocks-op-service && git diff --exit-code
      - go-save-cache:
          namespace: check-generated-mocks-op-service

  op-deployer-forge-version:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - run:
          command: just check-forge-version
          working_directory: op-deployer

  kontrol-tests:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: xlarge.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - install-contracts-dependencies
      - check-changed:
          no_go_deps: "true"
          patterns: contracts-bedrock/test/kontrol,contracts-bedrock/src/L1/OptimismPortal\.sol,contracts-bedrock/src/L1/OptimismPortal2\.sol,contracts-bedrock/src/L1/L1CrossDomainMessenger\.sol,contracts-bedrock/src/L1/L1ERC721Bridge\.sol,contracts-bedrock/src/L1/L1StandardBridge\.sol,contracts-bedrock/src/L1/ResourceMetering\.sol,contracts-bedrock/src/universal/StandardBridge\.sol,contracts-bedrock/src/universal/ERC721Bridge\.sol,contracts-bedrock/src/universal/CrossDomainMessenger\.sol
      - restore-go-mod-cache
      - setup_remote_docker
      - run:
          name: Run Kontrol Tests
          command: timeout --signal=TERM --kill-after=60s 180m just build-go-ffi kontrol-summary-full test-kontrol-no-build
          working_directory: ./packages/contracts-bedrock
          no_output_timeout: 185m
      - run:
          name: Remove duplicate proof archives
          when: always
          command: |
            logs=packages/contracts-bedrock/test/kontrol/logs
            for archive in "$logs"/results-*.tar.gz; do
              if cmp -s "$archive" "$logs/kontrol-results_latest.tar.gz"; then
                rm -- "$archive"
              fi
            done
      - store_test_results:
          path: packages/contracts-bedrock/test/kontrol/logs
      - store_artifacts:
          path: packages/contracts-bedrock/test/kontrol/logs
      - slack/notify:
          channel: C03N11M0BBN
          event: fail
          template: basic_fail_1
          branch_pattern: develop
          mentions: "<!subteam^S07K486JEH4>"
          ignore_errors: false

  publish-contract-artifacts:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge.gen2
    steps:
      - gcp-cli/install
      - gcp-oidc-authenticate:
          gcp_cred_config_file_path: /tmp/gcp_cred_config.json
          oidc_token_file_path: /tmp/oidc_token.json
          project_id: GCP_TOOLS_ARTIFACTS_PROJECT_ID
          service_account_email: GCP_CONTRACTS_PUBLISHER_SERVICE_ACCOUNT_EMAIL
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - run:
          name: Checkout publish ref
          environment:
            PUBLISH_CONTRACT_ARTIFACTS_REF: << pipeline.parameters.c-publish_contract_artifacts_ref >>
          command: |
            set -euo pipefail

            if [ -z "$PUBLISH_CONTRACT_ARTIFACTS_REF" ]; then
              echo "Using pipeline checkout $(git rev-parse HEAD)"
              exit 0
            fi

            git fetch --no-tags origin "$PUBLISH_CONTRACT_ARTIFACTS_REF"
            git checkout --detach FETCH_HEAD
            echo "Checked out publish ref '$PUBLISH_CONTRACT_ARTIFACTS_REF' at $(git rev-parse HEAD)"

            # Respect the tool versions specified by the ref being published.
            mise install -v -y
      - install-contracts-dependencies
      - install-zstd
      - run:
          name: Build contracts
          environment:
            FOUNDRY_PROFILE: ci
          command: just forge-build
          working_directory: packages/contracts-bedrock
      - run:
          name: Publish artifacts
          command: bash scripts/ops/publish-artifacts.sh
          working_directory: packages/contracts-bedrock

  go-release:
    parameters:
      module:
        description: Go Module Name
        type: string
      filename:
        description: Goreleaser config file
        default: .goreleaser.yaml
        type: string
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: large.gen2
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - gcp-cli/install
      - gcp-oidc-authenticate:
          gcp_cred_config_file_path: /tmp/gcp_cred_config.json
          oidc_token_file_path: /tmp/oidc_token.json
      - utils/checkout-with-mise:
          enable-mise-cache: true
      - attach_workspace: {at: "."}
      # goreleaser compiles the Go release binaries on the host.
      - restore-go-mod-cache
      - run:
          name: Build superchain bundle
          command: just build-superchain-go
      - run:
          name: Configure Docker
          command: |
            gcloud auth configure-docker us-docker.pkg.dev
      - run:
          name: Run goreleaser
          command: |
            goreleaser release --clean -f ./<<parameters.module>>/<<parameters.filename>>

  diff-fetcher-forge-artifacts:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: medium.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - install-contracts-dependencies
      - run:
          name: Build contracts
          command: |
            just build-contracts
          working_directory: op-fetcher
      - run:
          name: Compare forge artifacts
          command: |
            diff -qr "packages/contracts-bedrock/forge-artifacts/FetchChainInfo.s.sol" \
                    "op-fetcher/pkg/fetcher/fetch/forge-artifacts/FetchChainInfo.s.sol"

            if [ $? -ne 0 ]; then
              echo "ERROR: The checked-in forge artifacts for FetchChainInfo.s.sol do not match the ci build."
              echo "Please run 'just build-contracts' in the op-fetcher directory and commit the changes."
              exit 1
            fi

            echo "✅ Checked-in forge artifacts match the ci build"

  stale-check:
    machine:
      image: ubuntu-2204:2024.08.1
    steps:
      - utils/github-stale:
          stale-issue-message: "This issue has been automatically marked as stale and will
            be closed in 5 days if no updates"
          stale-pr-message: "This pr has been automatically marked as stale and will be
            closed in 5 days if no updates"
          close-issue-message: "This issue was closed as stale.  Please reopen if this is a mistake"
          close-pr-message: "This PR was closed as stale.  Please reopen if this is a mistake"
          days-before-issue-stale: 999
          days-before-pr-stale: 14
          days-before-issue-close: 5
          days-before-pr-close: 5

  close-issue:
    machine:
      image: ubuntu-2204:2024.08.1
    parameters:
      label_name:
        type: string
      message:
        type: string
    steps:
      - github-cli/install
      - utils/github-event-handler-setup:
          github_event_base64: << pipeline.parameters.c-github-event-base64 >>
          env_prefix: "github_"
      - run:
          name: Close issue if label is added
          command: |
            if [ ! -z "$github_pull_request_number" ] && [ "$github_label_name" = "$LABEL_NAME" ]; then
                echo "Closing issue $github_pull_request_number as label $LABEL_NAME is added on repository ${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME} "
                export GH_TOKEN=$GITHUB_TOKEN_GOVERNANCE
                gh issue close --repo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" "$github_pull_request_number" --comment "$MESSAGE"
            fi
          environment:
            MESSAGE: << parameters.message >>
            LABEL_NAME: << parameters.label_name >>

  generate-flaky-report:
    machine: true
    resource_class: medium.gen2
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - run:
          name: Generate flaky acceptance tests report
          command: |
            # Create reports directory
            mkdir -p ./op-acceptance-tests/reports

            # Make the script executable
            chmod +x ./op-acceptance-tests/scripts/generate-flaky-tests-report.sh

            # Run the script
            ./op-acceptance-tests/scripts/generate-flaky-tests-report.sh \
              --branch "${CIRCLE_BRANCH:-develop}" \
              --org "${CIRCLE_PROJECT_USERNAME}" \
              --repo "${CIRCLE_PROJECT_REPONAME}" \
              --token "${CIRCLE_API_TOKEN}" \
              --output-dir "./op-acceptance-tests/reports"

      # Store the flaky test reports
      - store_artifacts:
          path: ./op-acceptance-tests/reports
          destination: flaky-test-reports

workflows:
  main:
    when: << pipeline.parameters.c-run_main >>
    jobs:
      - contracts-bedrock-build:
          name: contracts-bedrock-build
          # Build with just core + script contracts.
          build_args: --deny-warnings --skip test
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
      - check-kontrol-build:
          requires:
            - contracts-bedrock-build
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
      # contracts-bedrock test/coverage/upgrade/l2-fork/checks-fast jobs have moved
      # to the contracts-feature-tests workflow below, which is gated on
      # c-contracts_changed. Keeping them here as well was duplicating every
      # contracts run on PRs that touch non-contract files.
      - l2-chains-sync-check:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-upload:
          requires:
            - contracts-bedrock-build
          context:
            - circleci-repo-readonly-authenticated-github-token
      - diff-fetcher-forge-artifacts:
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - contracts-bedrock-build
      - op-deployer-forge-version:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - semgrep-scan:
          name: semgrep-scan-local
          scan_command: semgrep scan --timeout=100 --config .semgrep/rules/ --error .
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
      - semgrep-scan:
          name: semgrep-test
          scan_command: semgrep scan --test --config .semgrep/rules/ .semgrep/tests/
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
      - go-lint:
          requires:
            - prep-superchain
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
      - check-op-geth-version:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - prep-superchain:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - check-nut-locks:
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
      - check-nut-prefork-states:
          requires:
            - contracts-bedrock-build
            - prep-superchain
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
      - nut-provenance-verify:
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
      # One job on every branch: -short gates only a handful of tests, and a
      # single job name lets CircleCI reuse timing data across branches (develop
      # runs keep the store fresh). Slack notify fires on develop only
      # (branch_pattern in notify-failures-on-develop).
      - go-tests:
          name: go-tests
          rule: "go-tests-ci"
          parallelism: 12
          no_output_timeout: 39m
          test_timeout: 40m
          notify: true
          mentions: "<!subteam^S09D13R3HJ7>" # @protocol-oncall
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - go-binaries-for-sysgo
            - prep-superchain
            - prep-go-modules
            - rust-kona-binaries
            - rust-op-reth-binary
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
      - cannon-prestate:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - check-generated-mocks-op-node:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - check-generated-mocks-op-service:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-go-lint-and-test:
          requires:
            - contracts-bedrock-build
          skip_slow_tests: true
          notify: true
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
      - todo-issues:
          name: todo-issues-check
          check_closed: false
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
      - shellcheck/check:
          name: shell-check
          # We don't need the `exclude` key as the orb detects the `.shellcheckrc`
          dir: .
          ignore-dirs: |
            ./packages/contracts-bedrock/lib
            ./docs/public-docs
          context:
            - circleci-repo-readonly-authenticated-github-token
      # Acceptance test jobs (formerly in separate acceptance-tests workflow)
      - rust-kona-binaries:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - rust-op-reth-binary:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - rust-build-sp1-super-range-executor:
          name: rust-sp1-super-range-executor
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      # Gates that the SP1 guest ELFs build reproducibly. The acceptance tests
      # no longer consume this job's workspace (they run with stub prestate
      # artifacts against the mock verifier), so it is required directly by
      # ci-gate rather than through them.
      - kona-build-sp1-elfs:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - rust-binaries-for-sysgo:
          requires:
            - rust-kona-binaries
            - rust-op-reth-binary
            - rust-sp1-super-range-executor
      - go-binaries-for-sysgo:
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
      # IN-MEMORY - op-node/op-reth
      - op-acceptance-tests:
          name: memory-all-opn-op-reth-<<matrix.l1_fork>>
          matrix:
            parameters:
              l1_fork: &acceptance_l1_forks
                - fusaka
          l2_el_kind: op-reth
          parallelism: 8
          acceptance_test_jobs: "8"
          no_output_timeout: 120m
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
            - discord
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-binaries-for-sysgo
            - go-binaries-for-sysgo
            - prep-go-modules
            # for the gitignored superchain-configs.zip op-acceptance-tests //go:embeds
            - prep-superchain
      # IN-MEMORY - kona/op-reth
      - op-acceptance-tests:
          name: memory-all-kona-op-reth-<<matrix.l1_fork>>
          matrix:
            parameters:
              l1_fork: *acceptance_l1_forks
          l2_cl_kind: kona-node
          l2_el_kind: op-reth
          parallelism: 8
          acceptance_test_jobs: "8"
          no_output_timeout: 120m
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
            - discord
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-binaries-for-sysgo
            - go-binaries-for-sysgo
            - prep-go-modules
            # for the gitignored superchain-configs.zip op-acceptance-tests //go:embeds
            - prep-superchain
      # Gate job - single stable job used as GitHub required status check for develop.
      # Uses terminal requires so it always runs (even when deps fail), giving the
      # merge queue an immediate failure signal instead of a timeout.
      # To add a new mandatory check: add it to requires here. No GitHub ruleset changes needed.
      - ci-gate:
          requires:
            - check-kontrol-build: terminal
            - shell-check: terminal
            - go-lint: terminal
            - semgrep-scan-local: terminal
            - semgrep-test: terminal
            - go-tests: terminal
            - memory-all-opn-op-reth-fusaka: terminal
            - memory-all-kona-op-reth-fusaka: terminal
            - kona-build-sp1-elfs: terminal
            # Go test/lint jobs previously fanned in via the bedrock-go-tests helper.
            - cannon-go-lint-and-test: terminal
            - check-generated-mocks-op-node: terminal
            - check-generated-mocks-op-service: terminal
            # Misc checks that run on the merge queue.
            - check-nut-locks: terminal
            - check-nut-prefork-states: terminal
            - check-op-geth-version: terminal
            - op-deployer-forge-version: terminal
            - l2-chains-sync-check: terminal
            - nut-provenance-verify: terminal
            - diff-fetcher-forge-artifacts: terminal
          context:
            - circleci-api-token
          filters:
            branches:
              ignore: develop
      # Generate flaky test report
      - generate-flaky-report:
          name: generate-flaky-tests-report
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-api-token

  go-release-op-deployer:
    jobs:
      - contracts-bedrock-build:
          name: build-contracts-go-release-op-deployer
          filters:
            tags:
              only: /^op-deployer.*/
            branches:
              ignore: /.*/
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - go-release:
          filters:
            tags:
              only: /^op-deployer.*/
            branches:
              ignore: /.*/
          module: op-deployer
          context:
            - oplabs-gcr-release
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - build-contracts-go-release-op-deployer

  go-release-op-up:
    jobs:
      - contracts-bedrock-build:
          name: build-contracts-go-release-op-up
          filters:
            tags:
              only: /^op-up.*/
            branches:
              ignore: /.*/
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - go-release:
          filters:
            tags:
              only: /^op-up.*/
            branches:
              ignore: /.*/
          module: op-up
          context:
            - oplabs-gcr-release
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - build-contracts-go-release-op-up

  release:
    when: << pipeline.parameters.c-run_release >>
    jobs:
      - initialize:
          context:
            - circleci-repo-readonly-authenticated-github-token
          filters:
            tags:
              only: /^(da-server|cannon|ufm-[a-z0-9\-]*|op-[a-z0-9\-]*)\/v.*/
            branches:
              ignore: /.*/

  scheduled-todo-issues:
    when: << pipeline.parameters.c-run_scheduled_todo_issues >>
    jobs:
      - todo-issues:
          name: todo-issue-checks
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  publish-contract-artifacts-on-tag:
    jobs:
      - publish-contract-artifacts:
          filters:
            tags:
              only: /^op-contracts\/v.*/
            branches:
              ignore: /.*/
          context:
            - circleci-repo-readonly-authenticated-github-token

  publish-contract-artifacts-auto-or-manual:
    when: << pipeline.parameters.c-run_publish_contract_artifacts >>
    jobs:
      - publish-contract-artifacts:
          context:
            - circleci-repo-readonly-authenticated-github-token

  develop-fault-proofs:
    when: << pipeline.parameters.c-run_develop_fault_proofs >>
    jobs:
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-stf-verify:
          requires:
            - prep-go-modules
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-build:
          build_args: --deny-warnings --skip test
          requires:
            - prep-go-modules
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
      - rust-kona-binaries:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - rust-op-reth-binary:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - sccache-gcs-optimism
      - go-tests-with-fault-proof-deps:
          name: op-e2e-cannon-tests
          notify: true
          mentions: "@proofs-team"
          no_output_timeout: 90m
          test_timeout: 480m
          resource_class: 2xlarge.gen2
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
          requires:
            - contracts-bedrock-build
            - cannon-prestate
            - rust-kona-binaries
            - rust-op-reth-binary
            - prep-go-modules

  develop-kontrol-tests:
    when: << pipeline.parameters.c-run_develop_kontrol_tests >>
    jobs:
      - kontrol-tests:
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  scheduled-cannon-full-tests:
    when: << pipeline.parameters.c-run_scheduled_cannon_full_tests >>
    jobs:
      - contracts-bedrock-build:
          build_args: --deny-warnings --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-go-lint-and-test:
          requires:
            - contracts-bedrock-build
          skip_slow_tests: false
          no_output_timeout: 30m
          notify: true
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  scheduled-preimage-reproducibility:
    when: << pipeline.parameters.c-run_scheduled_preimage_reproducibility >>
    jobs:
      - preimage-reproducibility:
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  scheduled-stale-check:
    when: << pipeline.parameters.c-run_scheduled_stale_check >>
    jobs:
      - stale-check:
          context:
            - circleci-repo-optimism

  scheduled-heavy-fuzz-tests:
    when: << pipeline.parameters.c-run_scheduled_heavy_fuzz_tests >>
    jobs:
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-heavy-fuzz-nightly:
          requires:
            - prep-go-modules
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  circleci-schedule-trigger-check-workflow:
    when: << pipeline.parameters.c-run_circleci_schedule_trigger_check >>
    jobs:
      - circleci-schedule-trigger-check:
          context:
            - circleci-api-token
            - circleci-repo-readonly-authenticated-github-token

  close-issue-workflow:
    when: << pipeline.parameters.c-run_close_issue >>
    jobs:
      - close-issue:
          label_name: "auto-close-trivial-contribution"
          message: "Thank you for your interest in contributing! At this time, we are not
            accepting contributions that primarily fix spelling, stylistic, or
            grammatical errors in documentation, code, or elsewhere. Please
            check our [contribution
            guidelines](https://github.com/ethereum-optimism/optimism/blob/deve\
            lop/CONTRIBUTING.md#contributions-related-to-spelling-and-grammar)
            for more information. This issue will be closed now."
          context:
            - circleci-repo-optimism

  l2-fork-test-workflow:
    when: << pipeline.parameters.c-run_l2_fork_test >>
    jobs:
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-tests-l2-fork:
          name: contracts-bedrock-tests-l2-fork-dispatch op-mainnet
          fork_op_chain: op-mainnet
          l2_fork_block_number: latest
          test_profile: ci
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack

  scheduled-daily-tests:
    when: << pipeline.parameters.c-run_scheduled_daily_tests >>
    jobs:
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-tests-l2-fork:
          requires:
            - prep-go-modules
          matrix:
            parameters:
              fork_op_chain:
                - op-mainnet
                - zora
                - ink
                - mode
                - metal
                - unichain
                - soneium
                - world-chain
                - xlayer
          test_profile: ci
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack

  contracts-feature-tests:
    when: << pipeline.parameters.c-run_contracts_feature_tests >>
    jobs:
      - prep-go-modules:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-tests:
          # Heavily fuzz any fuzz tests within added or modified test files.
          name: contracts-bedrock-tests-heavy-fuzz-modified <<matrix.features>>
          requires:
            - prep-go-modules
          test_list: git diff origin/develop...HEAD --name-only --diff-filter=AM --
            './test/**/*.t.sol' | sed 's|packages/contracts-bedrock/||'
          test_timeout: 1h
          test_profile: ciheavy
          features: <<matrix.features>>
          matrix:
            parameters:
              features: &features_matrix
                - main
                - CUSTOM_GAS_TOKEN
                - OPTIMISM_PORTAL_INTEROP
                - ZK_DISPUTE_GAME
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
      # On PRs, run tests with lite profile for better build times.
      - contracts-bedrock-tests:
          name: contracts-bedrock-tests <<matrix.features>>
          requires:
            - prep-go-modules
          test_list: find test -name "*.t.sol"
          test_profile: liteci
          features: <<matrix.features>>
          matrix:
            parameters:
              features: *features_matrix
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
          filters:
            branches:
              ignore: develop
      # On develop, run tests with ci profile to mirror production.
      - contracts-bedrock-tests:
          name: contracts-bedrock-tests-develop <<matrix.features>>
          requires:
            - prep-go-modules
          test_list: find test -name "*.t.sol"
          test_profile: ci
          features: <<matrix.features>>
          matrix:
            parameters:
              features: *features_matrix
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
          filters:
            branches:
              only: develop
      - contracts-bedrock-coverage:
          # Generate coverage reports.
          name: contracts-bedrock-coverage <<matrix.features>>
          requires:
            - prep-go-modules
          test_timeout: 1h
          test_profile: cicoverage
          features: <<matrix.features>>
          matrix:
            parameters:
              features: *features_matrix
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
      # On PRs, run upgrade tests with lite profile for better build times.
      - contracts-bedrock-tests-upgrade:
          name: contracts-bedrock-tests-upgrade op-mainnet <<matrix.features>>
          requires:
            - prep-go-modules
          fork_op_chain: op
          fork_base_chain: mainnet
          test_profile: liteci
          features: <<matrix.features>>
          matrix:
            parameters:
              features: *features_matrix
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
          filters:
            branches:
              ignore: develop
      # On develop, run upgrade tests with ci profile to mirror production.
      - contracts-bedrock-tests-upgrade:
          name: contracts-bedrock-tests-upgrade-develop op-mainnet <<matrix.features>>
          requires:
            - prep-go-modules
          fork_op_chain: op
          fork_base_chain: mainnet
          test_profile: ci
          features: <<matrix.features>>
          matrix:
            parameters:
              features: *features_matrix
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
          filters:
            branches:
              only: develop
      # On PRs, run chain-specific upgrade tests with lite profile for better build times.
      - contracts-bedrock-tests-upgrade:
          name: contracts-bedrock-tests-upgrade <<matrix.fork_op_chain>>-mainnet
          requires:
            - prep-go-modules
          fork_op_chain: <<matrix.fork_op_chain>>
          fork_base_chain: mainnet
          test_profile: liteci
          matrix:
            parameters:
              fork_op_chain: ["op", "ink", "unichain"]
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
          filters:
            branches:
              ignore: develop
      # On develop, run chain-specific upgrade tests with ci profile to mirror production.
      - contracts-bedrock-tests-upgrade:
          name: contracts-bedrock-tests-upgrade-develop <<matrix.fork_op_chain>>-mainnet
          requires:
            - prep-go-modules
          fork_op_chain: <<matrix.fork_op_chain>>
          fork_base_chain: mainnet
          test_profile: ci
          matrix:
            parameters:
              fork_op_chain: ["op", "ink", "unichain"]
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
          filters:
            branches:
              only: develop
      # Always run L2 fork tests with ci profile
      - contracts-bedrock-tests-l2-fork:
          name: contracts-bedrock-tests-l2-fork op-mainnet
          requires:
            - prep-go-modules
          fork_op_chain: op-mainnet
          l2_fork_block_number: latest
          test_profile: ci
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - slack
      - contracts-bedrock-checks-fast:
          name: contracts-bedrock-checks-fast-feature-tests
          requires:
            - prep-go-modules
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
      # -----------------------------------------------------------------------
      # required-contracts-ci: GitHub required status for this workflow. Terminal requires
      # keep this job scheduled even when upstream jobs fail; ci-gate then checks they passed.
      # -----------------------------------------------------------------------
      - required-contracts-ci:
          requires:
            - contracts-bedrock-tests main: terminal
            - contracts-bedrock-tests CUSTOM_GAS_TOKEN: terminal
            - contracts-bedrock-tests OPTIMISM_PORTAL_INTEROP: terminal
            - contracts-bedrock-tests ZK_DISPUTE_GAME: terminal
            - contracts-bedrock-tests-heavy-fuzz-modified main: terminal
            - contracts-bedrock-tests-heavy-fuzz-modified CUSTOM_GAS_TOKEN: terminal
            - contracts-bedrock-tests-heavy-fuzz-modified OPTIMISM_PORTAL_INTEROP: terminal
            - contracts-bedrock-tests-heavy-fuzz-modified ZK_DISPUTE_GAME: terminal
            - contracts-bedrock-coverage main: terminal
            - contracts-bedrock-coverage CUSTOM_GAS_TOKEN: terminal
            - contracts-bedrock-coverage OPTIMISM_PORTAL_INTEROP: terminal
            - contracts-bedrock-coverage ZK_DISPUTE_GAME: terminal
            - contracts-bedrock-tests-upgrade op-mainnet main: terminal
            - contracts-bedrock-tests-upgrade op-mainnet CUSTOM_GAS_TOKEN: terminal
            - contracts-bedrock-tests-upgrade op-mainnet OPTIMISM_PORTAL_INTEROP: terminal
            - contracts-bedrock-tests-upgrade op-mainnet ZK_DISPUTE_GAME: terminal
            - contracts-bedrock-tests-upgrade op-mainnet: terminal
            - contracts-bedrock-tests-upgrade ink-mainnet: terminal
            - contracts-bedrock-tests-upgrade unichain-mainnet: terminal
            - contracts-bedrock-tests-l2-fork op-mainnet: terminal
            - contracts-bedrock-checks-fast-feature-tests: terminal
          context:
            - circleci-api-token

  # ============================================================================
  # Required contracts CI gate (skip) — runs when no contract changes
  # Produces the required-contracts-ci status so the merge queue doesn't hang.
  # ============================================================================
  contracts-feature-tests-short:
    when: << pipeline.parameters.c-run_contracts_feature_tests_short >>
    jobs:
      - required-contracts-ci:
          always-succeed: true
          context:
            - circleci-api-token

  # ============================================================================
  # ci-gate (skip) — runs only on the docs-only fast path.
  # Produces the ci-gate required status check with always-succeed so docs-only
  # PRs (which skip the full `main` workflow) aren't blocked by a missing check.
  # The real ci-gate still runs in `main` for every other path.
  # ============================================================================
  ci-gate-skip:
    when: << pipeline.parameters.c-run_ci_gate_skip >>
    jobs:
      - ci-gate:
          always-succeed: true
          context:
            - circleci-api-token
