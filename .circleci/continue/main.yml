  op-acceptance-tests:
    parameters:
      l1_fork:
        description: "L1 fork active at genesis"
        type: string
        default: "fusaka"
      l2_cl_kind:
        description: "L2 consensus layer client (op-node or kona-node)"
        type: string
        default: "op-node"
      l2_el_kind:
        description: "L2 execution layer client (op-geth or op-reth)"
        type: string
        default: "op-reth"
      no_output_timeout:
        description: Timeout for when CircleCI kills the job if there's no output
        type: string
        default: 30m
      parallelism:
        description: Number of machines to distribute the tests across
        type: integer
        default: 1
      acceptance_test_jobs:
        description: "Override ACCEPTANCE_TEST_JOBS (go test -p) for this run; empty
          leaves the justfile default in place"
        type: string
        default: ""
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: 2xlarge+.gen2
    parallelism: <<parameters.parallelism>>
    steps:
      # apt-install needs the working tree, so it runs after checkout.
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - apt-install:
          extra_flags: "--no-install-recommends"
          packages: "eatmydata"
      - run:
          name: Disable fsync for all subprocesses
          command: echo 'export LD_PRELOAD=libeatmydata.so' >> "$BASH_ENV"
      - attach_workspace:
          at: .
      - run:
          name: Configure Rust binary paths (sysgo)
          command: |
            ROOT_DIR="$(pwd)"
            BIN_DIR="$ROOT_DIR/.circleci-cache/rust-binaries"

            echo "export RUST_BINARY_PATH_KONA_NODE=$ROOT_DIR/rust/target/release/kona-node" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_KONA_SP1_PROPOSER=$ROOT_DIR/rust/target/release/kona-sp1-proposer" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_OP_RETH=$ROOT_DIR/rust/target/release/op-reth" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_OP_RETH_SDM_FIXTURE=$ROOT_DIR/rust/target/release/op-reth-sdm-fixture" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_KONA_SP1_SUPER_RANGE_EXECUTOR=$BIN_DIR/kona-sp1-super-range-executor" >> "$BASH_ENV"

            # Fail here in seconds rather than ~25 minutes into the test run: a drift in the
            # persist path or the build profile would otherwise surface as an opaque devstack
            # error when a test first tries to launch one of these.
            test -x "$ROOT_DIR/rust/target/release/op-reth"
            test -x "$ROOT_DIR/rust/target/release/op-reth-sdm-fixture"
            # KONA_SP1_ELF_DIR deliberately not set: acceptance tests run with
            # stub prestate artifacts (the devstack deploys the mock verifier,
            # so nothing consumes real ELF bytes until the proving path). This
            # keeps these jobs off the slow kona-build-sp1-elfs critical path;
            # kona-build-sp1-elfs is gated directly via ci-gate instead.
      - run:
          name: Configure devstack
          command: |
            echo "export DEVSTACK_L1_FORK=<<parameters.l1_fork>>" >> "$BASH_ENV"
            echo "export DEVSTACK_L2CL_KIND=<<parameters.l2_cl_kind>>" >> "$BASH_ENV"
            echo "export DEVSTACK_L2EL_KIND=<<parameters.l2_el_kind>>" >> "$BASH_ENV"
      # Restore cached Go modules (downloaded once by prep-go-modules) plus the
      # per-job build cache. Modules are already present, so the test run below
      # does not need a separate `go mod download`.
      - go-restore-cache:
          namespace: op-acceptance-tests
      # Run the acceptance tests (if the devnet is running)
      - run:
          name: Run acceptance tests
          working_directory: op-acceptance-tests
          no_output_timeout: <<parameters.no_output_timeout>>
          command: |
            if [ -n "<<parameters.acceptance_test_jobs>>" ]; then
              export ACCEPTANCE_TEST_JOBS="<<parameters.acceptance_test_jobs>>"
            fi
            LOG_LEVEL=info just acceptance-test
      - run:
          name: Print results (summary)
          working_directory: op-acceptance-tests
          command: |
            LOG_DIR=$(ls -td -- logs/* | head -1)
            cat "$LOG_DIR/summary.log" || true
      - run:
          name: Print results (failures)
          working_directory: op-acceptance-tests
          command: |
            LOG_DIR=$(ls -td -- logs/* | head -1)
            cat "$LOG_DIR"/failed/*.log || true
          when: on_fail
      # Save the module cache for future runs
      - go-save-cache:
          namespace: op-acceptance-tests
      # Store test results and artifacts
      - when:
          condition: always
          steps:
            - store_test_results:
                path: ./op-acceptance-tests/results
      - when:
          condition: always
          steps:
            - store_artifacts:
                path: ./op-acceptance-tests/logs
      - when:
          condition: on_fail
          steps:
            - notify-failures-on-develop:
                mentions: "@protocol-oncall"

  # Aggregator job - allows downstream jobs and required checks to depend on a single memory-all job.
  memory-all:
    docker:
      - image: <<pipeline.parameters.c-default_docker_image>>
    resource_class: small.gen2
