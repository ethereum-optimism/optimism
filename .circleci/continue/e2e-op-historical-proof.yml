name: e2e-op-historical-proof

on:
  push:
    branches: [ unstable, main]
  pull_request:
  workflow_dispatch:

jobs:
  op-reth-as-verifier:
    name: op-reth-as-verifier-${{ matrix.go_pkg_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - go_pkg_name: proofs/core
          - go_pkg_name: proofs/reorg
          - go_pkg_name: proofs/prune

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify tools
        run: |
          echo "forge: $(command -v forge || true)"
          go version

      - name: Build contract artifacts with forge
        working-directory: op-reth/tests/proofs/contracts
        run: |
          forge build

      - uses: jdx/mise-action@v3

      - name: build op-reth
        run: |
          make build-op

      # disable coverage for now
      # - name: Build op-reth with coverage
      #   working-directory: op-reth/tests
      #   run: |
      #     make build-with-cov

      - name: Run ${{ matrix.go_pkg_name }} e2e tests
        working-directory: op-reth/tests
        run: |
          make test-e2e-sysgo GO_PKG_NAME=${{ matrix.go_pkg_name }} OP_DEVSTACK_PROOF_SEQUENCER_EL=op-geth OP_DEVSTACK_PROOF_VALIDATOR_EL=op-reth

      # disable coverage for now
