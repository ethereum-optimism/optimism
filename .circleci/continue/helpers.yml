# Shared command helpers merged into every continuation config (see
# .circleci/scripts/merge-configs.sh). Defining them here once avoids
# duplicating the definitions across main.yml and rust-e2e.yml.
commands:
  # forge reads every source, lib/ included, to check the compile cache of the prebuilt artifacts.
  # Jobs that run op-deployer from the checkout (op-e2e, sysgo, kona proof tests) need these
  # submodules; the embedded bundle has its own lib/. Recursive, as forge detects remappings in the
  # nested libs and finds the cache stale when they differ from the build's. No history: forge reads
  # only the sources.
  checkout-contracts-lib:
    steps:
      - run:
          name: Check out the contracts-bedrock lib submodules
          command: |
            attempt=1
            until git submodule update --init --recursive --depth 1 --single-branch --force -j 8 -- packages/contracts-bedrock/lib; do
              [ "$attempt" -ge 3 ] && exit 1
              attempt=$((attempt+1))
              echo "submodule update failed; attempt $attempt/3 in 5s" >&2
              sleep 5
            done

  # The Go caches (these, opgeth-ratchet's and go-lint's) are scoped by
  # branch. Each branch saves only under its own name, and restores only its
  # own caches or develop's. Go trusts both caches without re-checking them,
  # so this keeps what a branch (or code it runs) writes into them out of
  # develop, the merge queue and other branches. The ':' after the branch
  # can't appear in a git branch name, so "develop:" can't match a branch
  # like develop-nat. CircleCI caches have no access control, so this doesn't
  # stop anyone who can push a branch with edited config, or trigger a
  # pipeline with parameters, from saving under develop's keys. That needs
  # storage only develop can write, like sccache's GCS bucket (#21227). Go
  # caches inside Docker builds (BuildKit cache mounts) aren't covered.
  #
  # Shared Go module cache. There is a single Go module in the repo, so the
  # downloaded module set is identical for every job at a given go.mod and
  # go.sum. It is populated at most once per pipeline by the prep-go-modules
  # job and restored read-only everywhere else, so modules are downloaded a
  # single time per snapshot rather than once per job (every download is an
  # opportunity for a proxy.golang.org flake). The key includes go.mod because
  # a toolchain directive bump changes only go.mod, and the toolchain that Go
  # then downloads is stored in this cache: keys are immutable, so a
  # go.sum-only key never captures it and every job downloads the toolchain
  # again. c-go-cache-version is the global cache-buster for breaking changes.
  restore-go-mod-cache:
    steps:
      - run:
          name: Use the shared Go module cache directory
          command: |
            # Machine images default GOPATH to ~/.go_workspace, not the ~/go
            # that the cache below restores, so set GOMODCACHE explicitly.
            # Circle sources BASH_ENV in every later step.
            GO_MODULE_CACHE_DIR="$HOME/go/pkg/mod"
            mkdir -p "$GO_MODULE_CACHE_DIR"
            printf 'export GOMODCACHE=%q\n' "$GO_MODULE_CACHE_DIR" >> "$BASH_ENV"
      - restore_cache:
          name: Restore Go module cache (go.mod, go.sum)
          keys:
            - go-mod-<<pipeline.parameters.c-go-cache-version>>-{{ .Branch }}:{{ checksum "go.mod" }}-{{ checksum "go.sum" }}
            - go-mod-<<pipeline.parameters.c-go-cache-version>>-develop:{{ checksum "go.mod" }}-{{ checksum "go.sum" }}
            - "go-mod-<<pipeline.parameters.c-go-cache-version>>-{{ .Branch }}:"
            - "go-mod-<<pipeline.parameters.c-go-cache-version>>-develop:"

  save-go-mod-cache:
    steps:
      - save_cache:
          name: Save Go module cache (go.mod, go.sum)
          key: go-mod-<<pipeline.parameters.c-go-cache-version>>-{{ .Branch }}:{{ checksum "go.mod" }}-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod

  # Restores the shared module cache plus a per-namespace Go build cache. The
  # build cache holds compiled artifacts that track the source, so it is keyed
  # on branch+revision and saved fresh on every commit (CircleCI cache keys are
  # immutable, so a key that didn't change with the source could never be
  # refreshed). Restore falls back from this exact commit, to the latest on the
  # branch, to the latest on develop.
  go-restore-cache:
    parameters:
      namespace:
        type: string
    steps:
      - restore-go-mod-cache
      - restore_cache:
          name: Restore Go build cache for <<parameters.namespace>>
          keys:
            - go-build-<<parameters.namespace>>-<<pipeline.parameters.c-go-cache-version>>-{{ .Branch }}:{{ .Revision }}
            - "go-build-<<parameters.namespace>>-<<pipeline.parameters.c-go-cache-version>>-{{ .Branch }}:"
            - "go-build-<<parameters.namespace>>-<<pipeline.parameters.c-go-cache-version>>-develop:"

  # Saves only the per-namespace build cache; the module cache is written once
  # by prep-go-modules. The revision in the key makes it unique per commit so
  # each build persists an up-to-date cache. Merge queue branches don't save:
  # each queue branch name is used once, so its saves get little reuse.
  go-save-cache:
    parameters:
      namespace:
        type: string
      prune:
        # Go touches an entry's mtime at most once an hour, so this keeps what a
        # job used unless it saves over 2 hours later. Only for a namespace where
        # every job and node builds the same packages, since the first save wins.
        # -delete because BusyBox find fails -exec rm {} + on long argument lists.
        description: "Delete Go build cache entries unused for 3 hours before saving."
        type: boolean
        default: false
    steps:
      - unless:
          condition:
            matches:
              pattern: "^gh-readonly-queue/.*$"
              value: << pipeline.git.branch >>
          steps:
            - when:
                condition: << parameters.prune >>
                steps:
                  - run:
                      name: Prune Go build cache entries unused for 3 hours
                      command: |
                        find ~/.cache/go-build -mindepth 2 -type f -mmin +180 -delete
                        du -sh ~/.cache/go-build
            - save_cache:
                name: Save Go build cache for <<parameters.namespace>>
                key: go-build-<<parameters.namespace>>-<<pipeline.parameters.c-go-cache-version>>-{{ .Branch }}:{{ .Revision }}
                paths:
                  - ~/.cache/go-build

  # Single canonical Rust env/prepare commands. Defined here (helpers is merged
  # first) so there is exactly one of each and the sccache step below cannot be
  # shadowed by a stale duplicate in main.yml / rust-ci.yml.
  rust-setup-env:
    description: "Fix rust mise environment variables"
    steps:
      - run:
          name: Fix mise environment variables
          command: |
            echo "export CARGO_HOME=${MISE_CARGO_HOME}" >> "$BASH_ENV"
            echo "export RUSTUP_HOME=${MISE_RUSTUP_HOME}" >> "$BASH_ENV"
            echo "source ${MISE_CARGO_HOME}/env" >> "$BASH_ENV"
            echo "export CARGO_INCREMENTAL=0" >> "$BASH_ENV"
      - run:
          name: Configure Rust binary paths (sysgo)
          command: |
            ROOT_DIR="$(pwd)"
            echo "export RUST_BINARY_PATH_KONA_NODE=$ROOT_DIR/rust/target/release/kona-node" >> "$BASH_ENV"

  rust-prepare:
    parameters:
      needs_clang:
        description: "Whether to install clang (needed by bindgen for reth-mdbx-sys)."
        type: boolean
        default: true
      enable_sccache:
        description: >
          Whether to set up the sccache GCS compile cache. Disable for jobs that
          don't compile on the host (e.g. the reproducible prestate build runs in
          Docker) so they don't need the sccache-gcs-optimism context.
        type: boolean
        default: true
    description: "Prepare the Rust environment for the build."
    steps:
      - rust-setup-env
      - when:
          condition: << parameters.needs_clang >>
          steps:
            - run:
                name: Ensure clang available
                command: 'command -v clang >/dev/null 2>&1 || { echo "ERROR: clang is required but was not found in PATH" >&2; exit 1; }'
      # protoc (sp1-sdk prost/tonic build dep) bundles the well-known type
      # includes it resolves, so its presence on PATH is enough to assert.
      - run:
          name: Ensure protobuf compiler available
          command: |
            if ! command -v protoc >/dev/null 2>&1; then
              echo "ERROR: protoc is required but was not found in PATH" >&2
              exit 1
            fi
            protoc --version
            # Build scripts run in the package source dir (the cargo registry for
            # sp1-prover-types), outside the repo, where the mise shim has no version.
            # Export the resolved binary so prost-build finds it from any directory.
            echo "export PROTOC=$(mise which protoc)" >> "$BASH_ENV"
      # Shared GCS compile cache (op-rust-sccache).
      - rust-sccache-setup:
          enabled: << parameters.enable_sccache >>
  github-checkout:
    description: "Check out the optimism repo over HTTPS, anonymously."
    parameters:
      method:
        description: "Clone method: full or blobless (blob:none filter)."
        type: enum
        enum: ["full", "blobless"]
        default: "full"
    steps:
      - run:
          name: Check out code
          environment:
            CHECKOUT_METHOD: << parameters.method >>
          command: |
            set -euo pipefail

            : "${CIRCLE_SHA1:?CIRCLE_SHA1 is not set}"

            repo_url="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"

            fetch_repo() {
              if [ "$CHECKOUT_METHOD" = "blobless" ]; then
                git fetch --filter=blob:none "$@"
              else
                git fetch "$@"
              fi
            }

            if [ ! -e .git ]; then
              git init -q
            fi

            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$repo_url"
            else
              git remote add origin "$repo_url"
            fi

            echo "Checking out anonymously"

            fetch_repo --quiet --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
            fetch_repo origin "$CIRCLE_SHA1"
            git branch --force develop refs/remotes/origin/develop

            if [ -n "${CIRCLE_BRANCH:-}" ]; then
              git checkout -q --force -B "$CIRCLE_BRANCH" "$CIRCLE_SHA1"
            else
              git checkout -q --force "$CIRCLE_SHA1"
            fi

            if [ "$(git rev-parse HEAD)" != "$CIRCLE_SHA1" ]; then
              echo "HEAD $(git rev-parse HEAD) does not match CIRCLE_SHA1 ${CIRCLE_SHA1}" >&2
              exit 1
            fi

            if [ -n "${CIRCLE_TAG:-}" ]; then
              if ! git rev-parse -q --verify "refs/tags/${CIRCLE_TAG}" >/dev/null; then
                echo "Tag ${CIRCLE_TAG} not found" >&2
                exit 1
              fi
            fi

  checkout-with-mise:
    description: "Checkout then initialize the mise environment."
    parameters:
      checkout-method:
        type: enum
        enum:
          - blobless
          - full
        default: full
      enable-mise-cache:
        type: boolean
        default: false
      mise-cache-key-prefix:
        type: string
        default: "mise-cache"
      mise-cache-checksum:
        type: string
        default: '{{ checksum "mise.toml" }}'
    steps:
      - github-checkout:
          method: << parameters.checkout-method >>
      - utils/install-mise:
          trusted_branch: develop
          enable_mise_cache: << parameters.enable-mise-cache >>
          mise_cache_key_prefix: << parameters.mise-cache-key-prefix >>
          mise_cache_checksum: << parameters.mise-cache-checksum >>
