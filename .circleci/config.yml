version: 2.1

# Setup Configuration for CircleCI Dynamic Configuration
# Uses a custom compute-changes job to detect changed paths with full shell
# flexibility, then merges continuation configs and continues the pipeline.
# See: https://circleci.com/docs/using-dynamic-configuration/

setup: true

parameters:
  default_docker_image:
    type: string
    default: cimg/base:2026.03
  # Pinned ci-base-clang image (cimg/base + clang/llvm-dev/libclang-dev) for Rust jobs.
  # Provenance is verified by .github/workflows/security.yml.
  rust_base_image:
    type: string
    default: us-docker.pkg.dev/oplabs-tools-artifacts/images/ci-base-clang@sha256:00f641689576d7393d83f6fd49fe1592006148305999f1ba2fc4f1f9d2e8a342
  base_image:
    type: string
    default: default
  # The dispatch parameters are used to manually dispatch pipelines that normally only run post-merge on develop
  # from the CircleCI UI. Example configuration:
  #   when:
  #     or:
  #       - equal: [ "develop", <<pipeline.git.branch>> ]
  #       - equal: [ true, <<pipeline.parameters.main_dispatch>> ]
  # Add a new `*_dispatch` parameter for any pipeline you want manual dispatch for.
  main_dispatch:
    type: boolean
    default: true # default to running main in case the manual run cancelled an automatic run
  fault_proofs_dispatch:
    type: boolean
    default: false
  reproducibility_dispatch:
    type: boolean
    default: false
  kontrol_dispatch:
    type: boolean
    default: false
  cannon_full_test_dispatch:
    type: boolean
    default: false
  sdk_dispatch:
    type: boolean
    default: false
  publish_contract_artifacts_dispatch:
    type: boolean
    default: false
  stale_check_dispatch:
    type: boolean
    default: false
  contracts_coverage_dispatch:
    type: boolean
    default: false
  heavy_fuzz_dispatch:
    type: boolean
    default: false
  ai_contracts_test_dispatch:
    type: boolean
    default: false
  rust_ci_dispatch:
    type: boolean
    default: false
  rust_e2e_dispatch:
    type: boolean
    default: false
  l2_fork_test_dispatch:
    type: boolean
    default: false
  github-event-type:
    type: string
    default: "__not_set__"
  github-event-action:
    type: string
    default: "__not_set__"
  github-event-base64:
    type: string
    default: "__not_set__"
  # go-cache-version can be used as a cache buster when making breaking changes to caching strategy
  go-cache-version:
    type: string
    default: "v0.0"

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  compute-changes:
    docker:
      - image: << pipeline.parameters.default_docker_image >>
    environment:
      BASE_REVISION: develop
    steps:
      - checkout
      - run:
          name: Collect string parameters
          command: .circleci/scripts/compute-changes.sh str
          environment:
            c-default_docker_image: << pipeline.parameters.default_docker_image >>
            c-rust_base_image: << pipeline.parameters.rust_base_image >>
            c-base_image: << pipeline.parameters.base_image >>
            c-github-event-type: << pipeline.parameters.github-event-type >>
            c-github-event-action: << pipeline.parameters.github-event-action >>
            c-github-event-base64: << pipeline.parameters.github-event-base64 >>
            c-go-cache-version: << pipeline.parameters.go-cache-version >>
      - run:
          name: Collect boolean parameters
          command: .circleci/scripts/compute-changes.sh bool
          environment:
            c-main_dispatch: << pipeline.parameters.main_dispatch >>
            c-fault_proofs_dispatch: << pipeline.parameters.fault_proofs_dispatch >>
            c-reproducibility_dispatch: << pipeline.parameters.reproducibility_dispatch >>
            c-kontrol_dispatch: << pipeline.parameters.kontrol_dispatch >>
            c-cannon_full_test_dispatch: << pipeline.parameters.cannon_full_test_dispatch >>
            c-sdk_dispatch: << pipeline.parameters.sdk_dispatch >>
            c-publish_contract_artifacts_dispatch: << pipeline.parameters.publish_contract_artifacts_dispatch >>
            c-stale_check_dispatch: << pipeline.parameters.stale_check_dispatch >>
            c-contracts_coverage_dispatch: << pipeline.parameters.contracts_coverage_dispatch >>
            c-heavy_fuzz_dispatch: << pipeline.parameters.heavy_fuzz_dispatch >>
            c-ai_contracts_test_dispatch: << pipeline.parameters.ai_contracts_test_dispatch >>
            c-rust_ci_dispatch: << pipeline.parameters.rust_ci_dispatch >>
            c-rust_e2e_dispatch: << pipeline.parameters.rust_e2e_dispatch >>
            c-l2_fork_test_dispatch: << pipeline.parameters.l2_fork_test_dispatch >>
      - run:
          name: Detect path changes
          command: .circleci/scripts/compute-changes.sh detect
          environment:
            c-rust_files_changed: "^rust/"
            c-contracts_changed: "^(packages/contracts-bedrock|\\.circleci|\\.github|ops/check-changed)/|^(package\\.json|mise\\.toml)$"
            c-docs_changes_detected: "^docs/public-docs/"
            c-rust_changes_detected: "^(rust|\\.circleci)/"
            c-rust_e2e_changes_detected: "^(rust|op-e2e|\\.circleci)/"
      - run:
          name: Merge continuation configs
          command: .circleci/scripts/merge-configs.sh
      - continuation/continue:
          configuration_path: /tmp/merged-config.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    when:
      equal: ["", << pipeline.git.tag >>]
    jobs:
      - compute-changes

  setup-tag:
    when:
      not:
        equal: ["", << pipeline.git.tag >>]
    jobs:
      - compute-changes:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
