version: 2.1

# Setup Configuration for CircleCI Dynamic Configuration
# Uses a custom compute-changes job to detect changed paths with full shell
# flexibility, then merges continuation configs and continues the pipeline.
# See: https://circleci.com/docs/using-dynamic-configuration/

setup: true

parameters:
  default_docker_image:
    type: string
    default: cimg/base:2026.03
  # Pinned ci-base-clang image (cimg/base + clang/llvm-dev/libclang-dev) for Rust jobs.
  # Provenance is verified by .github/workflows/security.yml.
  rust_base_image:
    type: string
    default: us-docker.pkg.dev/oplabs-tools-artifacts/images/ci-base-clang@sha256:00f641689576d7393d83f6fd49fe1592006148305999f1ba2fc4f1f9d2e8a342
  base_image:
    type: string
    default: default
  # The dispatch parameters are used to manually dispatch pipelines that normally only run post-merge on develop
  # from the CircleCI UI. Example configuration:
  #   when:
  #     or:
  #       - equal: [ "develop", <<pipeline.git.branch>> ]
  #       - equal: [ true, <<pipeline.parameters.main_dispatch>> ]
  # Add a new `*_dispatch` parameter for any pipeline you want manual dispatch for.
  main_dispatch:
    type: boolean
    default: true # default to running main in case the manual run cancelled an automatic run
  fault_proofs_dispatch:
    type: boolean
    default: false
  reproducibility_dispatch:
    type: boolean
    default: false
  kontrol_dispatch:
    type: boolean
    default: false
  cannon_full_test_dispatch:
    type: boolean
    default: false
  sdk_dispatch:
    type: boolean
    default: false
  publish_contract_artifacts_dispatch:
    type: boolean
    default: false
  stale_check_dispatch:
    type: boolean
    default: false
  contracts_coverage_dispatch:
    type: boolean
    default: false
  heavy_fuzz_dispatch:
    type: boolean
    default: false
  ai_contracts_test_dispatch:
    type: boolean
    default: false
  rust_ci_dispatch:
    type: boolean
    default: false
  rust_e2e_dispatch:
    type: boolean
    default: false
  l2_fork_test_dispatch:
    type: boolean
    default: false
  github-event-type:
    type: string
    default: "__not_set__"
  github-event-action:
    type: string
    default: "__not_set__"
  github-event-base64:
    type: string
    default: "__not_set__"
  # go-cache-version can be used as a cache buster when making breaking changes to caching strategy
  go-cache-version:
    type: string
    default: "v0.0"

jobs:
  compute-changes:
    docker:
      - image: << pipeline.parameters.default_docker_image >>
    steps:
      - checkout
      - run:
          name: Compute changed paths and build parameters
          # All pipeline parameter values are forwarded as env vars so that
          # compute-changes.sh can be run and tested locally without CircleCI.
          command: .circleci/scripts/compute-changes.sh
          environment:
            BASE_REVISION: develop
            DEFAULT_DOCKER_IMAGE: << pipeline.parameters.default_docker_image >>
            RUST_BASE_IMAGE: << pipeline.parameters.rust_base_image >>
            BASE_IMAGE: << pipeline.parameters.base_image >>
            MAIN_DISPATCH: << pipeline.parameters.main_dispatch >>
            FAULT_PROOFS_DISPATCH: << pipeline.parameters.fault_proofs_dispatch >>
            REPRODUCIBILITY_DISPATCH: << pipeline.parameters.reproducibility_dispatch >>
            KONTROL_DISPATCH: << pipeline.parameters.kontrol_dispatch >>
            CANNON_FULL_TEST_DISPATCH: << pipeline.parameters.cannon_full_test_dispatch >>
            SDK_DISPATCH: << pipeline.parameters.sdk_dispatch >>
            PUBLISH_CONTRACT_ARTIFACTS_DISPATCH: << pipeline.parameters.publish_contract_artifacts_dispatch >>
            STALE_CHECK_DISPATCH: << pipeline.parameters.stale_check_dispatch >>
            CONTRACTS_COVERAGE_DISPATCH: << pipeline.parameters.contracts_coverage_dispatch >>
            HEAVY_FUZZ_DISPATCH: << pipeline.parameters.heavy_fuzz_dispatch >>
            AI_CONTRACTS_TEST_DISPATCH: << pipeline.parameters.ai_contracts_test_dispatch >>
            RUST_CI_DISPATCH: << pipeline.parameters.rust_ci_dispatch >>
            RUST_E2E_DISPATCH: << pipeline.parameters.rust_e2e_dispatch >>
            L2_FORK_TEST_DISPATCH: << pipeline.parameters.l2_fork_test_dispatch >>
            GITHUB_EVENT_TYPE: << pipeline.parameters.github-event-type >>
            GITHUB_EVENT_ACTION: << pipeline.parameters.github-event-action >>
            GITHUB_EVENT_BASE64: << pipeline.parameters.github-event-base64 >>
            GO_CACHE_VERSION: << pipeline.parameters.go-cache-version >>
      - run:
          name: Merge continuation configs
          command: .circleci/scripts/merge-configs.sh
      - run:
          name: Continue pipeline
          command: |
            circleci-agent step continue \
              --continuation-token "${CIRCLE_CONTINUATION_KEY}" \
              --configuration "$(cat /tmp/merged-config.yml)" \
              --parameters "$(cat /tmp/pipeline-parameters.json)"

workflows:
  setup:
    when:
      equal: ["", << pipeline.git.tag >>]
    jobs:
      - compute-changes

  setup-tag:
    when:
      not:
        equal: ["", << pipeline.git.tag >>]
    jobs:
      - compute-changes:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
