services:
  # Sequencer (op-reth + op-node)
  op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.18.2
    container_name: op-node
    volumes:
      - ./sequencer:/workspace
      - op_reth_data:/workspace/op-reth-data
    working_dir: /workspace
    env_file:
      - .env
    ports:
      - "8547:8547"
      - "9222:9222"
    command: >
      op-node
      --l1=${L1_RPC_URL}
      --l1.beacon=${L1_BEACON_URL}
      --l2=http://op-reth:8551
      --l2.jwt-secret=/workspace/jwt.txt
      --rollup.config=/workspace/rollup.json
      --sequencer.enabled=true
      --sequencer.stopped=false
      --sequencer.max-safe-lag=3600
      --verifier.l1-confs=4
      --p2p.disable
      --rpc.addr=0.0.0.0
      --rpc.port=8547
      --rpc.enable-admin
      --log.level=info
      --log.format=json
    depends_on:
      - op-reth
    healthcheck:
      test: ["CMD", "wget", "--post-data={\"jsonrpc\":\"2.0\",\"method\":\"optimism_syncStatus\",\"params\":[],\"id\":1}", "--header=Content-Type: application/json", "--quiet", "--tries=1", "--timeout=10", "--output-document=-", "http://localhost:8547"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  op-reth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.2.5
    container_name: op-reth
    volumes:
      - ./sequencer:/workspace
      - op_reth_data:/workspace/op-reth-data
    working_dir: /workspace
    env_file:
      - .env
    ports:
      - "8545:8545"
      - "8546:8546"
      - "8551:8551"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -d /workspace/op-reth-data/db ]; then
          echo "Initializing op-reth datadir from genesis..."
          op-reth init --chain=/workspace/genesis.json --datadir=/workspace/op-reth-data
        fi
        echo "Starting op-reth..."
        exec op-reth node --chain=/workspace/genesis.json --datadir=/workspace/op-reth-data --http --http.addr=0.0.0.0 --http.port=8545 --http.api=eth,net,web3,debug,txpool,admin,miner --http.corsdomain=* --ws --ws.addr=0.0.0.0 --ws.port=8546 --ws.api=eth,net,web3,debug,txpool,admin --authrpc.addr=0.0.0.0 --authrpc.port=8551 --authrpc.jwtsecret=/workspace/jwt.txt --rollup.disable-tx-pool-gossip


  # Batcher
  batcher:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.16.9
    container_name: op-batcher
    volumes:
      - ./batcher:/workspace
    working_dir: /workspace
    env_file:
      - ./batcher/.env
      - .env
    environment:
      - OP_BATCHER_L1_ETH_RPC=${L1_RPC_URL}
      # OP_BATCHER_PRIVATE_KEY comes from ./batcher/.env (dedicated batcher key,
      # not the deployer). Do not override it here, or it would fall back to the
      # deployer key.
    command: >
      op-batcher
      --rpc.addr=0.0.0.0
      --rpc.port=8548
      --rpc.enable-admin
      --max-channel-duration=1
      --data-availability-type=calldata
      --resubmission-timeout=30s
      --log.level=info
      --log.format=json
    depends_on:
      op-node:
        condition: service_healthy

  # Proposer
  proposer:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:v1.16.3
    container_name: op-proposer
    volumes:
      - ./proposer:/workspace
    working_dir: /workspace
    env_file:
      - ./proposer/.env
      - .env
    environment:
      - OP_PROPOSER_L1_ETH_RPC=${L1_RPC_URL}
      # OP_PROPOSER_PRIVATE_KEY comes from ./proposer/.env (dedicated proposer key,
      # not the deployer). Do not override it here, or it would fall back to the
      # deployer key.
    command: >
      op-proposer
      --rpc.port=8560
      --rollup-rpc=http://op-node:8547
      --allow-non-finalized=true
      --wait-node-sync=true
      --log.level=info
      --log.format=json
    depends_on:
      op-node:
        condition: service_healthy

  # Fault proofs (not included here)
  # A fresh op-deployer chain is permissioned (game type 1): the proposer creates
  # dispute games that resolve in its favor uncontested, so the chain finalizes
  # without a running challenger. To add a fault-proof challenger and/or move to
  # permissionless (kona / cannon-kona) fault proofs, follow:
  #   - https://docs.optimism.io/chain-operators/guides/configuration/op-challenger-config-guide
  #   - https://docs.optimism.io/chain-operators/tutorials/migrating-permissionless
  #   - https://docs.optimism.io/chain-operators/tutorials/kona-custom-prestate

volumes:
  op_reth_data:
