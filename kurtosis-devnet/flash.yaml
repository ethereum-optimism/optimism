optimism_package:
  faucet:
    enabled: true
    image: {{ localDockerImage "op-faucet" }}
  chains:
    op-kurtosis:
      participants:
        node0:
          sequencer: true
          el:
            type: op-geth
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            enabled: true
            bootstrap: true
        node1:
          sequencer: true
          el:
            type: op-reth
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
            log_level: debug
          conductor_params:
            enabled: true
        # Flashblocks
        fb0:
          sequencer: true
          el:
            type: op-reth
          el_builder:
            type: op-rbuilder
          cl_builder:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          mev_params:
            enabled: true
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            enabled: true
            admin: true
            proxy: true
            websocket_enabled: true
        fb1:
          sequencer: true
          el:
            type: op-reth
          el_builder:
            type: op-rbuilder
          cl_builder:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          mev_params:
            enabled: true
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            enabled: true
            admin: true
            proxy: true
            websocket_enabled: true
      network_params:
        network: "kurtosis"
        network_id: "2151908"
        seconds_per_slot: 2
        fjord_time_offset: 0
        granite_time_offset: 0
        holocene_time_offset: 0
        fund_dev_accounts: true
      flashblocks_websocket_proxy_params:
        enabled: true
      flashblocks_rpc_params:
        type: op-reth
      batcher_params:
        image: {{ localDockerImage "op-batcher" }}
        pprof_enabled: true
        extra_params: []
      proposer_params:
        image: {{ localDockerImage "op-proposer" }}
        game_type: 1
        proposal_interval: 10m
      signer_params:
        enabled: true
      blockscout_params:
        enabled: true
  op_contract_deployer_params:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-deployer:v0.4.0-rc.2
    l1_artifacts_locator: https://storage.googleapis.com/oplabs-contract-artifacts/artifacts-v1-02024c5a26c16fc1a5c716fff1c46b5bf7f23890d431bb554ddbad60971211d4.tar.gz
    l2_artifacts_locator: https://storage.googleapis.com/oplabs-contract-artifacts/artifacts-v1-02024c5a26c16fc1a5c716fff1c46b5bf7f23890d431bb554ddbad60971211d4.tar.gz
  global_log_level: "info"
  global_node_selectors: {}
  global_tolerations: []
  persistent: false
  challengers:
    challenger0: &x-challenger
      participants: "*"
      image: {{ localDockerImage "op-challenger" }}
      cannon_trace_types: ["super-cannon", "super-permissioned"]
    challenger1:
      <<: *x-challenger
  superchains:
    superchain0:
  supervisors:
    supervisor0: &x-supervisor
      image: {{ localDockerImage "op-supervisor" }}
      superchain: superchain0
    supervisor1:
      <<: *x-supervisor
  test-sequencers:
    sequencer0:
      image: {{ localDockerImage "op-test-sequencer" }}
      enabled: true
ethereum_package:
  participants:
  - el_type: geth
    cl_type: teku
  network_params:
    preset: minimal
    genesis_delay: 5
    additional_preloaded_contracts: '
      {
        "0x4e59b44847b379578588920cA78FbF26c0B4956C": {
          "balance": "0ETH",
          "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3",
          "storage": {},
          "nonce": "1"
        }
      }
    '
