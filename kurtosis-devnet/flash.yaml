optimism_package:
  faucet:
    enabled: true
    image: {{ localDockerImage "op-faucet" }}
  chains:
    op-kurtosis:
      participants:
        node0:
          sequencer: true
          el:
            type: op-geth
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            image: {{ localDockerImage "op-conductor" }}
            enabled: true
            bootstrap: true
        node1:
          sequencer: true
          el:
            type: op-reth
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            image: {{ localDockerImage "op-conductor" }}
            enabled: true
        # Flashblocks
        fb0:
          sequencer: true
          el:
            type: op-reth
          el_builder:
            type: op-rbuilder
          cl_builder:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          mev_params:
            enabled: true
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            image: {{ localDockerImage "op-conductor" }}
            enabled: true
            admin: true
            proxy: true
            websocket_enabled: true
        fb1:
          sequencer: true
          el:
            type: op-reth
          el_builder:
            type: op-rbuilder
          cl_builder:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          mev_params:
            enabled: true
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
          conductor_params:
            image: {{ localDockerImage "op-conductor" }}
            enabled: true
            admin: true
            proxy: true
            websocket_enabled: true
      network_params:
        network: "kurtosis"
        network_id: "2151908"
        seconds_per_slot: 2
        fjord_time_offset: 0
        granite_time_offset: 0
        holocene_time_offset: 0
        fund_dev_accounts: true
      flashblocks_websocket_proxy_params:
        enabled: true
      flashblocks_rpc_params:
        type: op-reth
      batcher_params:
        image: {{ localDockerImage "op-batcher" }}
        extra_params: []
      signer_params:
        enabled: true
      blockscout_params:
        enabled: true
  op_contract_deployer_params:
    image: {{ localDockerImage "op-deployer" }}
    l1_artifacts_locator: {{ localContractArtifacts "l1" }}
    l2_artifacts_locator: {{ localContractArtifacts "l2" }}
    overrides:
      faultGameAbsolutePrestate: {{ localPrestate.Hashes.prestate_mt64 }}
  global_log_level: "info"
  global_node_selectors: {}
  global_tolerations: []
  persistent: false
  challengers:
    challenger0: &x-challenger
      enabled: true
      image: {{ localDockerImage "op-challenger" }}
      participants: "*"
      cannon_prestates_url: {{ localPrestate.URL }}
      cannon_trace_types: ["cannon", "permissioned"]
  superchains:
    superchain0:
  supervisors:
    supervisor0: &x-supervisor
      superchain: superchain0
    supervisor1:
      <<: *x-supervisor
  test-sequencers:
    sequencer0:
      enabled: true
ethereum_package:
  participants:
  - el_type: geth
    cl_type: lighthouse
    cl_image: "ethpandaops/lighthouse:stable-e21198c"
  network_params:
    preset: minimal
    genesis_delay: 5
    additional_preloaded_contracts: '
      {
        "0x4e59b44847b379578588920cA78FbF26c0B4956C": {
          "balance": "0ETH",
          "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3",
          "storage": {},
          "nonce": "1"
        }
      }
    '
