# This devnet uses an eigenda-proxy to interact with the eigenda sepolia testnet network.
# As a requirement, you must first create and populate the eigenda-secrets.json file
# 1. cp eigenda-secrets.example.json eigenda-secrets.json
# 2. Populate the file with the required values
# TODO: Connect this with an eigenda v1 kurtosis devnet instead of using our sepolia testnet.
#       See https://github.com/Layr-Labs/avs-devnet/blob/main/examples/eigenda.yaml
{{- $context := or . (dict)}}
# TODO: I hate yaml templating... should really move to something more reasonable. CUE perhaps?
# use proxy by default, otherwise connect with eigenda sepolia backend
{{- $useProxyMemstore := dig "eigenda-proxy" "useMemstore" true $context }}
{{- $proxyDispersalBackend := dig "eigenda-proxy" "dispersalBackend" "v1" $context }}
{{- $eigendaV1SignerKey := dig "eigenda-proxy" "secrets" "eigenda.signer-private-key-hex" "" $context }}
{{- $eigendaV2SignerKey := dig "eigenda-proxy" "secrets" "eigenda.v2.signer-payment-key-hex" "" $context }}
{{- $eigendaBackendEthRpc := dig "eigenda-proxy" "secrets" "eigenda.eth_rpc" "" $context }}
{{- if not $useProxyMemstore}}
  # make sure the secrets are populated when using eigenda-sepolia backend
  {{- if or (eq $eigendaV1SignerKey "") (eq $eigendaV2SignerKey "") (eq $eigendaBackendEthRpc "") }}
    {{- fail "Missing required eigenda-proxy eigenda-backend secrets." }}
  {{- end }}
{{- end }}
---
optimism_package:
  altda_deploy_config:
    use_altda: true
    # We use the generic commitment which means that the dachallenge contract won't get deployed.
    # We align with l2beat's analysis of the da_challenge contract not being economically viable,
    # so even if a rollup failsover to keccak commitments, not using the da_challenge contract is fine
    # (has same security as using it).
    # See https://l2beat.com/scaling/projects/redstone#da-layer-risk-analysis and
    # https://discord.com/channels/1244729134312198194/1260612364865245224/1290294353688002562 for
    # an economic analysis of the da challenge contract.
    da_commitment_type: GenericCommitment
    da_challenge_window: 16
    da_resolve_window: 16
    da_bond_size: 0
    da_resolver_refund_percentage: 0
  chains:
    op-kurtosis:
      participants:
        node0:
          el:
            type: op-geth
            # latest tag is currently broken until the next stable release, see https://github.com/ethereum-optimism/op-geth/pull/515
            # Also see discussion in https://discord.com/channels/1244729134312198194/1260624141497798706/1342556343495692320
            image: "us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101602.1-rc.1"
            log_level: ""
            extra_env_vars: {}
            extra_labels: {}
            extra_params: []
          cl:
            type: op-node
            # pinned to op-node v1.13.7 until tests are compatible with v1.14.1+
            # TODO(iquidus): Update devnet framework to support rollup.l1-chain-config
            image: "us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.13.7"
            log_level: "debug"
            extra_env_vars: {}
            extra_labels: {}
            extra_params: []
      network_params:
        network: "kurtosis"
        network_id: "2151908"
        seconds_per_slot: 2
        fjord_time_offset: 0
        granite_time_offset: 0
        holocene_time_offset: 0
        fund_dev_accounts: true
      batcher_params:
        image: {{ localDockerImage "op-batcher" }}
        extra_params:
          - --max-channel-duration
          - '{{ dig "batcher" "max-channel-duration" 2 $context }}'
          - --altda.max-concurrent-da-requests
          - '{{ dig "batcher" "altda.max-concurrent-da-requests" 1 $context }}'
          # max-pending-tx should be same as altda.max-concurrent-da-requests given that each commitment is sent as a single l1 tx right now.
          # See https://github.com/ethereum-optimism/SUPs/pull/1 for progress on batching commitments.
          - --max-pending-tx
          - '{{ dig "batcher" "altda.max-concurrent-da-requests" 1 $context }}'
          - --target-num-frames
          - '{{ dig "batcher" "target-num-frames" 1 $context }}'
          - --max-l1-tx-size-bytes
          - '{{ dig "batcher" "max-l1-tx-size-bytes" 1000 $context }}'
          - --batch-type
          - '{{ dig "batcher" "batch-type" 1 $context }}'
      proposer_params:
        image: {{ localDockerImage "op-proposer" }}
        extra_params: []
        game_type: 1
        proposal_interval: 10m
      da_params:
        enabled: true
        image: ghcr.io/layr-labs/eigenda-proxy:2.2.1
        cmd:
          - --addr=0.0.0.0
          - --port=3100
          - --storage.backends-to-enable=V1,V2
          - --storage.dispersal-backend={{ $proxyDispersalBackend }} #v1 or v2
          - --api-enabled=admin # to enable changing dispersal-backend to v2 without restarting
          - --eigenda.v2.max-blob-length=1MiB # makes startup faster by only loading 1MiB/2MiB of G1/G2 SRS points.
          - --eigenda.v2.network=sepolia_testnet
        {{- if $useProxyMemstore }}
          - --memstore.enabled
          - --memstore.expiration=30m
        {{- else }} # connect to eigenda sepolia backend
          # V1 flags
          - --eigenda.disperser-rpc=disperser-testnet-sepolia.eigenda.xyz:443
          - --eigenda.svc-manager-addr=0x3a5acf46ba6890B8536420F4900AC9BC45Df4764
          # The two params below are loaded from the eigenda-secrets.json file
          - --eigenda.signer-private-key-hex={{ $eigendaV1SignerKey }}
          - --eigenda.eth-rpc={{ $eigendaBackendEthRpc }}
          # V2 flags
          - --eigenda.v2.cert-verifier-router-or-immutable-verifier-addr=0x17ec4112c4BbD540E2c1fE0A49D264a280176F0D
          - --eigenda.v2.disperser-rpc=disperser-testnet-sepolia.eigenda.xyz:443
          - --eigenda.v2.signer-payment-key-hex={{ $eigendaV2SignerKey }}
          - --eigenda.v2.eth-rpc={{ $eigendaBackendEthRpc }}
        {{- end }}

  challengers:
    challenger:
      # TODO: reenable once we start testing secure integrations
      enabled: false
      image: {{ localDockerImage "op-challenger" }}
      participants: "*"
      cannon_prestates_url: {{ localPrestate.URL }}
      cannon_trace_types: ["cannon", "permissioned"]
      extra_params: []
  global_log_level: "info"
  global_node_selectors: {}
  global_tolerations: []
  persistent: false
ethereum_package:
  participants:
    - el_type: geth
      el_extra_params:
        - --graphql # needed to query for batcher-inbox txs to test failover working correctly
      cl_type: teku
      cl_image: consensys/teku:25.7.1
  network_params:
    preset: minimal
    genesis_delay: 5
    additional_preloaded_contracts: |
      {
        "0x4e59b44847b379578588920cA78FbF26c0B4956C": {
          "balance": "0ETH",
          "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3",
          "storage": {},
          "nonce": "1"
        }
      }
