[package]
name = "op-batcher-consensus-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "op-batcher-consensus-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
commonware-cryptography = { git = "https://github.com/commonwarexyz/monorepo", package = "commonware-cryptography", features = ["std"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
