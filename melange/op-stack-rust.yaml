# Consolidated build for the Rust services of the optimism monorepo. kona,
# op-reth, and lokahi live in the same cargo workspace (rust/) with a
# single Cargo.lock, so one melange run shares the whole common dependency
# graph (alloy, op-alloy, revm, ...) across all six binaries instead of
# compiling it once per CI leg. The main pipeline builds all six binaries once
# into a shared target dir, then the ordered subpackage pipelines install those
# outputs into separate APKs.
#
# Each binary is its own subpackage/APK so images pull only what they run:
# each Kona image pulls its matching binary, while op-challenger pulls just
# kona-host. The op-stack-rust package itself is an empty meta package.
package:
  name: op-stack-rust
  version: "0.0.0"
  epoch: 0
  description: op-stack-rust — meta package for the optimism monorepo Rust services
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - build-base
      - cargo-auditable
      - rust
      - openssl-dev
      - perl
      - protobuf-dev
      - clang-19
      - libclang-cpp-19
      # opt-in mold linking when the cargo/build pipeline uses it.
      - mold
  environment:
    # The workflow selects MELANGE_CARGO_PROFILE for the main rust/ workspace:
    # fast-build for PRs and maxperf for develop/tag builds. CARGO_HOME and
    # CARGO_TARGET_DIR point at /var/cache/melange; melange/pipelines/cargo/build
    # derives a per-modroot target subdir from the base. GHA cache restores
    # melange-cache/ before each op-stack-rust job.
    CARGO_HOME: /var/cache/melange/cargo
    CARGO_TARGET_DIR: /var/cache/melange/target

# Melange runs the main pipeline before subpackage pipelines. Build all six
# main-workspace binaries here so each subpackage below only packages an
# existing output. Selecting one package at a time changes feature unification
# and can make Cargo recompile and relink outputs from the combined command.
pipeline:
  - uses: cargo/build
    with:
      install-output: "false"
      modroot: rust
      profile: "${MELANGE_CARGO_PROFILE}"
      opts: --locked --package op-reth --package kona-node --package kona-host --package kona-client --package kona-sp1-proposer --package lokahi

subpackages:
  - name: op-reth
    description: op-reth — OP Stack Reth execution client
    pipeline:
      - runs: |
          profile="${MELANGE_CARGO_PROFILE:-release}"
          install -Dm755 \
            "${CARGO_TARGET_DIR}/rust/${profile}/op-reth" \
            "${{targets.contextdir}}/usr/local/bin/op-reth"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  - name: kona-node
    description: kona-node — OP Stack Kona rollup node
    pipeline:
      - runs: |
          profile="${MELANGE_CARGO_PROFILE:-release}"
          install -Dm755 \
            "${CARGO_TARGET_DIR}/rust/${profile}/kona-node" \
            "${{targets.contextdir}}/usr/local/bin/kona-node"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  - name: kona-host
    description: kona-host — OP Stack Kona fault proof host
    pipeline:
      - runs: |
          profile="${MELANGE_CARGO_PROFILE:-release}"
          install -Dm755 \
            "${CARGO_TARGET_DIR}/rust/${profile}/kona-host" \
            "${{targets.contextdir}}/usr/local/bin/kona-host"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  - name: kona-client
    description: kona-client — OP Stack Kona fault proof client
    pipeline:
      - runs: |
          profile="${MELANGE_CARGO_PROFILE:-release}"
          install -Dm755 \
            "${CARGO_TARGET_DIR}/rust/${profile}/kona-client" \
            "${{targets.contextdir}}/usr/local/bin/kona-client"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  - name: kona-sp1-proposer
    description: kona-sp1-proposer — OP Stack SP1 fault proof proposer
    pipeline:
      - runs: |
          profile="${MELANGE_CARGO_PROFILE:-release}"
          install -Dm755 \
            "${CARGO_TARGET_DIR}/rust/${profile}/kona-sp1-proposer" \
            "${{targets.contextdir}}/usr/local/bin/kona-sp1-proposer"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  - name: lokahi
    description: lokahi — OP Stack multi-chain consensus-layer host
    pipeline:
      - runs: |
          profile="${MELANGE_CARGO_PROFILE:-release}"
          install -Dm755 \
            "${CARGO_TARGET_DIR}/rust/${profile}/lokahi" \
            "${{targets.contextdir}}/usr/local/bin/lokahi"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  # The monorepo vendors op-rbuilder and rollup-boost as NESTED workspaces
  # (own Cargo.toml + Cargo.lock, not members of the main rust/ workspace), and
  # upstream's build-images workflow publishes both from these copies. They
  # share this leg's checkout but not the main workspace's dependency build.
  - name: op-rbuilder
    description: op-rbuilder — OP Stack block builder (monorepo vendored copy)
    pipeline:
      - uses: cargo/build
        with:
          prefix: usr/local
          modroot: rust/op-rbuilder
          output: op-rbuilder
          opts: --release --locked --package op-rbuilder
      # Upstream's op-rbuilder image ships the binary as /app/rbuilder (its
      # Dockerfile heritage); match it for drop-in parity.
      - runs: |
          mkdir -p "${{targets.contextdir}}/app"
          mv "${{targets.contextdir}}/usr/local/bin/op-rbuilder" \
             "${{targets.contextdir}}/app/rbuilder"
      - uses: strip
        with:
          opts: -g --remove-section=.note.package

  - name: rollup-boost
    description: rollup-boost — OP Stack block builder multiplexer (monorepo vendored copy)
    pipeline:
      - uses: cargo/build
        with:
          # /usr/local/bin, where upstream's images install binaries.
          prefix: usr/local
          modroot: rust/rollup-boost
          output: rollup-boost
          opts: --release --locked --package rollup-boost
      - uses: strip
        with:
          opts: -g --remove-section=.note.package
