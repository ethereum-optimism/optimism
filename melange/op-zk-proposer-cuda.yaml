# GPU dependencies of the op-zk-proposer-cuda image, which runs op-zk-proposer in
# OP_ZK_PROPOSER_PROOF_PROVIDER=local-cuda mode. The binary itself comes from
# the op-stack-rust op-zk-proposer APK.
#
# The pins must match the linked SP1 SDK: sp1-gpu-server must be the sp1-sdk
# version in rust/Cargo.lock (op-zk-proposer checks its --version at startup and
# speaks the sp1-cuda socket protocol of that version),
# and the PLONK circuits must be sp1-prover's SP1_CIRCUIT_VERSION. libcudart
# matches the CUDA 12.8 toolkit that sp1-gpu-server links against.
#
# The planner builds every stack on x86_64 and aarch64, but these binaries are
# x86_64 only, so every step is gated on the arch and the aarch64 APK is empty.
package:
  name: op-zk-proposer-cuda
  version: "0.0.0"
  epoch: 0
  description: op-zk-proposer-cuda — sp1-gpu-server, the CUDA 12.8 runtime, and the SP1 PLONK circuits
  copyright:
    - license: MIT OR Apache-2.0
    - license: LicenseRef-NVIDIA-CUDA

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - gnutar
      - xz
      - gzip

# One package, not subpackages: apko rejects an image whose packages share an origin but whose
# fetches give that origin different SBOM source data. `fetch` extracts with
# `tar -C <directory>`, which must exist.
pipeline:
  - if: ${{build.arch}} == 'x86_64'
    runs: mkdir -p sp1-gpu-server cudart plonk
  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://github.com/succinctlabs/sp1/releases/download/v6.10.0/sp1_gpu_server_v6.10.0_x86_64.tar.gz
      expected-sha256: 20ee4b96fa6e5a2ce8a9da523ee42b75c698658ae1d4366e57b52bdd642f1bdb
      directory: sp1-gpu-server
      strip-components: 0
      delete: true
  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-12.8.90-archive.tar.xz
      expected-sha256: 8d566b5fe745c46842dc16945cf36686227536decd2302c372be86da37faca68
      directory: cudart
      delete: true
  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://sp1-circuits.s3-us-east-2.amazonaws.com/v6.1.0-plonk.tar.gz
      expected-sha256: b3e2f5b5dd5ca89675c73975d2d1cc4a0f9e7cde048ec5354dabc7b0694aa39b
      directory: plonk
      strip-components: 0
      delete: true
  # op-zk-proposer starts /usr/local/bin/sp1-gpu-server (GPU_SERVER in prover/cuda.rs).
  - if: ${{build.arch}} == 'x86_64'
    runs: |
      install -Dm755 sp1-gpu-server/sp1-gpu-server \
        "${{targets.destdir}}/usr/local/bin/sp1-gpu-server"
  # Only the CUDA runtime: the archive's stub libcuda.so would shadow the node's driver library.
  - if: ${{build.arch}} == 'x86_64'
    runs: |
      lib="${{targets.destdir}}/usr/lib"
      mkdir -p "$lib"
      cp -P cudart/lib/libcudart.so.12 cudart/lib/libcudart.so.12.8.90 "$lib/"
      install -Dm644 cudart/LICENSE \
        "${{targets.destdir}}/usr/share/licenses/cuda-cudart-12/LICENSE"
  # sp1-prover reads ${SP1_PLONK_CIRCUIT_PATH}/<SP1_CIRCUIT_VERSION> and downloads the circuits
  # unless that directory holds a .complete marker (src/build.rs).
  - if: ${{build.arch}} == 'x86_64'
    runs: |
      dir="${{targets.destdir}}/opt/sp1/circuits/plonk"
      mkdir -p "$dir"
      mv plonk "$dir/v6.1.0"
      touch "$dir/v6.1.0/.complete"
