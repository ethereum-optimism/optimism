# op-zk-proposer with the GPU dependencies of OP_ZK_PROPOSER_PROOF_PROVIDER=local-cuda.
# The node provides the NVIDIA driver; GKE mounts its libraries at /usr/local/nvidia/lib64.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle>=20260909-r3
    - wolfi-baselayout
    - ca-certificates
    - busybox
    - glibc
    - libgcc
    - libstdc++
    - openssl
    - op-zk-proposer@local
    - sp1-gpu-server@local
    - cuda-cudart-12@local
    - sp1-plonk-circuits@local
    - apk-tools

archs:
  - x86_64

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  # The SP1 SDK starts $HOME/.sp1/bin/sp1-gpu-server. .sp1 stays root-owned, so the SDK
  # cannot download a replacement server.
  HOME: /home/kona
  SP1_PLONK_CIRCUIT_PATH: /opt/sp1/circuits/plonk
  LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/nvidia/lib64

accounts:
  groups:
    - groupname: kona
      gid: 10001
  users:
    - username: kona
      uid: 10001
      gid: 10001
      homedir: /home/kona
  # uid 10001, matching the other Kona service images.
  run-as: 10001

paths:
  - path: /home/kona
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755

entrypoint:
  command: /usr/local/bin/op-zk-proposer

annotations:
  org.opencontainers.image.source: https://github.com/ethereum-optimism/optimism
  org.opencontainers.image.title: op-zk-proposer-cuda
