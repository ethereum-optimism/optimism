# K8s Job to rewind a reth node using op-wheel.
#
# Based on the op-reth Helm chart (optimism-charts/charts/node/charts/op-reth)
# and the prod-mainnet deployment (k8s/opc/oplabs-prod-mainnet/op-opn-reth-f-snapsync-0).
#
# Chart defaults used:
#   - StatefulSet name: "op-reth"  (fullnameOverride in values.yaml)
#   - Container name:   "op-reth"  (.Chart.Name)
#   - Volume name:      "datadir"  (volumeClaimTemplates name for NVMe)
#   - PVC name:         "datadir-op-reth-0"  (template: {vct-name}-{sts-name}-{ordinal})
#   - Mount path:       "/db"
#   - Binary path:      "/usr/local/bin/op-reth"
#   - Chain:            "optimism"  (RETH_CHAIN env var)
#
# Usage:
#   1. Scale down the reth StatefulSet:
#      kubectl scale statefulset op-reth -n op-opn-reth-f-snapsync-0 --replicas=0
#   2. Wait for the pod to terminate:
#      kubectl wait --for=delete pod/op-reth-0 -n op-opn-reth-f-snapsync-0 --timeout=300s
#   3. Apply this Job (set the target block number first):
#      kubectl apply -f k8s-reth-rewind-job.yaml
#   4. Wait for completion:
#      kubectl wait --for=condition=complete job/reth-rewind -n op-opn-reth-f-snapsync-0 --timeout=3600s
#   5. Scale the StatefulSet back up:
#      kubectl scale statefulset op-reth -n op-opn-reth-f-snapsync-0 --replicas=1

apiVersion: batch/v1
kind: Job
metadata:
  name: reth-rewind
  namespace: op-opn-reth-f-snapsync-0
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 600

      # Must schedule on the same node as the reth pod.
      # NVMe PVCs use local-storage, so the PV is bound to a specific node.
      nodeSelector:
        datadir: op-opn-reth-f-snapsync-0
      tolerations:
        - key: "purpose"
          operator: "Equal"
          value: "nvme"
          effect: "NoSchedule"

      # Copy the reth binary from the reth image into a shared volume
      # so the op-wheel container can invoke it.
      initContainers:
        - name: copy-reth
          image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v1.11.5-rc.1
          command: ["cp", "/usr/local/bin/op-reth", "/shared/op-reth"]
          volumeMounts:
            - name: shared-bin
              mountPath: /shared

      containers:
        - name: rewind
          image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-wheel:latest
          command: ["op-wheel"]
          args:
            - engine
            - rewind-reth
            - offline
            - --to
            - "12345678"          # <-- Set target block number
            - --reth-binary
            - /shared/op-reth     # Copied from init container
            - --reth-datadir
            - /db                 # Matches RETH_DATADIR from chart defaults
            - --reth-chain
            - optimism            # Matches RETH_CHAIN from prod-mainnet config
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: datadir
              mountPath: /db
            - name: shared-bin
              mountPath: /shared

      volumes:
        # The PVC created by the op-reth StatefulSet's volumeClaimTemplates.
        # Name format: {vct-name}-{statefulset-name}-{ordinal}
        # vct-name = "datadir", statefulset-name = "op-reth", ordinal = 0
        - name: datadir
          persistentVolumeClaim:
            claimName: datadir-op-reth-0
        - name: shared-bin
          emptyDir: {}
