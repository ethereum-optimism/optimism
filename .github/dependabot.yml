version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      day: "tuesday"
      time: "14:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps: "
    labels:
      - "M-dependabot"
    ignore:
      # go-ethereum version bumps are made deliberately: a release can change gas accounting,
      # blob schedules and Engine API versions the OP Stack must follow (see the "go-ethereum
      # version bumps" section of docs/ai/opgeth-decoupling.md). Listing the update types keeps
      # security updates enabled.
      - dependency-name: "github.com/ethereum/go-ethereum"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # Kona - Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/kona"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "deps: "
    labels:
      - "M-dependabot"
      - "F-deps"
    ignore:
      - dependency-name: "*"
        # patch and minor updates don't matter for libraries
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
