name: build images

on:
  push:
    branches:
      - 'develop'
    tags:
      - '*/v*'
      - 'v*'
  pull_request:
    branches:
      - 'develop'
    paths:
      - 'op-*/**'
      - 'cannon/**'
      - 'packages/contracts-bedrock/**'
      - 'rust/**'
      - 'ops/docker/**'
      - 'ops/scripts/compute-git-versions.sh'
      - 'docker-bake.hcl'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-images.yaml'
      - '.github/docker-images.json'
      - '.github/actions/docker-build-prep/**'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      is_release: ${{ steps.plan.outputs.is_release }}
      go_check_images_json: ${{ steps.checks.outputs.go_check_images_json }}
      rust_check_images_json: ${{ steps.checks.outputs.rust_check_images_json }}
      has_go_check_images: ${{ steps.checks.outputs.has_go_check_images }}
      has_rust_check_images: ${{ steps.checks.outputs.has_rust_check_images }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        uses: ethereum-optimism/factory/actions/plan@b03c7dce427d3288cc3b19233c07fa455c110fa3 # main
        with:
          config: .github/docker-images.json
      - name: Compute cross-platform check sub-matrices
        id: checks
        env:
          MATRIX: ${{ steps.plan.outputs.matrix_json }}
        run: |
          set -euo pipefail
          go_json=$(echo "$MATRIX" | jq -c '[.[] | select(.check == "go") | .image_name]')
          rust_json=$(echo "$MATRIX" | jq -c '[.[] | select(.check == "rust") | .image_name]')
          has_go=$( [[ $(echo "$go_json" | jq 'length') -gt 0 ]] && echo true || echo false )
          has_rust=$( [[ $(echo "$rust_json" | jq 'length') -gt 0 ]] && echo true || echo false )
          {
            echo "go_check_images_json=$go_json"
            echo "rust_check_images_json=$rust_json"
            echo "has_go_check_images=$has_go"
            echo "has_rust_check_images=$has_rust"
          } >> "$GITHUB_OUTPUT"
          echo "go_check_images=$go_json"
          echo "rust_check_images=$rust_json"

  prep:
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.prep.outputs.versions }}
      date: ${{ steps.prep.outputs.date }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/docker-build-prep
        id: prep

  local:
    needs: [plan, prep]
    if: |
      needs.plan.outputs.has_builds == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix_json) }}
    uses: ethereum-optimism/factory/.github/workflows/docker.yaml@b03c7dce427d3288cc3b19233c07fa455c110fa3 # main
    with:
      mode: ${{ matrix.mode }}
      image_name: ${{ matrix.image_name }}
      bake_file: ${{ matrix.bake_file }}
      target: ${{ matrix.target }}
      tag: ${{ matrix.tag }}
      gcp_project_id: ${{ vars.GCP_PROJECT_ID_OPLABS_TOOLS_ARTIFACTS }}
      registry: us-docker.pkg.dev/oplabs-tools-artifacts/images
      env: |
        GIT_VERSION=${{ fromJson(needs.prep.outputs.versions)[matrix.image_name] }}
      set: |
        *.args.GIT_COMMIT=${{ github.sha }}
        *.args.GIT_DATE=${{ needs.prep.outputs.date }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  fork:
    needs: [plan, prep]
    if: |
      needs.plan.outputs.has_builds == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix_json) }}
    uses: ethereum-optimism/factory/.github/workflows/docker.yaml@b03c7dce427d3288cc3b19233c07fa455c110fa3 # main
    with:
      mode: ${{ matrix.mode }}
      image_name: ${{ matrix.image_name }}
      bake_file: ${{ matrix.bake_file }}
      target: ${{ matrix.target }}
      tag: 24h
      registry: ttl.sh/${{ github.sha }}
      env: |
        GIT_VERSION=${{ fromJson(needs.prep.outputs.versions)[matrix.image_name] }}
      set: |
        *.args.GIT_COMMIT=${{ github.sha }}
        *.args.GIT_DATE=${{ needs.prep.outputs.date }}
    permissions:
      contents: read

  check-cross-platform:
    needs: [plan, local, fork]
    if: |
      always()
      && needs.plan.outputs.has_go_check_images == 'true'
      && (needs.local.result == 'success' || needs.fork.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        image_name: ${{ fromJson(needs.plan.outputs.go_check_images_json) }}
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.fork.result == 'success' && format('ttl.sh/{0}/{1}:24h', github.sha, matrix.image_name) || format('us-docker.pkg.dev/oplabs-tools-artifacts/images/{0}:{1}', matrix.image_name, github.sha) }}
    steps:
      - name: Run image
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: docker run "$IMAGE" "$IMAGE_NAME" --version

  check-cross-platform-rust:
    needs: [plan, local, fork]
    if: |
      always()
      && needs.plan.outputs.has_rust_check_images == 'true'
      && (needs.local.result == 'success' || needs.fork.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        image_name: ${{ fromJson(needs.plan.outputs.rust_check_images_json) }}
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.fork.result == 'success' && format('ttl.sh/{0}/{1}:24h', github.sha, matrix.image_name) || format('us-docker.pkg.dev/oplabs-tools-artifacts/images/{0}:{1}', matrix.image_name, github.sha) }}
    steps:
      - name: Run image
        run: docker run "$IMAGE" --version

  # Gate job for branch protection — provides a stable check name regardless of dynamic matrix contents.
  docker-build-result:
    needs: [plan, local, fork, check-cross-platform, check-cross-platform-rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_BUILDS: ${{ needs.plan.outputs.has_builds }}
          LOCAL_RESULT: ${{ needs.local.result }}
          FORK_RESULT: ${{ needs.fork.result }}
          HAS_GO: ${{ needs.plan.outputs.has_go_check_images }}
          HAS_RUST: ${{ needs.plan.outputs.has_rust_check_images }}
          GO_CHECK_RESULT: ${{ needs.check-cross-platform.result }}
          RUST_CHECK_RESULT: ${{ needs.check-cross-platform-rust.result }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "plan failed: $PLAN_RESULT"
            exit 1
          fi

          if [[ "$HAS_BUILDS" != "true" ]]; then
            echo "No images needed building — success"
            exit 0
          fi

          if [[ "$IS_FORK_PR" == "true" ]]; then
            RESULT="$FORK_RESULT"
          else
            RESULT="$LOCAL_RESULT"
          fi

          if [[ "$RESULT" != "success" ]]; then
            echo "Build failed with result: $RESULT"
            exit 1
          fi

          if [[ "$HAS_GO" == "true" && "$GO_CHECK_RESULT" != "success" ]]; then
            echo "Go cross-platform check failed: $GO_CHECK_RESULT"
            exit 1
          fi

          if [[ "$HAS_RUST" == "true" && "$RUST_CHECK_RESULT" != "success" ]]; then
            echo "Rust cross-platform check failed: $RUST_CHECK_RESULT"
            exit 1
          fi

          echo "All builds and checks passed"
