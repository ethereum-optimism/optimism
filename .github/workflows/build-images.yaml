# Caller for ethereum-optimism/factory build-images.yaml.
# Copy to .github/workflows/build-images.yaml in the repository that owns the images.
# The repository needs .github/images.json (see docs/images-catalog.md) and a
# GitHub environment named "release" for publishing. Require the "result" job of
# this workflow as the status check.
name: Build images

on:
  push:
    branches:
      - develop
    tags:
      - '*/v*'
      - 'v*'
  pull_request:
  merge_group:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-images:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ethereum-optimism/factory/.github/workflows/build-images.yaml@78faf7acc20c29aa1f81508bda39c5a318e0cf8f
